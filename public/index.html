<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Territory — Sdolars</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b15;color:#f5f8ff;font-family:Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit;border:0}
#game{height:100dvh;max-width:1180px;margin:auto;display:flex;flex-direction:column;background:#031426;overflow:hidden}
.header{height:154px;flex:none;display:flex;align-items:center;gap:16px;padding:12px 18px;background:linear-gradient(#041a30,#021223);border-bottom:3px solid #177dbe}
.profile{display:flex;align-items:center;gap:12px;min-width:360px;flex:1}
.avatar{width:120px;height:120px;border:3px solid #72c9ff;border-radius:20px;overflow:hidden;position:relative;background:#102b43;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.level{position:absolute;bottom:-2px;left:-2px;background:#082744;border:2px solid #6bc8ff;border-radius:13px;padding:4px 12px;font-size:24px;font-weight:900}
.name{font-size:38px;font-weight:900;line-height:1}
.chapter{color:#75caff;font-size:21px;font-weight:800;margin-top:6px}
.xp{height:23px;max-width:330px;border:2px solid #2178b2;border-radius:15px;overflow:hidden;background:#06182b;margin-top:7px}
.xp i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#0bc0f0,#27d8ff)}
.xpt{font-size:16px;margin-top:3px}
.headerRight{width:58%;display:flex;flex-direction:column;gap:9px}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resource{height:56px;background:#061a30;border:2px solid #226ca3;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:20px;font-weight:900}
.resource b{font-size:25px} .gold b{color:#ffd431} .diamond b{color:#42dfff} .energy b{color:#ffd329}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tool{height:62px;background:#08243d;border:2px solid #216fa7;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;position:relative}
.toolIcon{font-size:25px} .badge{position:absolute;right:-7px;top:-9px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ff3857;border:2px solid #ff9bae;font-weight:900}

.world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,10,20,.02),rgba(0,10,20,.18) 75%,rgba(1,10,18,.52));pointer-events:none}
.world>*{position:absolute;z-index:2}
.questBox{left:2%;top:3%;width:38%;min-height:116px;background:linear-gradient(135deg,#092a48,#06182c);border:3px solid #1687d5;border-radius:20px;padding:12px 18px;text-align:left;box-shadow:0 8px 20px #00101e99}
.questBox small,.daily small{display:block;color:#ffd42a;font-weight:900;font-size:20px}
.questBox strong{display:block;font-size:22px;margin-top:7px}
.questBox span{display:block;color:#a9d4ef;font-size:16px;margin-top:7px}
.daily{right:2%;top:5%;width:31%;height:102px;border:3px solid #ffd11e;border-radius:20px;background:linear-gradient(135deg,#241653,#16092e);text-align:center;box-shadow:0 7px 20px #00101eaa}
.daily img{width:60px;height:54px;object-fit:contain;float:left;margin:4px 2px 0 7px}
.daily b{display:block;color:#ffd62a;font-size:19px;margin-top:12px}
.timer{font-size:22px;font-weight:900;margin-top:5px}
.leftSide{left:2%;top:26%;display:flex;flex-direction:column;gap:12px}
.rightSide{right:2%;top:27%;width:27%;display:flex;flex-direction:column;gap:12px}
.sideBtn{background:linear-gradient(135deg,#082d4d,#06192d);border:3px solid #1688d5;border-radius:18px;min-height:82px;box-shadow:0 7px 16px #00101eaa;position:relative}
.leftSide .sideBtn{width:94px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.leftSide img{width:40px;height:40px;object-fit:contain;margin-bottom:2px}
.rightSide .sideBtn{padding:8px 13px;display:flex;align-items:center;gap:10px;text-align:left}
.rightSide img{width:43px;height:43px;object-fit:contain;flex:none}
.rightSide strong{font-size:19px} .rightSide small{display:block;color:#a8d1ed;font-size:14px;margin-top:5px}
.quick{left:2%;right:2%;bottom:15%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.quick button{height:124px;border-radius:20px;border:3px solid #198be0;background:linear-gradient(150deg,#0b4a86,#061c3c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900;font-size:23px;position:relative;box-shadow:inset 0 0 20px #4bc1ff20,0 7px 15px #00101eaa}
.quick button:nth-child(2){border-color:#f4ad00;background:linear-gradient(150deg,#bd7200,#6d3900)}
.quick button:nth-child(3){border-color:#a944ff;background:linear-gradient(150deg,#5b18a7,#270b58)}
.quick button:nth-child(4){border-color:#16d993;background:linear-gradient(150deg,#08774f,#06402e)}
.quick img{width:58px;height:58px;object-fit:contain}
.rewards{left:2%;right:2%;bottom:2%;height:78px;background:#061c32;border:3px solid #1d83c4;border-radius:18px;display:flex;align-items:center;padding:7px 18px;gap:12px;box-shadow:0 5px 12px #00101eaa}
.rewards img{width:63px;height:60px;object-fit:contain}
.rewardText{font-size:20px;font-weight:900;flex:1} .rewardText small{display:block;color:#a6cce7;font-size:15px;margin-top:4px} .rewardText b{color:#ffd52d}
.claim{height:56px;min-width:170px;border-radius:16px;border:3px solid #ffda59;background:linear-gradient(#ffd74f,#c97a00);color:#171000;font-size:23px;font-weight:900}
.nav{height:105px;flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:#021325;border-top:3px solid #134a70}
.nav button{background:#03192d;border-right:1px solid #17415f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#9ebfd9;font-weight:900;position:relative}
.nav button.active{color:#ffd72a;background:linear-gradient(#122c45,#15212a);box-shadow:inset 0 -6px 0 #ffd12a}
.nav img{width:46px;height:46px;object-fit:contain}
.nav span{font-size:16px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end}
.modal.open{display:flex}
.panel{width:min(700px,100%);max-height:88dvh;background:linear-gradient(#082541,#031325);border:2px solid #258bd0;border-bottom:0;border-radius:24px 24px 0 0;padding:18px;overflow:auto}
.close{float:right;background:#123553;border:1px solid #398bc5;border-radius:10px;padding:6px 11px}
.panel h2{color:#ffd52d;margin:0 0 12px} .card{background:#071c31;border:1px solid #216fa6;border-radius:15px;padding:13px;margin:9px 0}
.battleZones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px} .battleZones button{padding:10px 4px;background:#0b2a45;border:1px solid #287fb7;border-radius:9px} .battleZones .sel{background:#1474aa;border-color:#72d9ff}
.fight{width:100%;padding:13px;background:linear-gradient(#ffd34d,#bd7000);border:2px solid #ffe17a;border-radius:13px;color:#140b00;font-weight:900}
.toast{position:fixed;z-index:40;left:50%;bottom:120px;transform:translateX(-50%);display:none;background:#06203a;border:2px solid #31b9ff;border-radius:12px;padding:11px 16px;font-weight:900} .toast.show{display:block}

@media(max-width:760px){
  .header{height:130px;padding:7px 10px;gap:6px}
  .profile{min-width:0;gap:8px} .avatar{width:78px;height:78px;border-radius:14px} .level{font-size:17px;padding:2px 8px;border-radius:10px}
  .name{font-size:27px} .chapter{font-size:14px;line-height:1.25;margin-top:4px} .xp{height:14px;margin-top:4px;max-width:205px} .xpt{font-size:12px}
  .headerRight{width:63%;gap:6px} .resources{gap:4px} .resource{height:39px;border-radius:10px;font-size:13px;gap:3px} .resource b{font-size:16px}
  .tools{gap:4px} .tool{height:42px;border-radius:9px;font-size:0} .toolIcon{font-size:20px}
  .world{background-size:100% 100%;background-position:center}
  .questBox{left:2%;top:2%;width:47%;min-height:106px;border-radius:14px;padding:8px 9px}
  .questBox small,.daily small{font-size:12px} .questBox strong{font-size:15px;margin-top:5px} .questBox span{font-size:11px;margin-top:5px}
  .daily{right:2%;top:2%;width:40%;height:106px;border-radius:14px} .daily img{width:39px;height:36px} .daily b{font-size:12px;margin-top:13px} .timer{font-size:15px}
  .leftSide{left:2%;top:29%;gap:7px} .leftSide .sideBtn{width:65px;min-height:65px;border-radius:13px;font-size:10px;border-width:2px}
  .leftSide img{width:24px;height:24px}
  .rightSide{right:2%;top:29%;width:44%;gap:7px} .rightSide .sideBtn{min-height:64px;border-radius:13px;padding:5px 7px;border-width:2px;gap:7px}
  .rightSide img{width:25px;height:25px} .rightSide strong{font-size:13px} .rightSide small{font-size:10px;margin-top:3px}
  .quick{left:2%;right:2%;bottom:14%;gap:6px} .quick button{height:82px;border-radius:13px;border-width:2px;font-size:14px}
  .quick img{width:29px;height:29px}
  .rewards{left:2%;right:2%;bottom:1%;height:65px;border-radius:13px;padding:5px 9px;gap:7px;border-width:2px}
  .rewards img{width:36px;height:36px} .rewardText{font-size:14px} .rewardText small{font-size:10px;margin-top:3px} .claim{height:45px;min-width:110px;border-radius:12px;font-size:16px}
  .nav{height:76px} .nav img{width:25px;height:25px} .nav span{font-size:10px}
}
</style>

function toggleLang(){let e=document.getElementById('langTxt');e.textContent=e.textContent==='EN'?'RU':'EN';document.getElementById('langIcon').textContent=e.textContent==='EN'?'🇬🇧':'🇷🇺'}
function battle(){T.textContent='Бой против Бандита';B.innerHTML='<div class="card"><b>Бандит</b><p>HP 100/100</p></div><div class="card"><b>Атака — выбери 1 зону</b><div class="battleZones">'+['Голова','Грудь','Живот','Пояс','Ноги'].map(x=>'<button onclick="pick(this,\'a\')">'+x+'</button>').join('')+'</div></div><div class="card"><b>Защита — выбери 2 зоны</b><div class="battleZones" id="defs">'+['Голова','Грудь','Живот','Пояс','Ноги'].map(x=>'<button onclick="def(this)">'+x+'</button>').join('')+'</div><p id="dc">0/2</p></div><button class="fight" onclick="strike()">АТАКОВАТЬ</button>';M.classList.add('open')}
function pick(el,id){el.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function def(el){let a=[...document.querySelectorAll('#defs button.sel')];if(el.classList.contains('sel'))el.classList.remove('sel');else if(a.length<2)el.classList.add('sel');else return;document.getElementById('dc').textContent=document.querySelectorAll('#defs button.sel').length+'/2'}
function strike(){if(!document.querySelector('.battleZones button.sel')||document.querySelectorAll('#defs button.sel').length!==2){toast('Выбери атаку и 2 зоны защиты');return}toast('⚔ Удар нанесён');setTimeout(closePanel,700)}
let sec=23*3600+45*60+12;setInterval(()=>{sec=Math.max(0,sec-1);let h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');document.getElementById('timer').textContent=h+':'+m+':'+s},1000);
</script>
</body>
</html>
