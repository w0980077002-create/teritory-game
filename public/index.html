<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#031326"><title>Sdolars — Territory</title><link rel="stylesheet" href="styles.css">
</head><body><div id="game">
<header class="header">
  <div class="player">
    <div class="miniHero">🧔</div>
    <div><h1>Sdolars</h1><p>Глава 5 · Уровень <b id="lvl">3</b></p><div class="xp"><i id="xp"></i></div><small><span id="xpN">120</span>/300</small></div>
  </div>
  <div class="currency">
    <button data-add="gold">🪙 <b id="gold">1779</b> <strong>＋</strong></button>
    <button data-add="gems">💎 <b id="gems">1330</b> <strong>＋</strong></button>
    <button data-add="energy">⚡ <b id="energy">191.38</b> <strong>＋</strong></button>
  </div>
  <div class="quick">
    <button data-open="messages">✉️<em>2</em><span>Сообщения</span></button>
    <button data-open="achievements">🏆<span>Достижения</span></button>
    <button data-open="settings">⚙️<span>Настройки</span></button>
    <button>🇷🇺<span>RU</span></button>
  </div>
</header>

<main class="city">
  <div class="backdrop"></div>
  <section class="quest card" data-open="quests">
    <div class="bigIcon">📜</div><div><b>Текущее задание</b><h2 id="questName">Поговори с кузнецом</h2><span>📍 Кузница</span></div><strong>›</strong>
  </section>
  <section class="daily card"><div class="chest">🎁</div><div><b>Ежедневный бонус</b><h2 id="timer">23:45:12</h2></div></section>

  <aside class="leftMenu">
    <button data-open="bonuses">🎁<span>Бонусы</span><em>!</em></button>
    <button data-open="events">🗓️<span>События</span><em>!</em></button>
    <button data-open="vip">👑<span>VIP</span></button>
  </aside>

  <div class="viking">🧔<div>ВИКИНГ</div></div>

  <aside class="locations">
    <button data-open="forge">🔨<div><b>Кузница</b><small>Улучшение снаряжения</small></div><em>!</em></button>
    <button data-open="tavern">🍺<div><b>Таверна</b><small>Найм героев</small></div><em>!</em></button>
    <button data-open="shop">👜<div><b>Магазин</b><small>Предметы и снаряжение</small></div></button>
  </aside>

  <div class="actions">
    <button class="blue" data-open="battle">⚔️<b>Бой</b></button>
    <button class="gold" data-open="inventory">👜<b>Инвентарь</b><em id="inv">!</em></button>
    <button class="purple" data-open="equipment">🛡️<b>Экипировка</b></button>
    <button class="green" data-open="quests">📜<b>Задания</b><em>!</em></button>
  </div>
  <section class="reward card"><div>🎁</div><p><b>Бесплатные награды</b><small>Доступно через <strong id="timer2">23:45:12</strong></small></p><button id="claim">Получить</button></section>
</main>

<nav class="bottom">
 <button class="active">🏠<span>Город</span></button><button data-open="hero">⚔️<span>Герой</span></button><button data-open="inventory">🎒<span>Инвентарь</span></button><button data-open="quests">🛡️<span>Задания</span><em>!</em></button><button data-open="guild">👥<span>Гильдия</span></button><button data-open="more">☰<span>Ещё</span></button>
</nav>
<div id="modal" class="modal"><div class="window"><button id="close">×</button><div id="content"></div></div></div><div id="toast"></div>
<script src="app.js"></script></body></html>
