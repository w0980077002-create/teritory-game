<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Teritory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <!-- =========================
         ВЕРХНЯЯ ПАНЕЛЬ
         ========================= -->

    <header class="topbar">

        <div class="brand">

            <div class="logo-badge">
                ⚔️
            </div>

            <div class="brand-info">
                <h1>TERITORY</h1>
                <small>Город возможностей</small>
            </div>

        </div>

        <div class="header-right">

            <div class="level-badge">
                Уровень <span id="playerLevel">1</span>
            </div>

            <div class="coins">
                💰 <span id="money">1000</span>
            </div>

        </div>

    </header>


    <main>

        <!-- =========================
             ПЕРСОНАЖ
             ========================= -->

        <section
            id="characterScreen"
            class="screen active"
        >

            <div class="hero">

                <div class="hero-title">
                    ПЕРСОНАЖ
                </div>

                <div class="hero-subtitle">
                    Твой боец и его экипировка
                </div>

            </div>


            <!-- УРОВЕНЬ -->

            <div class="character-level-card">

                <div class="level-top">

                    <div>

                        <div
                            class="character-name"
                            id="playerName"
                        >
                            Игрок
                        </div>

                        <div class="character-level">
                            Уличный боец
                        </div>

                    </div>

                    <div class="level-number">
                        <span id="playerLevelBig">1</span>
                    </div>

                </div>


                <div class="exp-info">

                    <span>Опыт</span>

                    <span>
                        <span id="playerExp">0</span> /
                        <span id="playerMaxExp">100</span>
                    </span>

                </div>

                <div class="exp-bar">

                    <div
                        id="expBar"
                        class="exp-fill"
                    ></div>

                </div>

            </div>


            <!-- 3D ПЕРСОНАЖ -->

            <div class="character-preview-card">

                <div class="section-heading">
                    ПЕРСОНАЖ
                </div>

                <div
                    id="character-3d"
                    class="character-3d"
                ></div>

            </div>


            <!-- ЭКИПИРОВКА -->

            <div class="character-card">

                <div class="section-heading">
                    ЭКИПИРОВКА
                </div>

                <div class="equipment-grid">

                    <button
                        class="equip-slot"
                        id="equip-head"
                    >

                        <span class="equip-slot-icon">
                            🪖
                        </span>

                        <span class="equip-slot-title">
                            ГОЛОВА
                        </span>

                        <span
                            class="equip-slot-item"
                            id="slot-head"
                        >
                            Пусто
                        </span>

                    </button>


                    <button
                        class="equip-slot"
                        id="equip-body"
                    >

                        <span class="equip-slot-icon">
                            🛡️
                        </span>

                        <span class="equip-slot-title">
                            БРОНЯ
                        </span>

                        <span
                            class="equip-slot-item"
                            id="slot-body"
                        >
                            Пусто
                        </span>

                    </button>


                    <button
                        class="equip-slot"
                        id="equip-weapon"
                    >

                        <span class="equip-slot-icon">
                            🔫
                        </span>

                        <span class="equip-slot-title">
                            ОРУЖИЕ
                        </span>

                        <span
                            class="equip-slot-item"
                            id="slot-weapon"
                        >
                            Пусто
                        </span>

                    </button>


                    <button
                        class="equip-slot"
                        id="equip-secondary"
                    >

                        <span class="equip-slot-icon">
                            🔪
                        </span>

                        <span class="equip-slot-title">
                            ВТОРОЕ
                        </span>

                        <span
                            class="equip-slot-item"
                            id="slot-secondary"
                        >
                            Пусто
                        </span>

                    </button>


                    <button
                        class="equip-slot"
                        id="equip-clothes"
                    >

                        <span class="equip-slot-icon">
                            👕
                        </span>

                        <span class="equip-slot-title">
                            ОДЕЖДА
                        </span>

                        <span
                            class="equip-slot-item"
                            id="slot-clothes"
                        >
                            Пусто
                        </span>

                    </button>


                    <button
                        class="equip-slot"
                        id="equip-feet"
                    >

                        <span class="equip-slot-icon">
                            👟
                        </span>

                        <span class="equip-slot-title">
                            ОБУВЬ
                        </span>

                        <span
                            class="equip-slot-item"
                            id="slot-feet"
                        >
                            Пусто
                        </span>

                    </button>

                </div>

            </div>


            <!-- ЗДОРОВЬЕ -->

            <div class="stat-panel">

                <div class="stat-row">

                    <span>
                        ❤️ Здоровье
                    </span>

                    <strong>

                        <span id="hp">
                            100
                        </span>

                        /

                        <span id="maxHp">
                            100
                        </span>

                    </strong>

                </div>

                <div class="progress">

                    <div
                        id="hpBar"
                        class="hp-bar"
                    ></div>

                </div>


                <div class="stat-row">

                    <span>
                        ⚡ Энергия
                    </span>

                    <strong>

                        <span id="energy">
                            100
                        </span>

                        /

                        <span id="maxEnergy">
                            100
                        </span>

                    </strong>

                </div>

                <div class="progress">

                    <div
                        id="energyBar"
                        class="energy-bar"
                    ></div>

                </div>

            </div>


            <!-- ХАРАКТЕРИСТИКИ -->

            <div class="stats">

                <div class="section-heading">
                    ХАРАКТЕРИСТИКИ
                </div>

                <div class="stats-grid">

                    <div class="stat-box">

                        <span class="stat-icon">
                            💪
                        </span>

                        <span class="stat-name">
                            Сила
                        </span>

                        <strong id="strength">
                            10
                        </strong>

                    </div>


                    <div class="stat-box">

                        <span class="stat-icon">
                            🏃
                        </span>

                        <span class="stat-name">
                            Ловкость
                        </span>

                        <strong id="agility">
                            10
                        </strong>

                    </div>


                    <div class="stat-box">

                        <span class="stat-icon">
                            🛡️
                        </span>

                        <span class="stat-name">
                            Защита
                        </span>

                        <strong id="defense">
                            5
                        </strong>

                    </div>


                    <div class="stat-box">
