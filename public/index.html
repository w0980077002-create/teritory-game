<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Territory — Sdolars</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="game">
<header class="header">
  <div class="avatar"><span>🧔🏻‍♂️</span><b>5</b></div>
  <div class="profile"><h1>Sdolars</h1><strong>Глава 5 · Уровень 3</strong><div class="xp"><i></i></div><small>120/300</small></div>
  <div class="resources"><div>🪙 <b>1779</b> ＋</div><div>💎 <b>1330</b> ＋</div><div>⚡ <b>191.38</b> ＋</div></div>
  <div class="headerBtns"><button onclick="page('Настройки')">⚙️<small>Настройки</small></button><button onclick="toast('Язык: RU')">🇷🇺<small>RU</small></button></div>
</header>

<section class="world">
  <div class="sky"></div><div class="mountains"></div><div class="castle">🏰</div><div class="water">〰〰〰</div><div class="viking">🧔🏻‍♂️</div>

  <button class="quest panel" onclick="page('Задания')"><span class="ico">📜</span><div><b>Текущее задание</b><strong>Поговори с кузнецом</strong><small>📍 Кузница</small></div><em>›</em></button>
  <button class="bonus panel" onclick="claim()"><span class="ico">🎁</span><div><b>Ежедневный бонус</b><strong id="timer">23:45:12</strong></div></button>

  <div class="left">
    <button onclick="page('Бонусы')">🎁<b>Бонусы</b><sup>!</sup></button>
    <button onclick="page('События')">🗓️<b>События</b><sup>!</sup></button>
    <button onclick="page('VIP')">👑<b>VIP</b></button>
  </div>

  <div class="right">
    <button onclick="page('Кузница')"><span>⚒️</span><div><b>Кузница</b><small>Улучшение снаряжения</small></div><sup>!</sup></button>
    <button onclick="page('Таверна')"><span>🍺</span><div><b>Таверна</b><small>Найм героев</small></div><sup>!</sup></button>
    <button onclick="page('Магазин')"><span>👜</span><div><b>Магазин</b><small>Предметы и снаряжение</small></div><sup>!</sup></button>
  </div>
</section>

<section class="quick">
 <button class="blue" onclick="battle()">⚔️<b>Бой</b></button>
 <button class="gold" onclick="page('Инвентарь')">🎒<b>Инвентарь</b><sup>!</sup></button>
 <button class="purple" onclick="page('Экипировка')">🛡️<b>Экипировка</b></button>
 <button class="green" onclick="page('Задания')">📜<b>Задания</b><sup>!</sup></button>
</section>

<section class="reward"><span>🎁</span><div><b>Бесплатные награды</b><small>Доступно через <i id="timer2">23:45:12</i></small></div><button onclick="claim()">Получить</button></section>

<nav>
 <button class="active">🏠<b>Город</b></button><button onclick="page('Герой')">⚔️<b>Герой</b><sup>!</sup></button>
 <button onclick="page('Инвентарь')">🎒<b>Инвентарь</b></button><button onclick="page('Задания')">🛡️<b>Задания</b><sup>!</sup></button>
 <button onclick="page('Гильдия')">👥<b>Гильдия</b></button><button onclick="page('Ещё')">☰<b>Ещё</b></button>
</nav>
</div>
<div id="modal"><div class="dialog"><button class="x" onclick="closeModal()">×</button><div id="body"></div></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body></html>
