<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Territory — Sdolars</title>
<style>
:root{--blue:#0794e9;--deep:#031426;--panel:#061d35;--gold:#ffd129;--text:#f6f9ff;--muted:#9dc8e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:Arial,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#game{height:100dvh;max-width:1024px;margin:auto;background:#031426;display:flex;flex-direction:column;overflow:hidden}
.header{height:208px;flex:none;background:linear-gradient(#021a31,#031223);border-bottom:3px solid #087fc6;padding:16px 20px;display:grid;grid-template-columns:1.05fr 1.4fr;gap:18px}
.profile{display:flex;gap:14px;align-items:center;min-width:0}
.avatar{width:132px;height:132px;border:3px solid #74cfff;border-radius:20px;overflow:hidden;position:relative;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.level{position:absolute;bottom:-2px;left:-2px;background:#092744;border:2px solid #71cbff;border-radius:14px;padding:4px 13px;font-size:25px;font-weight:900}
.name{font-size:38px;font-weight:900;line-height:1}
.chapter{color:#75caff;font-size:22px;font-weight:800;margin-top:7px}
.xp{height:23px;border:2px solid #2182c1;border-radius:15px;background:#06182a;overflow:hidden;margin-top:8px;max-width:330px}
.xp i{display:block;width:40%;height:100%;background:linear-gradient(90deg,#0cc1ef,#31dcff)}
.xpt{font-size:16px;margin-top:4px}
.right{display:flex;flex-direction:column;gap:12px;justify-content:center}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res{height:62px;border:2px solid #1778b6;border-radius:16px;background:#061a31;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;gap:7px}
.res b{font-size:28px}.gold b{color:#ffd22d}.diamond b{color:#41dfff}.energy b{color:#ffd42b}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{height:68px;background:#08243e;border:2px solid #1d76b5;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;position:relative}
.tool .ico{font-size:27px}.badge{position:absolute;right:-7px;top:-9px;width:31px;height:31px;border-radius:50%;background:#ff3555;border:2px solid #ff9bad;display:grid;place-items:center;font-weight:900}

.world:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,10,20,.05),rgba(0,8,15,.25));pointer-events:none}
.quest{position:absolute;z-index:3;left:2%;top:3%;width:39%;height:120px;background:linear-gradient(135deg,#092d4b,#06182c);border:3px solid #1489d8;border-radius:20px;padding:13px 18px;text-align:left;box-shadow:0 8px 20px #00101e99}
.quest small,.daily small{color:#ffd42a;font-size:20px;font-weight:900;display:block}
.quest strong{font-size:23px;display:block;margin-top:6px}.quest span{color:#a9d3ed;font-size:16px;display:block;margin-top:8px}
.daily{position:absolute;z-index:3;right:2%;top:5%;width:31%;height:105px;border:3px solid #ffd129;border-radius:20px;background:linear-gradient(135deg,#2b175b,#18072e);padding:8px;text-align:center}
.daily img{width:70px;height:62px;object-fit:contain;float:left}
.daily b{display:block;color:#ffd42a;font-size:20px;margin-top:15px}.daily .time{font-size:22px;font-weight:900;margin-top:5px}
.sideL{position:absolute;z-index:3;left:2%;top:28%;display:flex;flex-direction:column;gap:11px}
.sideR{position:absolute;z-index:3;right:2%;top:29%;width:27%;display:flex;flex-direction:column;gap:11px}
.sideBtn{position:relative;background:linear-gradient(135deg,#082e4d,#06192c);border:3px solid #1488d7;border-radius:18px;box-shadow:0 7px 16px #00101eaa}
.sideL .sideBtn{width:96px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:900}
.sideL img{width:45px;height:45px;object-fit:contain}
.sideR .sideBtn{height:84px;padding:9px 13px;display:flex;align-items:center;gap:11px;text-align:left}
.sideR img{width:48px;height:48px;object-fit:contain;flex:none}
.sideR strong{font-size:20px}.sideR small{display:block;color:#a5cee9;font-size:14px;margin-top:5px}
.quick{position:absolute;z-index:4;left:2%;right:2%;bottom:15%;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.quick button{height:126px;border-radius:21px;border:3px solid #128ee3;background:linear-gradient(150deg,#0b4e8d,#061d3d);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:900;position:relative;box-shadow:inset 0 0 20px #5fcaff22}
.quick button:nth-child(2){border-color:#f2ad00;background:linear-gradient(150deg,#c27a00,#6b3900)}
.quick button:nth-child(3){border-color:#a743ff;background:linear-gradient(150deg,#5a17a7,#260b56)}
.quick button:nth-child(4){border-color:#14d996;background:linear-gradient(150deg,#08784f,#06412f)}
.quick img{width:54px;height:54px;object-fit:contain;margin-bottom:3px}
.rewards{position:absolute;z-index:4;left:2%;right:2%;bottom:2%;height:82px;background:#061d34;border:3px solid #1985c8;border-radius:19px;display:flex;align-items:center;padding:8px 18px;gap:13px}
.rewards img{width:65px;height:62px;object-fit:contain}.rtext{font-size:21px;font-weight:900;flex:1}.rtext small{display:block;color:#9fc9e7;font-size:15px;margin-top:4px}.rtext b{color:#ffd42c}
.claim{height:58px;min-width:175px;border-radius:16px;border:3px solid #ffda5b;background:linear-gradient(#ffd74f,#c77800);color:#170e00;font-size:23px;font-weight:900}
.nav{height:108px;flex:none;background:#021326;border-top:3px solid #144d73;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:#03192d;border-right:1px solid #174360;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#9fc1dc;font-weight:900}
.nav .active{color:#ffd72a;background:linear-gradient(#132d46,#151f28);box-shadow:inset 0 -6px 0 #ffd12b}
.nav img{width:45px;height:45px;object-fit:contain}.nav span{font-size:16px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}
.panel{width:min(700px,100%);max-height:88dvh;background:linear-gradient(#082541,#031325);border:2px solid #258bd0;border-bottom:0;border-radius:24px 24px 0 0;padding:18px;overflow:auto}
.close{float:right;background:#123553;border:1px solid #398bc5;border-radius:10px;padding:6px 11px}
.panel h2{color:#ffd52d;margin:0 0 12px}.card{background:#071c31;border:1px solid #216fa6;border-radius:15px;padding:13px;margin:9px 0}
.fight{width:100%;padding:13px;background:linear-gradient(#ffd34d,#bd7000);border:2px solid #ffe17a;border-radius:13px;color:#140b00;font-weight:900}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.zones button{padding:10px 4px;background:#0b2a45;border:1px solid #287fb7;border-radius:9px}.zones .sel{background:#1474aa;border-color:#72d9ff}
.toast{position:fixed;z-index:40;left:50%;bottom:120px;transform:translateX(-50%);display:none;background:#06203a;border:2px solid #31b9ff;border-radius:12px;padding:11px 16px;font-weight:900}.toast.show{display:block}

@media(max-width:760px){
.header{height:130px;padding:7px 10px;gap:6px;grid-template-columns:1.05fr 1.5fr}
.profile{gap:7px}.avatar{width:78px;height:78px;border-radius:14px}.level{font-size:17px;padding:2px 8px;border-radius:10px}
.name{font-size:27px}.chapter{font-size:14px;line-height:1.2;margin-top:4px}.xp{height:14px;max-width:200px;margin-top:4px}.xpt{font-size:12px}
.right{gap:5px}.resources{gap:4px}.res{height:40px;border-radius:10px;font-size:13px;gap:3px}.res b{font-size:17px}
.tools{gap:4px}.tool{height:43px;border-radius:9px;font-size:0}.tool .ico{font-size:19px}
.world{background-size:cover;background-position:center}
.quest{left:2%;top:2%;width:47%;height:106px;border-radius:14px;padding:8px 9px}.quest small,.daily small{font-size:12px}.quest strong{font-size:15px;margin-top:5px}.quest span{font-size:11px;margin-top:5px}
.daily{right:2%;top:2%;width:40%;height:106px;border-radius:14px}.daily img{width:42px;height:38px}.daily b{font-size:12px;margin-top:14px}.daily .time{font-size:15px}
.sideL{left:2%;top:29%;gap:7px}.sideL .sideBtn{width:65px;height:65px;border-radius:13px;border-width:2px;font-size:10px}.sideL img{width:25px;height:25px}
.sideR{right:2%;top:29%;width:44%;gap:7px}.sideR .sideBtn{height:64px;border-radius:13px;border-width:2px;padding:5px 7px;gap:7px}.sideR img{width:25px;height:25px}.sideR strong{font-size:13px}.sideR small{font-size:10px;margin-top:3px}
.quick{left:2%;right:2%;bottom:14%;gap:6px}.quick button{height:82px;border-radius:13px;border-width:2px;font-size:14px}.quick img{width:28px;height:28px}
.rewards{left:2%;right:2%;bottom:1%;height:65px;border-radius:13px;border-width:2px;padding:5px 9px;gap:7px}.rewards img{width:35px;height:35px}.rtext{font-size:14px}.rtext small{font-size:10px;margin-top:3px}.claim{height:45px;min-width:110px;border-radius:12px;font-size:16px}
.nav{height:76px}.nav img{width:25px;height:25px}.nav span{font-size:10px}
}
</style>

<div class="modal" id="modal" onclick="if(event.target===this)closePanel()"><section class="panel"><button class="close" onclick="closePanel()">✕</button><h2 id="title"></h2><div id="body"></div></section></div><div class="toast" id="toast"></div>
<script>
const M=document.getElementById('modal'),T=document.getElementById('title'),B=document.getElementById('body');
const data={
hero:['Герой','<div class="card"><b>Sdolars</b><p>Уровень 3 · Глава 5</p><p>Сила 12 · Ловкость 9 · Выносливость 14</p><p>Свободные очки: 3</p></div>'],
inventory:['Инвентарь','<div class="card"><b>Боевой топор</b><p>Урон +12</p><button class="fight" onclick="toast(\'Экипировано\')">Экипировать</button></div>'],
equipment:['Экипировка','<div class="card"><b>Боевой топор</b><p>+12 урона</p><p>Кожаная броня · +8 защиты</p></div>'],
quests:['Задания','<div class="card"><b>Поговори с кузнецом</b><p>Награда: 150 золота и опыт.</p></div>'],
forge:['Кузница','<div class="card"><b>Улучшение снаряжения</b><p>Боевой топор → уровень 2</p><button class="fight" onclick="toast(\'Улучшено\')">Улучшить</button></div>'],
tavern:['Таверна','<div class="card"><b>Найм героев</b><p>Доступны новые наёмники.</p></div>'],
shop:['Магазин','<div class="card"><b>Стальной меч</b><p>450 золота · Урон +15</p><button class="fight" onclick="toast(\'Куплено\')">Купить</button></div>'],
bonus:['Бонусы','<div class="card"><b>Ежедневный сундук</b><p>Награда готова.</p><button class="fight" onclick="toast(\'Награда получена\')">Забрать</button></div>'],
events:['События','<div class="card"><b>Осада Sdolars</b><p>Активное событие.</p></div>'],
vip:['VIP','<div class="card"><b>VIP</b><p>Дополнительные бонусы.</p></div>'],
messages:['Сообщения','<div class="card"><b>Кузнец</b><p>Твой заказ готов.</p></div>'],
ach:['Достижения','<div class="card"><b>Первый бой</b><p>Победи первого противника.</p></div>'],
settings:['Настройки','<div class="card"><p>Музыка: ВКЛ</p><p>Эффекты: ВКЛ</p></div>'],
guild:['Гильдия','<div class="card"><b>Гильдия Sdolars</b><p>Союзы, осады и награды.</p></div>'],
more:['Ещё','<div class="card"><p>Карта · Рейтинг · Достижения · Настройки</p></div>']
};
function openPanel(k){T.textContent=data[k][0];B.innerHTML=data[k][1];M.classList.add('open')}
function closePanel(){M.classList.remove('open')}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function toggleLang(){let x=document.getElementById('lang');x.textContent=x.textContent==='🇬🇧'?'🇷🇺':'🇬🇧';toast('Язык переключён')}
function battle(){T.textContent='Бой против Бандита';B.innerHTML='<div class="card"><b>Бандит</b><p>HP 100/100</p></div><div class="card"><b>Атака — выбери 1 зону</b><div class="zones">'+['Голова','Грудь','Живот','Пояс','Ноги'].map(x=>'<button onclick="pick(this)">'+x+'</button>').join('')+'</div></div><div class="card"><b>Защита — выбери 2 зоны</b><div class="zones" id="defs">'+['Голова','Грудь','Живот','Пояс','Ноги'].map(x=>'<button onclick="defPick(this)">'+x+'</button>').join('')+'</div><p id="dc">0/2</p></div><button class="fight" onclick="strike()">АТАКОВАТЬ</button>';M.classList.add('open')}
function pick(e){e.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));e.classList.add('sel')}
function defPick(e){let n=document.querySelectorAll('#defs .sel').length;if(e.classList.contains('sel'))e.classList.remove('sel');else if(n<2)e.classList.add('sel');document.getElementById('dc').textContent=document.querySelectorAll('#defs .sel').length+'/2'}
function strike(){if(!document.querySelector('.zones button.sel')||document.querySelectorAll('#defs .sel').length!==2){toast('Выбери атаку и 2 зоны защиты');return}toast('⚔ Удар нанесён');setTimeout(closePanel,700)}
let s=23*3600+45*60+12;setInterval(()=>{s=Math.max(0,s-1);let h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),q=String(s%60).padStart(2,'0');document.getElementById('dt').textContent=h+':'+m+':'+q;document.getElementById('rt').textContent=h+':'+m+':'+q},1000);
</script>
