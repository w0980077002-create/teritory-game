<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171224">
<title>Territoria</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="profile">
      <div class="avatar">⚔️</div>
      <div><b id="playerName">Территорианец</b><small>Уровень <span id="level">12</span></small></div>
    </div>
    <div class="resources">
      <span>🪙 <b id="gold">1250</b></span>
      <span>💎 <b id="gems">240</b></span>
    </div>
    <button class="menuBtn" onclick="toast('Меню')">☰</button>
  </header>

  <main id="screen"></main>

  <nav class="bottom">
    <button data-screen="home" onclick="show('home')"><i>🏠</i><span>Город</span></button>
    <button data-screen="inventory" onclick="show('inventory')"><i>🎒</i><span>Инвентарь</span></button>
    <button class="battleNav" onclick="show('battle')"><i>⚔️</i><span>Бой</span></button>
    <button data-screen="quests" onclick="show('quests')"><i>📜</i><span>Задания</span></button>
    <button data-screen="shop" onclick="show('shop')"><i>🛒</i><span>Магазин</span></button>
  </nav>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
