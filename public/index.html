<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#2c221e">
  <title>Territory — Classic RPG</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">TERRITORY</div>
      <div class="player-mini">
        <b id="topName">Странник</b>
        <span>ур. <b id="topLevel">1</b></span>
        <span>Ria: <b id="topRia">500</b></span>
        <span>Zl: <b id="topGold">0</b></span>
      </div>
    </header>

    <section class="status">
      <div class="xp-line"><span>Опыт</span><b id="xpText">0 / 100</b></div>
      <div class="bar xp"><i id="xpBar"></i></div>
      <div class="bars">
        <div><span>HP</span><b id="hpText">100 / 100</b><div class="bar hp"><i id="hpBar"></i></div></div>
        <div><span>Энергия</span><b id="energyText">100 / 100</b><div class="bar energy"><i id="energyBar"></i></div></div>
      </div>
    </section>

    <main id="screen"></main>

    <nav class="bottom-nav">
      <button data-nav="home">⌂<small>Главная</small></button>
      <button data-nav="character">♙<small>Персонаж</small></button>
      <button data-nav="inventory">▣<small>Инвентарь</small></button>
      <button data-nav="shop">♜<small>Магазин</small></button>
      <button data-nav="arena">⚔<small>Арена</small></button>
    </nav>
  </div>
  <div id="toast"></div>
  <script>
    window.Telegram = window.Telegram || { WebApp: { ready(){}, expand(){}, initDataUnsafe:{} } };
  </script>
  <script src="./app.js"></script>
</body>
</html>
