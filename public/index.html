<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f16">
  <title>TERITORY — Город возможностей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚔️</div>
      <div>
        <div class="brand-title">TERITORY</div>
        <div class="brand-sub">Город возможностей</div>
      </div>
    </div>
    <div class="top-stats">
      <span class="level" id="topLevel">Уровень 1</span>
      <span class="coins">💰 <b id="topCoins">1000</b></span>
    </div>
  </header>

  <main id="content"></main>

  <nav class="bottom-nav">
    <button data-page="home" class="nav-btn active"><span>🏙️</span><small>Главная</small></button>
    <button data-page="character" class="nav-btn"><span>👤</span><small>Персонаж</small></button>
    <button data-page="inventory" class="nav-btn"><span>🎒</span><small>Инвентарь</small></button>
    <button data-page="arena" class="nav-btn"><span>⚔️</span><small>Арена</small></button>
  </nav>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
