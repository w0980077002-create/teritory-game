<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061426">
<title>Territory — Sdolars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="avatarBtn" data-open="hero"><div class="avatar">ᛒ</div><span>5</span></button>
    <div class="brand"><b>Territory</b><strong>Глава 5 · Уровень <i id="level">3</i></strong><div class="progress"><i id="xpbar"></i></div><small><span id="xp">120</span>/300</small></div>
    <div class="currencies">
      <button onclick="addGold()">🪙 <b id="gold">1779</b> ＋</button>
      <button onclick="addGem()">💎 <b id="gems">1330</b> ＋</button>
      <button onclick="addEnergy()">⚡ <b id="energy">191.38</b> ＋</button>
    </div>
    <div class="topActions">
      <button data-open="messages">✉️<em>2</em><small>Сообщения</small></button>
      <button data-open="achievements">🏆<small>Достижения</small></button>
      <button data-open="settings">⚙️<small>Настройки</small></button>
      <button onclick="toggleLang()">🇬🇧<small id="langText">EN</small></button>
    </div>
  </header>

  <main id="screen" class="city">
    <section class="world">
      <div class="sky"></div><div class="mountains"></div><div class="castle"><span>♜</span></div>
      <div class="water"></div><div class="cityLights"></div>
      <div class="vikingArt"><div class="head">ᛒ</div><div class="body"></div><div class="axe">╱╲</div></div>

      <button class="questCard" data-open="quests"><span class="scroll">▤</span><div><b>Текущее задание</b><strong id="questTitle">Поговори с кузнецом</strong><small>📍 Кузница</small></div><i>›</i></button>
      <button class="daily"><span>🎁</span><div><b>Ежедневный бонус</b><strong id="timer">23:45:12</strong></div></button>

      <div class="leftTools">
        <button data-open="bonuses">🎁<b>Бонусы</b><em>!</em></button>
        <button data-open="events">🗓️<b>События</b><em>!</em></button>
        <button data-open="vip">👑<b>VIP</b></button>
      </div>

      <div class="locations">
        <button data-open="forge"><span>⚒️</span><div><b>Кузница</b><small>Улучшение снаряжения</small></div><em>!</em></button>
        <button data-open="tavern"><span>🍺</span><div><b>Таверна</b><small>Найм героев</small></div><em>!</em></button>
        <button data-open="shop"><span>👜</span><div><b>Магазин</b><small>Предметы и снаряжение</small></div></button>
      </div>
    </section>

    <section class="mainButtons">
      <button class="blue" data-open="battle">⚔️<b>Бой</b></button>
      <button class="orange" data-open="inventory">🎒<b>Инвентарь</b><em>!</em></button>
      <button class="purple" data-open="equipment">🛡️<b>Экипировка</b></button>
      <button class="green" data-open="quests">📜<b>Задания</b><em>!</em></button>
    </section>

    <section class="reward">
      <span>🎁</span><div><b>Бесплатные награды</b><small>Доступно через <i id="timer2">23:45:12</i></small></div>
      <button onclick="claimReward()">Получить</button>
    </section>
  </main>

  <nav class="bottom">
    <button class="active" data-open="city">🏠<b>Город</b></button>
    <button data-open="hero">⚔️<b>Герой</b><em>!</em></button>
    <button data-open="inventory">🎒<b>Инвентарь</b></button>
    <button data-open="quests">🛡️<b>Задания</b><em>!</em></button>
    <button data-open="guild">👥<b>Гильдия</b></button>
    <button data-open="more">☰<b>Ещё</b></button>
  </nav>
</div>
<div id="modal"><div class="modalBox"><button class="x" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
