<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<title>Territory — Sdolars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="top">
  <button class="profile" data-screen="hero">
    <img src="assets/viking.jpg"><span class="lvl">5</span>
    <div class="ptext"><b>Territory</b><strong>Глава 5 · Уровень <span id="level">3</span></strong><div class="xp"><i id="xpbar"></i></div><small><span id="xp">120</span>/300</small></div>
  </button>
  <div class="resources">
    <button data-resource="gold">🪙 <b id="gold">1779</b> ＋</button>
    <button data-resource="gems">💎 <b id="gems">1330</b> ＋</button>
    <button data-resource="energy">⚡ <b id="energy">191.38</b> ＋</button>
  </div>
  <div class="topBtns">
    <button data-screen="messages">✉️<em>2</em><small>Сообщения</small></button>
    <button data-screen="achievements">🏆<small>Достижения</small></button>
    <button data-screen="settings">⚙️<small>Настройки</small></button>
    <button data-screen="language">🇬🇧<small>EN</small></button>
  </div>
</header>

<main class="world">
  <div class="scene"></div>
  <section class="quest panel" data-screen="quests">
    <img src="assets/quests.png"><div><b>Текущее задание</b><strong>Поговори с кузнецом</strong><small>📍 Кузница</small></div><span>›</span>
  </section>
  <section class="daily panel"><img src="assets/chest.png"><div><b>Ежедневный бонус</b><strong id="daily">23:45:12</strong></div></section>

  <aside class="left">
    <button data-screen="bonuses"><img src="assets/gift.png"><b>Бонусы</b><em>!</em></button>
    <button data-screen="events">🗓️<b>События</b><em>!</em></button>
    <button data-screen="vip">👑<b>VIP</b></button>
  </aside>

  <div class="hero"><img src="assets/viking.jpg"><span>ВИКИНГ</span></div>

  <aside class="places">
    <button data-screen="forge"><img src="assets/forge.png"><div><b>Кузница</b><small>Улучшение снаряжения</small></div><em>!</em></button>
    <button data-screen="tavern"><img src="assets/tavern.png"><div><b>Таверна</b><small>Найм героев</small></div><em>!</em></button>
    <button data-screen="shop"><img src="assets/shop.png"><div><b>Магазин</b><small>Предметы и снаряжение</small></div></button>
  </aside>

  <section class="mainActions">
    <button class="blue" data-screen="battle"><img src="assets/battle.png"><b>Бой</b></button>
    <button class="gold" data-screen="inventory"><img src="assets/inventory.png"><b>Инвентарь</b><em>!</em></button>
    <button class="purple" data-screen="equipment"><img src="assets/equipment.png"><b>Экипировка</b></button>
    <button class="green" data-screen="quests"><img src="assets/quests.png"><b>Задания</b><em>!</em></button>
  </section>

  <section class="reward panel">
    <img src="assets/chest.png"><div><b>Бесплатные награды</b><small>Доступно через <strong id="daily2">23:45:12</strong></small></div><button id="claim">Получить</button>
  </section>
</main>

<nav class="bottom">
  <button class="active" data-screen="city">🏠<b>Город</b></button>
  <button data-screen="hero">⚔️<b>Герой</b><em>!</em></button>
  <button data-screen="inventory">🎒<b>Инвентарь</b></button>
  <button data-screen="quests">🛡️<b>Задания</b><em>!</em></button>
  <button data-screen="guild">👥<b>Гильдия</b></button>
  <button data-screen="more">☰<b>Ещё</b></button>
</nav>

<div id="modal"><div class="dialog"><button id="close">×</button><div id="content"></div></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
