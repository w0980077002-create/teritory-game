<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Territory — Ultimate</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div class="stars"></div>
  <header class="top">
    <button class="brand" data-go="city"><span class="logo">T</span><span><b>TERRITORY</b><small>ULTIMATE CITY RPG</small></span></button>
    <div class="resources">
      <span class="res gold">◆ <b id="ria">170</b></span>
      <span class="res">⚡ <b id="energyTop">100</b></span>
    </div>
  </header>
  <main id="screen"></main>
  <nav class="bottom">
    <button data-go="city" class="active"><i>⌂</i><span>Город</span></button>
    <button data-go="character"><i>◉</i><span>Герой</span></button>
    <button data-go="missions"><i>✦</i><span>Миссии</span></button>
    <button data-go="clan"><i>♜</i><span>Клан</span></button>
    <button data-go="arena"><i>⚔</i><span>Арена</span></button>
  </nav>
</div>
<div id="modal"></div><div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
