<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Territory — Sdolars</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050f18;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}button{font:inherit;color:inherit;border:0}
#app{height:100dvh;max-width:700px;margin:auto;background:#071a2a;position:relative;overflow:hidden}
.top{height:178px;background:#031522;border-bottom:3px solid #168bd0;padding:8px 12px;position:relative;z-index:5}
.profile{display:flex;gap:10px;align-items:center}.avatar{width:98px;height:98px;border-radius:20px;border:3px solid #39aef0;background:linear-gradient(145deg,#193d58,#08131c);display:grid;place-items:center;font-size:52px;box-shadow:0 0 15px #0b8ed866}
.name{font-size:30px;font-weight:900}.chapter{color:#8bd8ff;font-size:16px;font-weight:800;line-height:1.2;margin-top:5px}
.xp{width:170px;height:11px;border:2px solid #1588ca;border-radius:8px;margin-top:7px;overflow:hidden}.xp i{display:block;height:100%;background:#16a9ea;width:40%}
#xptext{font-size:13px;margin-top:3px}.resources{position:absolute;top:8px;left:42%;right:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.resources button{height:47px;border:2px solid #1679bb;border-radius:14px;background:#071d2d;font-weight:900;font-size:15px}
.quick{position:absolute;top:61px;left:42%;right:9px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.quick button{height:47px;border:2px solid #1679bb;border-radius:14px;background:#071d2d;font-size:22px;position:relative}
.badge{position:absolute;right:-6px;top:-9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fa416c;border:2px solid #ff8ca6;font-size:14px}
.scene{position:absolute;top:178px;bottom:84px;left:0;right:0;overflow:hidden;background:linear-gradient(#1c5b8a 0,#4b87a5 40%,#304e45 62%,#101c22 100%)}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,#d9f1ff44,transparent 31%),linear-gradient(145deg,#2a6c9c,#173d5d 55%,#172e2a)}
.mountains{position:absolute;bottom:26%;left:-10%;width:120%;height:62%;background:#284e68;clip-path:polygon(0 100%,9% 54%,19% 70%,31% 22%,43% 68%,57% 17%,69% 66%,83% 31%,100% 68%,100% 100%);opacity:.85}
.castle{position:absolute;left:22%;top:13%;width:56%;height:48%;background:linear-gradient(90deg,transparent 0 8%,#344f62 8% 19%,transparent 19% 27%,#4b6576 27% 40%,transparent 40% 47%,#334e61 47% 68%,transparent 68% 76%,#4b6576 76% 91%,transparent 91%);clip-path:polygon(0 100%,7% 50%,17% 63%,26% 28%,36% 58%,48% 0,59% 57%,70% 31%,79% 60%,90% 40%,100% 100%);opacity:.8}
.hero{position:absolute;bottom:-3%;left:10%;right:10%;height:72%;display:grid;place-items:end center;pointer-events:none}
.hero .body{width:235px;height:390px;border-radius:48% 48% 22% 22%;background:radial-gradient(circle at 50% 18%,#d19a6b 0 10%,transparent 10.5%),radial-gradient(circle at 50% 25%,#70452c 0 17%,transparent 17.5%),linear-gradient(100deg,#11181d,#684b31 37%,#1b2022 68%,#0a1117);filter:drop-shadow(0 8px 13px #000);position:relative}
.hero .body:after{content:"⚔";position:absolute;left:12px;bottom:30px;font-size:90px;transform:rotate(-25deg)}
.citylabel{position:absolute;left:16px;top:20px;width:min(260px,40%);background:#06263b;border:2px solid #1687cc;border-radius:16px;padding:12px 15px;width:260px;z-index:2}.citylabel b{color:#ffd52c}.citylabel strong{display:block;font-size:19px;margin-top:6px}
.daily{position:absolute;right:15px;top:28px;width:min(215px,31%);background:#28164a;border:3px solid #ffd52c;border-radius:18px;text-align:center;padding:12px;z-index:2}.daily b{color:#ffe14b}.daily strong{display:block;font-size:21px;margin-top:4px}
.side{position:absolute;right:14px;top:255px;width:min(260px,38%);display:grid;gap:7px;z-index:2}.side button{background:#082a42;border:3px solid #168bd0;border-radius:17px;text-align:left;padding:9px 12px;min-height:66px;font-size:17px;font-weight:900}.side small{display:block;color:#91afc0;font-size:12px;margin-top:3px}
.left{position:absolute;left:14px;top:255px;display:grid;gap:7px;z-index:2}.left button{width:88px;height:65px;background:#082a42;border:3px solid #168bd0;border-radius:16px;font-weight:900;font-size:13px;position:relative}
.actions{position:absolute;left:15px;right:15px;bottom:100px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:4}.actions button{height:72px;border-radius:17px;border:3px solid #1697e0;background:#096497;font-weight:900;font-size:15px;position:relative}.actions button:nth-child(2){background:#b97800;border-color:#f1ac00}.actions button:nth-child(3){background:#5b17b8;border-color:#a137ff}.actions button:nth-child(4){background:#08794f;border-color:#21d79b}
.reward{position:absolute;left:17px;right:17px;bottom:12px;height:62px;border:3px solid #168bd0;border-radius:15px;background:#08283d;padding:7px 135px 5px 45px;z-index:4;font-size:14px}.reward small{color:#b5c6d0}.reward button{position:absolute;right:6px;top:5px;height:48px;width:115px;background:#ffd332;color:#111;border-radius:13px;font-weight:900}
.nav{position:absolute;bottom:0;left:0;right:0;height:84px;background:#061a29;border-top:2px solid #19435b;display:grid;grid-template-columns:repeat(6,1fr);z-index:6}.nav button{background:transparent;color:#8ea8b8;font-size:11px;font-weight:900;border-right:1px solid #19384a}.nav button.active{color:#ffe044;border-bottom:5px solid #ffd02d}
.modal{display:none;position:absolute;inset:0;background:#000b;z-index:20;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-height:86%;overflow:auto;background:#082238;border:3px solid #168bd0;border-bottom:0;border-radius:23px 23px 0 0;padding:16px}.sheet h2{margin:0 0 12px;font-size:23px}.close{float:right;background:#16394e;border-radius:10px;padding:7px 11px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:#0b3048;border:2px solid #147dbb;border-radius:14px;padding:11px;min-height:80px}.card b{display:block}.card small{display:block;color:#9cb4c2;margin-top:5px}.card button{width:100%;margin-top:8px;padding:8px;border-radius:9px;background:#126c9e;font-weight:900}.card button.gold{background:#c78908;color:#111}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:10px}.stat{background:#0b3048;border:2px solid #177ebd;border-radius:12px;padding:10px}.stat b{color:#7fd2ff}.bar{height:8px;background:#122c3c;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#16a9e9}
.battle{display:grid;gap:9px}.enemy{background:#101e2a;border:2px solid #6d293b;border-radius:15px;padding:12px}.hp{height:12px;background:#401625;border-radius:9px;overflow:hidden;margin-top:7px}.hp i{display:block;height:100%;background:#e6314e}.sectionTitle{font-weight:900;color:#7fd5ff;margin-top:3px}.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.zones button{background:#0a344c;border:2px solid #187fc0;border-radius:9px;padding:9px 2px;font-size:10px;font-weight:900}.zones button.sel{background:#d48311;border-color:#ffd54a;color:#111}.turn{background:#0b3048;border-radius:12px;padding:10px;min-height:43px}.fight{background:#b51d3b;border-radius:13px;padding:12px;font-size:18px;font-weight:900}
.itemrow{display:grid;grid-template-columns:1fr 82px;gap:6px;align-items:center;background:#0b3048;border:2px solid #147dbb;border-radius:12px;padding:9px;margin-bottom:7px}.itemrow .buttons{display:grid;gap:4px}.itemrow button{padding:7px;border-radius:8px;background:#126c9e;font-size:11px;font-weight:900}.itemrow button.red{background:#733046}.toast{position:absolute;z-index:40;left:50%;bottom:100px;transform:translateX(-50%);background:#ffd331;color:#111;padding:10px 17px;border-radius:12px;font-weight:900;display:none;white-space:nowrap}
@media(max-width:560px){
  .top{height:170px;padding:7px 9px}
  .profile{width:48%;gap:6px}
  .avatar{width:72px;height:72px;border-radius:15px;font-size:35px}
  .name{font-size:23px}
  .chapter{font-size:12px;margin-top:3px;white-space:nowrap}
  .xp{width:125px;height:9px;margin-top:5px}
  #xptext{font-size:11px}
  .resources{left:auto;right:8px;top:7px;width:47%;grid-template-columns:repeat(3,1fr);gap:3px}
  .resources button{height:39px;border-radius:11px;font-size:12px;padding:0 2px}
  .quick{left:auto;right:8px;top:51px;width:47%;gap:3px}
  .quick button{height:39px;border-radius:11px;font-size:17px}
  .badge{width:23px;height:23px;font-size:12px;right:-5px;top:-7px}
  .scene{top:170px;bottom:76px}
  .citylabel{left:10px;top:13px;width:55%;padding:9px 10px;border-radius:14px}
  .citylabel b{font-size:12px}
  .citylabel strong{font-size:14px;margin-top:5px;white-space:nowrap;overflow:hidden}
  .citylabel span{font-size:12px}
  .daily{right:10px;top:18px;width:39%;padding:9px 4px;border-radius:14px}
  .daily b{font-size:11px}.daily strong{font-size:17px}
  .left{left:10px;top:205px;gap:5px}
  .left button{width:70px;height:55px;border-radius:13px;font-size:11px}
  .side{right:10px;top:205px;width:58%;gap:5px}
  .side button{min-height:55px;padding:7px 9px;border-radius:13px;font-size:14px}
  .side small{font-size:10px;margin-top:2px}
  .hero{bottom:-5%;height:66%;left:20%;right:20%}
  .hero .body{width:145px;height:250px}
  .hero .body:after{font-size:55px;left:4px;bottom:18px}
  .actions{left:10px;right:10px;bottom:88px;gap:4px}
  .actions button{height:62px;border-radius:14px;font-size:12px;border-width:3px}
  .reward{left:10px;right:10px;bottom:8px;height:56px;padding:6px 104px 4px 36px;font-size:11px}
  .reward button{right:5px;top:5px;height:44px;width:92px;font-size:13px}
  .nav{height:76px}.nav button{font-size:9px}
  .sheet{padding:13px}.sheet h2{font-size:20px}
  .cards{grid-template-columns:1fr}
  .zones button{font-size:9px;padding:8px 1px}
}
@media(max-width:380px){
  .profile{width:51%}.resources{width:45%}.quick{width:45%}
  .avatar{width:66px;height:66px}.name{font-size:21px}
  .xp{width:110px}
  .citylabel{width:54%}.daily{width:40%}
  .side{width:57%}.side button{font-size:13px}
  .actions button{font-size:11px}
}
</style>
</head>
<body>
<div id="app">
<header class="top">
<div class="profile"><div class="avatar">⚔️</div><div><div class="name">Sdolars</div><div class="chapter">Глава 5 · Уровень <span id="level">3</span></div><div class="xp"><i id="xpbar"></i></div><div id="xptext">120/300</div></div></div>
<div class="resources"><button>🟡 <span id="coins">1779</span></button><button>🔷 <span id="gems">1330</span></button><button>⚡ <span id="energy">191</span></button></div>
<div class="quick"><button onclick="openPanel('mail')">✉️<span class="badge">2</span></button><button onclick="openPanel('arena')">🏆</button><button onclick="openPanel('settings')">⚙️</button><button onclick="toast('Язык: русский')">🇬🇧</button></div>
</header>
<main class="scene">
<div class="sky"></div><div class="mountains"></div><div class="castle"></div><div class="hero"><div class="body"></div></div>
<div class="citylabel"><b>ТЕКУЩЕЕ ЗАДАНИЕ</b><strong>Поговори с кузнецом ›</strong><span>⚒ Кузница</span></div>
<div class="daily"><b>🎁 Ежедневный бонус</b><strong id="timer">23:45:00</strong></div>
<div class="left"><button onclick="openPanel('bonus')">🎁<br>Бонусы<span class="badge">!</span></button><button onclick="openPanel('events')">❗<br>События</button><button onclick="openPanel('vip')">♛<br>VIP</button></div>
<div class="side"><button onclick="openPanel('forge')">⚒️ Кузница<small>Улучшение снаряжения</small></button><button onclick="openPanel('tavern')">🍺 Таверна<small>Найм героев</small></button><button onclick="openPanel('shop')">🧰 Магазин<small>Предметы и снаряжение</small></button></div>
</main>
<div class="actions"><button onclick="openPanel('battle')">⚔️<br>Бой</button><button onclick="openPanel('inventory')">🎒<br>Инвентарь<span class="badge">!</span></button><button onclick="openPanel('equipment')">🛡️<br>Экипировка</button><button onclick="openPanel('quests')">📜<br>Задания</button></div>
<div class="reward"><b>🎁 Бесплатные награды</b><br><small>Доступно через <span id="rewardTime">23:45:00</span></small><button onclick="claimReward()">Получить</button></div>
<nav class="nav"><button class="active" onclick="toast('Город')">🏠<br>Город</button><button onclick="openPanel('hero')">⚔️<br>Герой</button><button onclick="openPanel('inventory')">🎒<br>Инвентарь</button><button onclick="openPanel('quests')">🛡️<br>Задания</button><button onclick="openPanel('guild')">👥<br>Гильдия</button><button onclick="openPanel('more')">☰<br>Ещё</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closePanel()"><div class="sheet"><button class="close" onclick="closePanel()">✕</button><div id="content"></div></div></div>
<div id="toast" class="toast"></div>
</div>
<script>
const KEY='territory_sdolars_v2';
const defaultState={coins:1779,gems:1330,energy:191,level:3,xp:120,maxXp:300,hp:120,maxHp:120,str:5,agi:5,free:2,attack:12,items:[
{id:'knife',name:'Ржавый нож новичка',type:'Оружие',bonus:'+4 атака',price:40,equipped:true},
{id:'armor',name:'Кожаная броня',type:'Броня',bonus:'+8 защита',price:90,equipped:true},
{id:'helm',name:'Стальной шлем',type:'Шлем',bonus:'+5 защита',price:120,equipped:false},
{id:'potion',name:'Зелье здоровья',type:'Расходник',bonus:'+30 HP',price:25,equipped:false}],quests:{forge:false,bandit:false,tavern:false},enemyHp:120};
let S=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(defaultState)), attackZone='',blocks=[];
const zones=['Голова','Грудь','Живот','Пояс','Ноги'];
function save(){localStorage.setItem(KEY,JSON.stringify(S));renderTop()}
function renderTop(){coins.textContent=S.coins;gems.textContent=S.gems;energy.textContent=S.energy;level.textContent=S.level;xptext.textContent=S.xp+'/'+S.maxXp;xpbar.style.width=Math.min(100,S.xp/S.maxXp*100)+'%'}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>x.style.display='none',1700)}
function closePanel(){modal.classList.remove('show')}
function openPanel(type){
 let c='';
 if(type==='hero')c=heroPanel();
 else if(type==='inventory')c=inventoryPanel();
 else if(type==='equipment')c=equipmentPanel();
 else if(type==='shop')c=shopPanel();
 else if(type==='battle')c=battlePanel();
 else if(type==='quests')c=questsPanel();
 else if(type==='forge')c=forgePanel();
 else if(type==='tavern')c=simple('🍺 Таверна',['Найм героя — 500 🟡','Найм наёмника — 900 🟡']);
 else if(type==='guild')c=simple('👥 Гильдия',['Найти гильдию','Создать гильдию','Вклад в гильдию: 0']);
 else if(type==='bonus')c=simple('🎁 Бонусы',['Ежедневная награда: 250 🟡','Бонус за вход: +20 ⚡']);
 else if(type==='events')c=simple('❗ События',['Арена выходного дня','Охота на бандитов','Сезонное событие']);
 else if(type==='vip')c=simple('♛ VIP',['VIP-уровень: 0','Бонус опыта: +0%','Бонус монет: +0%']);
 else if(type==='arena')c=simple('🏆 Арена',['Текущий рейтинг: 0','Победы: 0','Войти в бой']);
 else if(type==='mail')c=simple('✉️ Почта',['2 новых сообщения','Награда за арену получена','Приглашение в гильдию']);
 else if(type==='settings')c=simple('⚙️ Настройки',['Звук: ВКЛ','Вибрация: ВКЛ','Уведомления: ВКЛ']);
 else c=simple('☰ Ещё',['Профиль персонажа','Рынок','Настройки']);
 content.innerHTML=c;modal.classList.add('show');
}
function simple(title,arr){return '<h2>'+title+'</h2><div class="cards">'+arr.map(x=>'<div class="card"><b>'+x+'</b><small>Нажми, чтобы открыть раздел</small><button onclick="toast(\'Раздел открыт\')">Открыть</button></div>').join('')+'</div>'}
function heroPanel(){return `<h2>⚔️ Герой</h2><div class="stats"><div class="stat"><b>❤️ Здоровье</b><br>${S.hp}/${S.maxHp}<div class="bar"><i style="width:${S.hp/S.maxHp*100}%"></i></div></div><div class="stat"><b>⚔️ Атака</b><br>${S.attack}</div><div class="stat"><b>💪 Сила</b><br>${S.str}</div><div class="stat"><b>🏃 Ловкость</b><br>${S.agi}</div><div class="stat"><b>✨ Свободные очки</b><br>${S.free}</div><div class="stat"><b>⭐ Опыт</b><br>${S.xp}/${S.maxXp}</div></div><div class="cards"><div class="card"><b>Сила</b><small>Повышает шанс критического удара</small><button onclick="addStat('str')">+1</button></div><div class="card"><b>Ловкость</b><small>Повышает шанс уклонения</small><button onclick="addStat('agi')">+1</button></div></div>`}
function addStat(k){if(!S.free)return toast('Нет свободных очков');S[k]++;S.free--;save();openPanel('hero');toast('+1 к характеристике')}
function inventoryPanel(){return '<h2>🎒 Инвентарь</h2>'+S.items.map((it,i)=>`<div class="itemrow"><div><b>${it.name}</b><small>${it.type} · ${it.bonus}</small></div><div class="buttons"><button onclick="equip(${i})">${it.equipped?'Снять':'Надеть'}</button><button class="red" onclick="discard(${i})">Выбросить</button></div></div>`).join('')}
function equipmentPanel(){let eq=S.items.filter(x=>x.equipped);return '<h2>🛡️ Экипировка</h2><div class="cards">'+['Оружие','Броня','Шлем','Расходник'].map(t=>{let x=eq.find(i=>i.type===t);return `<div class="card"><b>${t}</b><small>${x?x.name+' · '+x.bonus:'Пусто'}</small></div>`}).join('')+'</div><br><div class="card"><b>Характеристики</b><small>Атака: '+S.attack+' · Сила: '+S.str+' · Ловкость: '+S.agi+'</small></div>'}
function equip(i){S.items[i].equipped=!S.items[i].equipped;save();openPanel('inventory');toast(S.items[i].equipped?'Предмет надет':'Предмет снят')}
function discard(i){let x=S.items[i];if(x.equipped)return toast('Сначала сними предмет');S.items.splice(i,1);save();openPanel('inventory');toast('Предмет выброшен')}
function shopPanel(){let stock=[{name:'Боевой топор',type:'Оружие',bonus:'+8 атака',price:250},{name:'Усиленная броня',type:'Броня',bonus:'+14 защита',price:350},{name:'Зелье здоровья',type:'Расходник',bonus:'+30 HP',price:25},{name:'Железный шлем',type:'Шлем',bonus:'+9 защита',price:180}];return '<h2>🧰 Магазин</h2><div class="cards">'+stock.map((x,i)=>`<div class="card"><b>${x.name}</b><small>${x.type} · ${x.bonus}</small><button class="gold" onclick='buyItem(${JSON.stringify(x)})'>${x.price} 🟡 · Купить</button></div>`).join('')+'</div>'}
function buyItem(x){if(S.coins<x.price)return toast('Не хватает монет');S.coins-=x.price;S.items.push({...x,id:Date.now()+Math.random(),equipped:false});save();toast('Куплено: '+x.name);openPanel('shop')}
function questsPanel(){return `<h2>📜 Задания</h2><div class="cards"><div class="card"><b>${S.quests.forge?'✅':'⚒️'} Поговори с кузнецом</b><small>Кузница · ${S.quests.forge?'1/1':'0/1'}</small><button onclick="completeQuest('forge')">Выполнить</button></div><div class="card"><b>${S.quests.bandit?'✅':'⚔️'} Победи бандита</b><small>Арена · ${S.quests.bandit?'1/1':'0/1'}</small><button onclick="openPanel('battle')">В бой</button></div><div class="card"><b>${S.quests.tavern?'✅':'🍺'} Посети таверну</b><small>Таверна · ${S.quests.tavern?'1/1':'0/1'}</small><button onclick="completeQuest('tavern')">Выполнить</button></div></div>`}
function completeQuest(k){if(S.quests[k])return toast('Уже выполнено');S.quests[k]=true;S.xp+=40;S.coins+=75;levelCheck();save();openPanel('quests');toast('Задание выполнено +75 🟡')}
function levelCheck(){while(S.xp>=S.maxXp){S.xp-=S.maxXp;S.level++;S.maxXp=Math.floor(S.maxXp*1.25);S.free+=2;S.maxHp+=10;S.hp=S.maxHp;toast('Новый уровень!')}}
function forgePanel(){return `<h2>⚒️ Кузница</h2><div class="cards"><div class="card"><b>Улучшить оружие</b><small>Стоимость: 150 🟡 · +2 атака</small><button onclick="upgradeWeapon()">Улучшить</button></div><div class="card"><b>Улучшить броню</b><small>Стоимость: 180 🟡 · +3 защита</small><button onclick="toast('Броня улучшена')">Улучшить</button></div></div>`}
function upgradeWeapon(){if(S.coins<150)return toast('Не хватает монет');S.coins-=150;S.attack+=2;save();toast('Оружие улучшено +2 атака');openPanel('forge')}
function battlePanel(){return `<h2>⚔️ Бой против Бандита</h2><div class="battle"><div class="enemy"><b>Бандит</b><span style="float:right">${S.enemyHp}/120 HP</span><div class="hp"><i style="width:${S.enemyHp/120*100}%"></i></div></div><div class="sectionTitle">Атака — выбери одну зону</div><div class="zones" id="attackZones">${zones.map(z=>`<button onclick="selectAttack(this,'${z}')">${z}</button>`).join('')}</div><div class="sectionTitle">Защита — заблокируй две зоны</div><div class="zones" id="defZones">${zones.map(z=>`<button onclick="selectBlock(this,'${z}')">${z}</button>`).join('')}</div><button class="fight" onclick="turn()">⚔️ СДЕЛАТЬ ХОД</button><div class="turn" id="log">Выбери атаку и две защиты.</div></div>`}
function selectAttack(el,z){document.querySelectorAll('#attackZones button').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');attackZone=z}
function selectBlock(el,z){if(blocks.includes(z)){blocks=blocks.filter(x=>x!==z);el.classList.remove('sel');return}if(blocks.length>=2)return toast('Нужно выбрать только 2 зоны');blocks.push(z);el.classList.add('sel')}
function turn(){if(!attackZone||blocks.length!==2)return toast('Выбери атаку и 2 защиты');let enemyAttack=zones[Math.floor(Math.random()*5)],blocked=blocks.includes(enemyAttack);let hit=!['Голова','Грудь','Живот'].includes(attackZone)||Math.random()>.2;let log='';if(hit){let dmg=S.attack+Math.floor(Math.random()*7);if(Math.random()<S.str/100){dmg*=2;log+='Критический удар! '}S.enemyHp=Math.max(0,S.enemyHp-dmg);log+=`Ты попал в ${attackZone}: -${dmg} HP. `}else log+='Ты промахнулся. ';if(S.enemyHp<=0){S.quests.bandit=true;S.coins+=150;S.xp+=80;S.enemyHp=120;levelCheck();log+='Бандит побеждён! +150 🟡 +80 XP.'}else{let dmg=blocked?0:8+Math.floor(Math.random()*7);S.hp=Math.max(0,S.hp-dmg);log+=blocked?`Бандит атаковал ${enemyAttack}, но ты заблокировал удар.`:`Бандит ударил в ${enemyAttack}: -${dmg} HP.`;if(S.hp===0){S.hp=S.maxHp;log+=' Ты восстановился после поражения.'}}attackZone='';blocks=[];save();openPanel('battle');document.getElementById('log').textContent=log}
function claimReward(){S.coins+=250;S.xp+=25;levelCheck();save();toast('+250 🟡 и +25 XP');}
renderTop();let sec=23*3600+45*60;setInterval(()=>{sec=(sec+86399)%86400;let h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');timer.textContent=`${h}:${m}:${s}`;rewardTime.textContent=`${h}:${m}:${s}`},1000);
</script>
</body></html>
