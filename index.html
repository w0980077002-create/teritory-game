<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.name-row{display:flex;align-items:center;justify-content:space-between}.player-name{font-size:23px;font-weight:900}.level{font-size:14px;color:#6ac9ff;font-weight:800}
.xp{height:9px;border:2px solid #187fb8;border-radius:8px;margin:7px 0 3px;overflow:hidden}.xp i{display:block;height:100%;background:#22a7e9;width:0}
#xpText{font-size:12px}.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}.res{height:38px;border:2px solid #1578b9;border-radius:13px;background:#09263c;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}.res b{font-size:17px;margin-right:3px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:5px}.icon-btn{height:38px;border:2px solid #126ca9;border-radius:12px;background:#09263c;font-size:19px;position:relative}
.scene{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(160deg,#1f70a7,#274e70 38%,#10273a 68%,#07131e)}.castle{position:absolute;top:4%;left:0;right:0;text-align:center;font-size:78px;filter:drop-shadow(0 10px 10px #00111e)}.mountain{position:absolute;top:19%;left:0;right:0;text-align:center;font-size:105px;opacity:.72}.hero-art{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:220px;line-height:1;filter:drop-shadow(0 12px 12px #000)}
.panel{position:absolute;z-index:3;border:3px solid #1688d0;border-radius:20px;background:rgba(5,30,49,.94);box-shadow:0 8px 25px #0008;padding:12px}.quest{left:14px;top:18px;width:270px}.bonus{right:14px;top:25px;width:215px;border-color:#ffd51e;text-align:center;background:rgba(30,12,65,.94)}.panel-title{font-weight:900;color:#ffd83b;font-size:16px;margin-bottom:7px}.panel-main{font-size:17px;font-weight:900}.panel-sub{font-size:13px;color:#9ab7cb;margin-top:4px}
.side{position:absolute;right:14px;top:41%;z-index:4;width:260px;display:grid;gap:7px}.side button{height:66px;border:3px solid #1688d0;border-radius:18px;background:#082b46;text-align:left;padding:8px 14px;font-weight:900;font-size:17px;display:flex;align-items:center;gap:10px}.side button span{font-size:25px}.side small{display:block;color:#9ab7cb;font-size:12px;margin-top:2px}
.left-side{position:absolute;left:14px;top:39%;z-index:4;display:grid;gap:7px}.left-side button{width:80px;height:76px;border:3px solid #1688d0;border-radius:17px;background:#082b46;font-size:12px;font-weight:900}.left-side span{display:block;font-size:24px;margin-bottom:3px}
.main-nav{position:absolute;left:14px;right:14px;bottom:10px;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.main-nav button{height:88px;border:3px solid #159be9;border-radius:18px;background:#0b3a5c;font-weight:900;font-size:16px}.main-nav button:nth-child(2){border-color:#f1a900;background:#865400}.main-nav button:nth-child(3){border-color:#8b31ef;background:#48139a}.main-nav button:nth-child(4){border-color:#16d28a;background:#087b54}.main-nav span{display:block;font-size:27px;margin-bottom:4px}
.chat{position:absolute;left:24px;right:24px;bottom:104px;height:52px;border-top:2px solid #14577e;display:flex;align-items:center;justify-content:space-between;font-weight:900}.chat small{display:block;color:#9eb7c7;margin-top:2px}.bottom{height:80px;flex:0 0 80px;background:#061b2c;border-top:2px solid #164968;display:grid;grid-template-columns:repeat(6,1fr)}.bottom button{background:#071e31;border-right:1px solid #164968;color:#9db7c8;font-size:12px;font-weight:900}.bottom button.active{color:#ffe33e;border-bottom:5px solid #ffe33e}.bottom span{display:block;font-size:21px;margin-bottom:4px}
.modal{position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:89dvh;overflow:auto;background:#071a2a;border:2px solid #177fc0;border-bottom:0;border-radius:25px 25px 0 0;padding:17px 14px 28px}.sheet h2{margin:0 0 12px;color:#ffd83b}.close{float:right;background:#173b54;border-radius:10px;padding:7px 12px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:#0a2941;border:2px solid #176ca2;border-radius:16px;padding:11px}.card h3{margin:0 0 6px;font-size:17px}.card p{margin:4px 0;color:#aac0cf;font-size:13px}.card button,.primary{margin-top:8px;width:100%;padding:11px;border-radius:12px;background:#117dc0;font-weight:900}.card button:disabled{opacity:.4}.danger{background:#8b263b!important}.statline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #17425d}.enemy{display:flex;align-items:center;gap:12px;background:#0a2941;border:2px solid #bd3b57;border-radius:17px;padding:10px}.enemy-art{font-size:60px}.hp{height:12px;background:#1c2630;border-radius:8px;overflow:hidden;border:1px solid #7b8790;margin-top:5px}.hp i{display:block;height:100%;background:#ef3655;width:100%}.combat-note{margin:10px 0;color:#9db6c8;font-size:14px}.zone-title{font-weight:900;margin:10px 0 6px}.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.zone{padding:9px 2px;border:2px solid #176da6;border-radius:10px;background:#09283f;font-size:11px;font-weight:900}.zone.selected{background:#146da4;border-color:#70d3ff}.zone.def.selected{background:#7d243d;border-color:#ff7090}.log{min-height:70px;max-height:115px;overflow:auto;background:#061521;border-radius:12px;padding:8px;margin-top:10px;font-size:12px;color:#c3d5df}.loot{margin-top:10px;padding:11px;border:2px solid #e8b82c;border-radius:14px;background:#2a2110}.loot b{color:#ffd83b}.rarity-common{color:#d8e2e8}.rarity-rare{color:#57c7ff}.rarity-epic{color:#cf79ff}.toast{position:fixed;z-index:50;left:50%;bottom:92px;transform:translate(-50%,20px);background:#092b45;border:2px solid #39b8ff;border-radius:14px;padding:11px 17px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}

/* --- Dynamic combat layer --- */
body.combat-open{overflow:hidden}
.modal.combat-modal{align-items:stretch;background:rgba(0,0,0,.86);backdrop-filter:blur(4px)}
.modal.combat-modal .sheet{width:100%;max-width:720px;height:100dvh;max-height:none;border:0;border-radius:0;padding:12px 12px 18px;background:radial-gradient(circle at 50% 18%,#153d5a 0,#071827 48%,#02090f 100%);overflow:auto;position:relative}
.combat-scene{min-height:100%;display:flex;flex-direction:column;position:relative}
.combat-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.combat-title{font-size:21px;font-weight:900;color:#ffd83b}.combat-round{font-size:12px;color:#9ec2d6}
.combatants{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.fighter{position:relative;min-height:150px;border:2px solid #1a79ae;border-radius:18px;background:linear-gradient(180deg,#0d3049,#071927);padding:9px;text-align:center;overflow:hidden}.fighter.enemy-fighter{border-color:#b72f4c}.fighter-art{font-size:74px;line-height:1;filter:drop-shadow(0 8px 8px #000)}.fighter-name{font-weight:900;font-size:14px;margin-top:2px}.fighter-hp{display:flex;justify-content:space-between;font-size:11px;color:#c3d6df;margin-top:5px}.hp.big{height:16px;margin-top:3px;border-radius:10px}.hp.big i{transition:width .35s ease}.player-hp i{background:linear-gradient(90deg,#18d67b,#8af03d)}
.assist-row{display:flex;justify-content:center;gap:5px;margin-top:7px;min-height:29px}.assist{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#123c56;border:2px solid #f0bd36;font-size:16px;box-shadow:0 0 12px #f0bd3644}.assist.hit{animation:assistHit .45s ease}.fighter.flash{animation:fighterFlash .28s ease}.combat-scene.shake{animation:shake .25s linear}.damage-float{position:absolute;z-index:8;pointer-events:none;font-size:27px;font-weight:1000;color:#ff405f;text-shadow:0 2px 0 #000;animation:floatDamage .8s ease-out forwards}.dodge-float{color:#ffd83b;font-size:22px}.heal-float{color:#4dff9c}
.combat-stage{margin:10px 0;min-height:120px;border:2px solid #184a68;border-radius:18px;background:linear-gradient(180deg,#0b2c42aa,#03101aaa);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.vs{font-size:30px;font-weight:1000;color:#ffd83b;text-shadow:0 3px 8px #000}.slash{position:absolute;font-size:80px;opacity:0;pointer-events:none}.slash.show{animation:slash .4s ease}.combat-note.live{padding:8px 10px;border-radius:12px;background:#06131f;color:#a8c7d8;border:1px solid #1a506f}.combat-actions{margin-top:auto}.combat-actions .primary{height:52px;font-size:17px}.combat-actions .zones{margin-bottom:6px}.combat-actions .zone{min-height:42px}.combat-log-live{height:78px;overflow:hidden;background:#030b12d9;border:1px solid #1a4358;border-radius:12px;padding:7px;margin-top:8px;font-size:12px}.combat-log-live div{margin:2px 0;color:#c7dbe4}.combat-log-live div:last-child{color:#fff;font-weight:900}
.loot-card{position:relative}.item-icon{font-size:30px;float:left;margin-right:8px}.item-meta{font-size:12px;color:#9db8c7}.item-stat{color:#74d7ff;font-weight:900}.equipped-badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#0e704f;color:#7dffc3;font-size:11px;font-weight:900}.equip-slot{border:2px solid #6e4cae;background:#170d2b;border-radius:14px;padding:10px;margin-bottom:8px}.equip-slot.empty{border-style:dashed;color:#7790a0}.inventory-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.inventory-actions button{margin-top:0}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-3px,-1px)}}
@keyframes floatDamage{0%{transform:translate(-50%,0) scale(.8);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-70px) scale(1.15);opacity:0}}
@keyframes fighterFlash{0%{filter:none}40%{filter:brightness(2) drop-shadow(0 0 18px #ff3455)}100%{filter:none}}
@keyframes assistHit{0%{transform:scale(1)}50%{transform:scale(1.35) translateY(-5px)}100%{transform:scale(1)}}
@keyframes slash{0%{opacity:0;transform:scale(.5) rotate(-20deg)}35%{opacity:1;transform:scale(1.15) rotate(10deg)}100%{opacity:0;transform:scale(1.4) rotate(20deg)}}
@media(max-width:430px){.hud{height:145px;flex-basis:145px}.avatar{width:96px;height:96px}.player-name{font-size:21px}.side{width:240px;right:10px}.side button{height:61px}.hero-art{font-size:190px}.castle{font-size:65px}.mountain{font-size:85px}.main-nav button{height:82px;font-size:15px}.chat{bottom:98px}}
</style>
</head>
<body>
<div id="app">
<header class="hud">
  <div class="avatar">🧔‍♂️<span id="hudLevel">1</span></div>
  <div>
    <div class="name-row"><div class="player-name" id="hudName">Воин</div><div class="level">Уровень <span id="level">1</span></div></div>
    <div class="xp"><i id="xpBar"></i></div><div id="xpText">0/300 XP</div>
    <div class="resources"><div class="res"><b>🟡</b><span id="coins">1000</span></div><div class="res"><b>◆</b><span id="sdolars">500</span></div><div class="res"><b>ϟ</b><span id="energy">20</span></div></div>
    <div class="actions"><button class="icon-btn" onclick="showSimple('Почта','Новых сообщений нет.')">✉️</button><button class="icon-btn" onclick="openPanel('loot')">🎁</button><button class="icon-btn" onclick="showSimple('Настройки','Состояние сохраняется автоматически.')">⚙️</button><button class="icon-btn" onclick="showSimple('Territory','Локальная MVP-версия для GitHub Pages.')">ⓘ</button></div>
  </div>
</header>

<main class="scene">
  <div class="castle">🏰</div><div class="mountain">🏔️🏔️🏔️</div><div class="hero-art">🧔🏻‍♂️</div>
  <div class="panel quest" onclick="openPanel('quests')"><div class="panel-title">Текущее задание</div><div class="panel-main" id="questText">Победи в бою ›</div><div class="panel-sub">⚔️ Тактический бой</div></div>
  <div class="panel bonus"><div class="panel-title">🎁 Последняя добыча</div><div class="panel-main" id="lastLoot">Нет</div></div>
  <div class="left-side"><button onclick="openPanel('loot')"><span>🎁</span>Лут</button><button onclick="showSimple('События','Случайные события будут добавлены позже.')"><span>❗</span>События</button><button onclick="showSimple('VIP','VIP не входит в этот MVP.')"><span>♛</span>VIP</button></div>
  <div class="side">
    <button onclick="openPanel('forge')"><span>⚒️</span><div>Кузница<small>Улучшение снаряжения</small></div></button>
    <button onclick="openPanel('tavern')"><span>🍺</span><div>Таверна<small>Найм героев</small></div></button>
    <button onclick="openPanel('shop')"><span>🎒</span><div>Магазин<small>Предметы и снаряжение</small></div></button>
  </div>
  <div class="chat"><div>💬 Чат игры<small>Локальная MVP-версия</small></div><b>Открыть ›</b></div>
  <div class="main-nav"><button onclick="openPanel('combat')"><span>⚔️</span>Бой</button><button onclick="openPanel('inventory')"><span>🎒</span>Инвентарь</button><button onclick="openPanel('equipment')"><span>🛡️</span>Экипировка</button><button onclick="openPanel('quests')"><span>📜</span>Задания</button></div>
</main>

<nav class="bottom"><button class="active" onclick="closePanel()"><span>🏠</span>Город</button><button onclick="openPanel('heroes')"><span>⚔️</span>Герои</button><button onclick="openPanel('inventory')"><span>🎒</span>Инвентарь</button><button onclick="openPanel('quests')"><span>📜</span>Задания</button><button onclick="showSimple('Гильдия','Гильдия будет следующим модулем.')"><span>👥</span>Гильдия</button><button onclick="showSimple('Ещё','MVP: бой, лут, кузница, таверна, магазин и сохранение.')"><span>☰</span>Ещё</button></nav>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closePanel()"><section class="sheet" id="sheet"></section></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* Territory MVP: весь игровой код находится в этом файле. */

const SAVE_KEY='territory_combat_loot_mvp';
const ZONES=['Голова','Грудь','Живот','Пояс','Ноги'];

const ENEMIES=[
 {name:'Уличный боец',icon:'🥷',hp:90,str:8,level:1},
 {name:'Наёмник',icon:'🪖',hp:125,str:12,level:2},
 {name:'Северный воин',icon:'🧔',hp:165,str:16,level:3},
 {name:'Элитный страж',icon:'🛡️',hp:215,str:21,level:4}
];

const LOOT=[
 {name:'Малое зелье силы',rarity:'common',str:2,agi:0,value:30},
 {name:'Кожаные перчатки',rarity:'common',str:1,agi:3,value:40},
 {name:'Стальной клинок',rarity:'rare',str:7,agi:0,value:90},
 {name:'Плащ ловкача',rarity:'rare',str:0,agi:7,value:90},
 {name:'Северный топор',rarity:'epic',str:12,agi:1,value:180},
 {name:'Руна воина',rarity:'epic',str:6,agi:6,value:220}
];

const DEFAULT={
 name:'Воин',level:1,xp:0,xpToLevel:300,sdo:500,coins:1000,energy:20,maxEnergy:20,
 strength:10,agility:10,weapon:'Кулаки',weaponBonus:0,equipment:[],inventory:[],recruited:[],
 wins:0,losses:0,battles:0,forgeLevel:0,lastLoot:'Нет',lootHistory:[],
 quest:{firstBattle:false,forge:false,recruit:false,shop:false}, equippedItems:{weapon:null,armor:null,helmet:null,accessory:null}, potionEnergy:0,potionHealth:0
};

let state=loadState(), combat=null, toastTimer=null;

function loadState(){
 try{const x=JSON.parse(localStorage.getItem(SAVE_KEY));return x?merge(DEFAULT,x):structuredClone(DEFAULT)}
 catch(e){return structuredClone(DEFAULT)}
}
function itemFromName(name){
 const all=[...LOOT,...SHOP];
 const x=all.find(i=>i.name===name);
 return x?{...x,id:x.name+'_'+Math.random().toString(36).slice(2),type:itemType(x.name)}:{name:String(name),rarity:'common',str:0,agi:0,value:0,id:String(name),type:'misc'}
}
function itemType(name){
 if(/меч|клинок|топор|кулак|оруж/i.test(name))return 'weapon';
 if(/брон|перчат|плащ/i.test(name))return 'armor';
 if(/шлем/i.test(name))return 'helmet';
 if(/руна/i.test(name))return 'accessory';
 return 'misc'
}
function merge(base,x){
 const s={...base,...x,quest:{...base.quest,...(x.quest||{})},equippedItems:{...base.equippedItems,...(x.equippedItems||{})}};
 ['equipment','inventory','recruited','lootHistory'].forEach(k=>{s[k]=Array.isArray(x[k])?x[k]:[]});
 s.inventory=s.inventory.map(v=>typeof v==='string'?itemFromName(v):v);
 s.equipment=s.equipment.map(v=>typeof v==='string'?itemFromName(v):v);
 s.recruited=s.recruited.map(v=>typeof v==='string'?{name:v,class:'Воин'}:v);
 if(!s.equippedItems.weapon && s.weapon && s.weapon!=='Кулаки'){
   const old=s.inventory.find(i=>i.name===s.weapon)||itemFromName(s.weapon); s.equippedItems.weapon=old;
 }
 return s;
}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2500)}
function updateUI(){
 document.getElementById('hudName').textContent=state.name;
 document.getElementById('level').textContent=state.level;
 document.getElementById('hudLevel').textContent=state.level;
 document.getElementById('coins').textContent=Math.floor(state.coins);
 document.getElementById('sdolars').textContent=Math.floor(state.sdo);
 document.getElementById('energy').textContent=Number.isInteger(state.energy)?state.energy:state.energy.toFixed(1);
 document.getElementById('xpText').textContent=state.xp+'/'+state.xpToLevel+' XP';
 document.getElementById('xpBar').style.width=Math.min(100,state.xp/state.xpToLevel*100)+'%';
 document.getElementById('lastLoot').textContent=state.lastLoot||'Нет';
 document.getElementById('questText').textContent=!state.quest.firstBattle?'Победи в бою ›':!state.quest.forge?'Улучши экипировку ›':!state.quest.recruit?'Найми героя ›':!state.quest.shop?'Купи снаряжение ›':'Все задания выполнены ›';
 save();
}
function addXP(n){
 state.xp+=n;
 while(state.xp>=state.xpToLevel){
   state.xp-=state.xpToLevel;state.level++;state.strength++;state.agility++;
   toast('Новый уровень '+state.level+'! Сила и ловкость +1');
 }
}

/* ---------- animated combat + loot ---------- */
function newCombat(){
 if(state.energy<1){toast('Недостаточно энергии.');return false}
 const pool=ENEMIES.filter(e=>e.level<=state.level+1);const e=pool[Math.floor(Math.random()*pool.length)];
 const scale=Math.max(0,state.level-e.level), max=100+state.level*10;
 combat={enemy:{...e,hp:e.hp+scale*20,maxHp:e.hp+scale*20,str:e.str+scale*2},playerHp:max,playerMaxHp:max,attack:null,defense:[],log:['Противник: '+e.name+'. Выбери атаку и две защиты.'],finished:false,round:0,reward:0,xp:0,loot:null,mercTimer:null};
 return true
}
function openCombat(){if(!combat||combat.finished){if(!newCombat())return}openPanel('combat');startMercenaries()}
function combatPanel(){
 if(!combat)return '';
 const heroes=state.recruited||[];
 return `<div class="combat-scene" id="combatScene">
  <div class="combat-top"><div class="combat-title">⚔️ БОЙ · SDOLARS</div><div class="combat-round">Ход ${combat.round||0}</div><button class="close" onclick="closePanel()">✕</button></div>
  <div class="combatants">
   <div class="fighter"><div class="fighter-art">🧔🏻‍♂️</div><div class="fighter-name">${state.name}</div><div class="fighter-hp"><span>Здоровье</span><b id="playerHpText">${combat.playerHp}/${combat.playerMaxHp}</b></div><div class="hp big"><i id="playerHpBar" class="player-hp" style="width:100%"></i></div><div class="assist-row">${heroes.length?heroes.map((h,i)=>`<div class="assist" id="assist${i}" title="${h.name}">${h.class==='Маг'?'🧙':h.class==='Лучник'?'🏹':h.class==='Вор'?'🥷':'🧔'}</div>`).join(''):'<span style="font-size:11px;color:#7894a5">Нанимай героев в Таверне</span>'}</div>
   <div class="fighter enemy-fighter" id="enemyFighter"><div class="fighter-art">${combat.enemy.icon}</div><div class="fighter-name">${combat.enemy.name}</div><div class="fighter-hp"><span>Здоровье</span><b id="enemyHpText">${combat.enemy.hp}/${combat.enemy.maxHp}</b></div><div class="hp big"><i id="enemyHpBar" style="width:${combat.enemy.hp/combat.enemy.maxHp*100}%"></i></div></div>
  </div>
  <div class="combat-stage"><div class="vs">⚔️ VS ⚔️</div><div class="slash" id="slashFx">⚡</div></div>
  <div class="combat-note live">Каждый ход: <b>1 атака</b> + <b>2 защиты</b>. Наёмники бьют автоматически каждые 3 секунды.</div>
  <div class="combat-actions"><div class="zone-title">Атака</div><div class="zones">${ZONES.map((z,i)=>`<button class="zone atk" data-zone="${i}" onclick="selectAttack(${i})">${z}</button>`).join('')}</div>
  <div class="zone-title">Защита</div><div class="zones">${ZONES.map((z,i)=>`<button class="zone def" data-zone="${i}" onclick="selectDefense(${i})">${z}</button>`).join('')}</div>
  <button class="primary" onclick="combatTurn()" ${combat.finished?'disabled':''}>⚔️ Нанести удар</button><div class="inventory-actions"><button onclick="usePotion('energy')">⚡ Зелье энергии (${state.potionEnergy||0})</button><button onclick="usePotion('health')">❤️ Зелье здоровья (${state.potionHealth||0})</button></div><button class="primary danger" onclick="restartCombat()">↻ Сдаться</button></div>
  <div class="combat-log-live" id="combatLog">${combat.log.slice(-6).map(x=>`<div>• ${x}</div>`).join('')}</div>
  ${combat.finished?`<div class="loot"><b>${combat.enemy.hp<=0?'🏆 ПОБЕДА':'💀 ПОРАЖЕНИЕ'}</b><br>${combat.loot?combat.loot.name:'Награда'}<br>◆ +${combat.reward||0} · XP +${combat.xp||0}</div>`:''}
 </div>`
}
function renderCombat(){
 if(!combat)return;
 document.querySelectorAll('.zone.atk').forEach(b=>b.classList.toggle('selected',+b.dataset.zone===combat.attack));
 document.querySelectorAll('.zone.def').forEach(b=>b.classList.toggle('selected',combat.defense.includes(+b.dataset.zone)));
 const eb=document.getElementById('enemyHpBar'),pb=document.getElementById('playerHpBar');
 if(eb)eb.style.width=Math.max(0,combat.enemy.hp/combat.enemy.maxHp*100)+'%';
 if(pb)pb.style.width=Math.max(0,combat.playerHp/combat.playerMaxHp*100)+'%';
 const et=document.getElementById('enemyHpText'),pt=document.getElementById('playerHpText');if(et)et.textContent=Math.max(0,combat.enemy.hp)+'/'+combat.enemy.maxHp;if(pt)pt.textContent=Math.max(0,combat.playerHp)+'/'+combat.playerMaxHp;
 const log=document.getElementById('combatLog');if(log)log.innerHTML=combat.log.slice(-6).map(x=>`<div>• ${x}</div>`).join('');
}
function effect(text,type='damage',target='enemy'){
 const scene=document.getElementById('combatScene');if(!scene)return;
 const el=document.createElement('div');el.className='damage-float '+(type==='dodge'?'dodge-float':type==='heal'?'heal-float':'');el.textContent=text;
 el.style.left=target==='player'?'25%':'75%';el.style.top=target==='player'?'42%':'36%';scene.appendChild(el);setTimeout(()=>el.remove(),850);
 if(type==='damage'){scene.classList.remove('shake');void scene.offsetWidth;scene.classList.add('shake');}
 if(target==='enemy'){const f=document.getElementById('enemyFighter');if(f){f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash')}}
}
function startMercenaries(){
 if(!combat||combat.finished||!state.recruited.length)return;
 clearInterval(combat.mercTimer);combat.mercTimer=setInterval(()=>mercenaryStrike(),3000)
}
function stopMercenaries(){if(combat&&combat.mercTimer){clearInterval(combat.mercTimer);combat.mercTimer=null}}
function mercenaryStrike(){
 if(!combat||combat.finished||!state.recruited.length)return;
 const h=state.recruited[Math.floor(Math.random()*state.recruited.length)], dmg=5+Math.floor(state.level*1.5)+Math.floor(Math.random()*6);
 combat.enemy.hp=Math.max(0,combat.enemy.hp-dmg);combat.log.push(h.name+' нанес '+dmg+' урона!');effect('-'+dmg,'damage','enemy');
 const idx=state.recruited.indexOf(h),a=document.getElementById('assist'+idx);if(a){a.classList.remove('hit');void a.offsetWidth;a.classList.add('hit')}
 renderCombat();
 if(combat.enemy.hp<=0)finishWin();
}
function selectAttack(i){if(!combat||combat.finished)return;combat.attack=i;renderCombat()}
function selectDefense(i){if(!combat||combat.finished)return;const p=combat.defense.indexOf(i);if(p>=0)combat.defense.splice(p,1);else if(combat.defense.length<2)combat.defense.push(i);else toast('Нужно выбрать 2 зоны защиты.');renderCombat()}
function combatTurn(){
 if(!combat||combat.finished)return;if(combat.attack===null||combat.defense.length!==2){toast('Выбери 1 атаку и 2 защиты.');return}if(state.energy<1){toast('Недостаточно энергии.');return}
 state.energy--;combat.round=(combat.round||0)+1;
 const blockedByEnemy=Math.random()<.28, crit=Math.random()<Math.min(.32,.08+state.strength*.009), hit=Math.random()<Math.min(.95,.68+state.agility*.007);let dmg=0;
 if(hit&&!blockedByEnemy){dmg=9+state.strength+state.weaponBonus+(crit?Math.ceil((9+state.strength)*.55):0);dmg=Math.round(dmg*(1+state.recruited.length*.05));combat.enemy.hp=Math.max(0,combat.enemy.hp-dmg);combat.log.push((crit?'КРИТ! ':'')+'Попадание в '+ZONES[combat.attack]+': -'+dmg+' HP.');effect('-'+dmg,'damage','enemy')}
 else if(blockedByEnemy){combat.log.push('Противник закрыл твою зону атаки.');effect('Блок!','dodge','enemy')}
 else{combat.log.push('Ты промахнулся.');effect('Промах','dodge','enemy')}
 if(combat.enemy.hp<=0){finishWin();renderCombat();return}
 const enemyZone=Math.floor(Math.random()*5),blocked=combat.defense.includes(enemyZone),dodge=Math.random()<Math.min(.35,.05+state.agility*.012);
 if(blocked){combat.log.push('Ты заблокировал '+ZONES[enemyZone]+'.');effect('Блок!','dodge','player')}
 else if(dodge){combat.log.push('Уклонение!');effect('Уклонение!','dodge','player')}
 else{const edmg=5+combat.enemy.str;combat.playerHp=Math.max(0,combat.playerHp-edmg);combat.log.push(combat.enemy.name+' ударил в '+ZONES[enemyZone]+': -'+edmg+' HP.');effect('-'+edmg,'damage','player')}
 if(combat.playerHp<=0){finishLoss();renderCombat();return}
 combat.attack=null;combat.defense=[];save();updateUI();renderCombat()
}
function finishWin(){if(!combat||combat.finished)return;stopMercenaries();combat.finished=true;state.wins++;state.battles++;state.quest.firstBattle=true;const reward=30+state.level*12+Math.floor(Math.random()*21),xp=90+state.level*25;state.sdo+=reward;addXP(xp);let item=null;if(Math.random()<.72){const r=Math.random(),source=r<.58?LOOT.filter(x=>x.rarity==='common'):r<.88?LOOT.filter(x=>x.rarity==='rare'):LOOT.filter(x=>x.rarity==='epic');const picked=source[Math.floor(Math.random()*source.length)];item={...picked,id:Date.now()+'_'+Math.random().toString(36).slice(2),type:itemType(picked.name)};state.inventory.push(item);state.lootHistory.unshift(item.name);state.lootHistory=state.lootHistory.slice(0,20);state.lastLoot=item.name;combat.loot=item;combat.log.push('🎁 Добыча: '+item.name+'.')}else{state.lastLoot='◆ '+reward+' Sdolars';combat.log.push('В этот раз предмет не выпал.')}combat.reward=reward;combat.xp=xp;combat.log.push('🏆 ПОБЕДА! +'+reward+' ◆ и +'+xp+' XP.');toast(item?'Победа! Выпал '+item.name:'Победа! +'+reward+' ◆');save();updateUI();renderCombat()}
function finishLoss(){if(!combat||combat.finished)return;stopMercenaries();combat.finished=true;state.losses++;state.battles++;combat.log.push('💀 ПОРАЖЕНИЕ. Награда не получена.');toast('Поражение. Попробуй другую тактику.');save();updateUI()}
function restartCombat(){stopMercenaries();combat=null;openCombat()}

/* ---------- loot ---------- */
function lootPanel(){
 return `<button class="close" onclick="closePanel()">✕</button><h2>🎁 Добыча</h2>
 <div class="card"><p>Последняя добыча:</p><h3>${state.lastLoot||'Нет'}</h3><p>Всего предметов: <b>${state.lootHistory.length}</b></p></div>
 <div class="card" style="margin-top:9px">${state.lootHistory.length?state.lootHistory.map(x=>`<div class="statline"><span>🎁 ${x}</span><b>найден</b></div>`).join(''):'Предметы ещё не найдены. Побеждай в боях.'}</div>`;
}

/* ---------- panels ---------- */
function openPanel(type){
 let h='';
 if(type==='combat'){if(!combat&&!newCombat())return;h=combatPanel()}
 else if(type==='loot')h=lootPanel();
 else if(type==='forge')h=forgePanel();
 else if(type==='tavern')h=tavernPanel();
 else if(type==='shop')h=shopPanel();
 else if(type==='inventory')h=inventoryPanel();
 else if(type==='equipment')h=equipmentPanel();
 else if(type==='heroes')h=heroesPanel();
 else if(type==='quests')h=questsPanel();
 document.getElementById('sheet').innerHTML=h;const modal=document.getElementById('modal');modal.classList.toggle('combat-modal',type==='combat');modal.classList.add('show');document.body.classList.toggle('combat-open',type==='combat');if(type==='combat'){renderCombat();startMercenaries()}
}
function closePanel(){stopMercenaries();document.getElementById('modal').classList.remove('show','combat-modal');document.body.classList.remove('combat-open')}
function showSimple(t,x){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closePanel()">✕</button><h2>${t}</h2><div class="card">${x}</div>`;document.getElementById('modal').classList.add('show')}

function forgePanel(){const coins=200,cr=Math.floor(50*Math.pow(1.5,state.forgeLevel));return `<button class="close" onclick="closePanel()">✕</button><h2>⚒️ Кузница</h2><div class="card"><h3>Улучшение оружия / брони</h3><p>Уровень: <b>${state.forgeLevel}</b></p><p>Сила: <b>${state.strength}</b> · Ловкость: <b>${state.agility}</b></p><p>Следующее улучшение: <b>${coins} 🟡 + ${cr} ◆</b></p><div class="inventory-actions"><button onclick="upgradeForge('strength')">⚔️ +2 Сила</button><button onclick="upgradeForge('agility')">🏃 +2 Ловкость</button></div></div>`}
function upgradeForge(stat){const cr=Math.floor(50*Math.pow(1.5,state.forgeLevel));if(state.coins<200||state.sdo<cr){toast('Недостаточно ресурсов: нужно 200 🟡 и '+cr+' ◆.');return}state.coins-=200;state.sdo-=cr;state.forgeLevel++;state[stat]+=2;state.quest.forge=true;save();updateUI();toast('Снаряжение улучшено до уровня '+state.forgeLevel+'!');openPanel('forge')}
const HEROES=[['Рагнар','Воин','🧔'],['Сигрид','Маг','🧙'],['Эйрик','Лучник','🏹'],['Астрид','Вор','🥷'],['Хальвар','Воин','🪓'],['Фрейя','Маг','🧙'],['Гуннар','Лучник','🏹'],['Лагерта','Вор','🥷'],['Торстен','Воин','🛡️'],['Ингрид','Маг','🧙']];
function tavernPanel(){return `<button class="close" onclick="closePanel()">✕</button><h2>🍺 Таверна</h2><div class="card"><h3>Найм случайного рекрута — 500 🟡</h3><p>Наёмников: <b>${state.recruited.length}</b></p><p>Каждый наёмник: <b>+5% урона</b> и автоматический удар каждые 3 секунды.</p><button onclick="recruitHero()" ${state.coins<500?'disabled':''}>🍺 Нанять за 500 🟡</button></div><div class="card" style="margin-top:9px">${state.recruited.length?state.recruited.map(h=>`<div class="statline"><span>${h.class==='Маг'?'🧙':h.class==='Лучник'?'🏹':h.class==='Вор'?'🥷':'🧔'} ${h.name}</span><b>${h.class}</b></div>`).join(''):'Героев пока нет.'}</div>`}
function recruitHero(){if(state.coins<500){toast('Недостаточно 🟡.');return}state.coins-=500;const h=HEROES[Math.floor(Math.random()*HEROES.length)];state.recruited.push({name:h[0],class:h[1],icon:h[2]});state.quest.recruit=true;save();updateUI();toast('Нанят '+h[0]+' — '+h[1]+'!');openPanel('tavern')}
const SHOP=[{name:'Стальной меч',cost:180,str:5,agi:0,type:'weapon',icon:'⚔️'},{name:'Кожаная броня',cost:150,str:0,agi:4,type:'armor',icon:'🥋'},{name:'Боевой шлем',cost:120,str:2,agi:2,type:'helmet',icon:'⛑️'},{name:'Тяжёлый топор',cost:260,str:8,agi:-1,type:'weapon',icon:'🪓'},{name:'Зелье Энергии',cost:100,str:0,agi:0,type:'potionEnergy',icon:'⚡'},{name:'Зелье Здоровья',cost:100,str:0,agi:0,type:'potionHealth',icon:'❤️'}];
function shopPanel(){return `<button class="close" onclick="closePanel()">✕</button><h2>🛒 Магазин</h2><div class="grid">${SHOP.map((x,i)=>`<div class="card"><div class="item-icon">${x.icon}</div><h3>${x.name}</h3><p>${x.type.startsWith('potion')?'Расходник':'Сила +'+x.str+' · Ловкость '+(x.agi>=0?'+':'')+x.agi}</p><p><b>${x.cost} 🟡</b></p><button onclick="buyItem(${i})">Купить</button></div>`).join('')}</div>`}
function buyItem(i){const x=SHOP[i];if(state.coins<x.cost){toast('Недостаточно 🟡.');return}state.coins-=x.cost;if(x.type==='potionEnergy')state.potionEnergy++;else if(x.type==='potionHealth')state.potionHealth++;else state.inventory.push({...x,id:Date.now()+'_'+i});state.quest.shop=true;save();updateUI();toast('Куплено: '+x.name);openPanel('shop')}
function inventoryPanel(){return `<button class="close" onclick="closePanel()">✕</button><h2>🎒 Инвентарь</h2><div class="card"><p>Предметов: <b>${state.inventory.length}</b> · ⚡ ${state.potionEnergy||0} · ❤️ ${state.potionHealth||0}</p>${state.inventory.length?state.inventory.map((x,i)=>`<div class="statline loot-card"><span><span class="item-icon">${x.icon||'🎁'}</span><b>${x.name}</b><br><span class="item-meta">${x.rarity||'магазин'} · <span class="item-stat">Сила +${x.str||0}, Ловкость +${x.agi||0}</span></span></span><button style="width:auto;margin:0;padding:8px 10px" onclick="equipItem(${i})">Надеть</button></div>`).join(''):'Инвентарь пуст — побеждай и получай лут.'}<div class="inventory-actions"><button onclick="usePotion('energy')">⚡ Энергия +10</button><button onclick="usePotion('health')">❤️ Здоровье +30</button></div></div>`}
function equipItem(i){const item=state.inventory[i];if(!item||!['weapon','armor','helmet','accessory'].includes(item.type)){toast('Этот предмет нельзя надеть.');return}const old=state.equippedItems[item.type];if(old){state.strength-=Number(old.str)||0;state.agility-=Number(old.agi)||0;state.inventory.push(old)}state.inventory.splice(i,1);state.equippedItems[item.type]=item;state.strength+=Number(item.str)||0;state.agility+=Number(item.agi)||0;if(item.type==='weapon'){state.weapon=item.name;state.weaponBonus=Number(item.str)||0}save();updateUI();toast(item.name+' надет!');openPanel('inventory')}
function equipmentPanel(){const slots=[['weapon','⚔️ Оружие'],['armor','🛡️ Броня'],['helmet','⛑️ Шлем'],['accessory','🔮 Аксессуар']];return `<button class="close" onclick="closePanel()">✕</button><h2>🛡️ Экипировка</h2><div class="card">${slots.map(([k,label])=>{const x=state.equippedItems[k];return `<div class="equip-slot ${x?'':'empty'}"><b>${label}</b><div style="margin-top:6px">${x?`${x.icon||'🎁'} <b>${x.name}</b><br><span class="item-stat">+${x.str||0} Сила · +${x.agi||0} Ловкость</span><button onclick="unequipItem('${k}')">Снять</button>`:'Пусто'}</div></div>`}).join('')}<div class="statline">⚔️ Сила <b>${state.strength}</b></div><div class="statline">🏃 Ловкость <b>${state.agility}</b></div><div class="statline">🔨 Кузница <b>${state.forgeLevel}</b></div></div>`}
function unequipItem(type){const x=state.equippedItems[type];if(!x)return;state.strength-=Number(x.str)||0;state.agility-=Number(x.agi)||0;state.inventory.push(x);state.equippedItems[type]=null;if(type==='weapon'){state.weapon='Кулаки';state.weaponBonus=0}save();updateUI();toast(x.name+' снят.');openPanel('equipment')}
function usePotion(type){if(type==='energy'){if((state.potionEnergy||0)<1){toast('Нет зелий энергии.');return}state.potionEnergy--;state.energy=Math.min(state.maxEnergy,state.energy+10);toast('Энергия +10')}else{if((state.potionHealth||0)<1){toast('Нет зелий здоровья.');return}if(!combat||combat.finished){toast('Зелье здоровья можно использовать только в бою.');return}state.potionHealth--;combat.playerHp=Math.min(combat.playerMaxHp,combat.playerHp+30);effect('+30','heal','player');toast('Здоровье +30')}save();updateUI();if(combat&&!combat.finished)renderCombat()}
function heroesPanel(){const bonus=state.recruited.length*5;return `<button class="close" onclick="closePanel()">✕</button><h2>⚔️ Герои</h2><div class="card"><p>Наёмников: <b>${state.recruited.length}</b> · Бонус урона: <b>+${bonus}%</b></p>${state.recruited.length?state.recruited.map(h=>`<div class="statline">${h.icon||'🧔'} ${h.name}<b>${h.class}</b></div>`).join(''):'Героев нет. Иди в Таверну.'}</div>`}
function questsPanel(){const q=state.quest;return `<button class="close" onclick="closePanel()">✕</button><h2>📜 Задания</h2><div class="card"><div class="statline">⚔️ Победа <b>${q.firstBattle?'✓':'○'}</b></div><div class="statline">⚒ Кузница <b>${q.forge?'✓':'○'}</b></div><div class="statline">🍺 Герой <b>${q.recruit?'✓':'○'}</b></div><div class="statline">🎒 Магазин <b>${q.shop?'✓':'○'}</b></div></div>`}

setInterval(()=>{updateUI()},1000);
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
updateUI();
</script>
</body>
</html>
