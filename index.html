<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Territory — Sdolars</title>
    <style>
        :root {
            --bg-dark: rgba(10, 14, 20, 0.92);
            --bg-card: rgba(22, 27, 34, 0.85);
            --border-color: rgba(56, 139, 253, 0.25);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-gold: #e3b341;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-purple: #bc8cff;
            --accent-red: #f85149;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d1117; color: var(--text-main); }
        
        .game-container {
            position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto;
            background: url('assets/home-screen.png') center center / cover no-repeat;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)) 12px;
        }

        .screen { display: none; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; margin: 10px 0; }
        .screen.active { display: flex; }

        .header-panel { background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 12px; backdrop-filter: blur(15px); }
        .top-bar { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
        .avatar-area { position: relative; width: 46px; height: 46px; }
        .avatar-circle { width: 100%; height: 100%; background: linear-gradient(135deg, #e3b341, #8a6d25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid #fff; box-shadow: 0 0 10px rgba(227,179,65,0.4); }
        .avatar-lvl { position: absolute; bottom: -4px; left: -4px; background: #0d1117; border: 1px solid var(--accent-gold); color: var(--accent-gold); font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 6px; }
        
        .profile-info h3 { font-size: 15px; color: #fff; font-weight: 800; letter-spacing: 0.5px; }
        .profile-info p { font-size: 11px; color: var(--accent-gold); font-weight: 600; margin-top: 1px; }
        
        .exp-container { width: 100%; background: rgba(255,255,255,0.1); height: 5px; border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .exp-bar { height: 100%; background: var(--accent-blue); width: 80%; transition: width 0.3s; }

        .resources-grid { display: flex; gap: 6px; justify-content: flex-end; }
        .res-badge { background: rgba(0,0,0,0.4); padding: 5px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 4px; }
        
        .sys-row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
        .btn-sys { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; position: relative; }

        .quest-container { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; }
        .quest-card { background: linear-gradient(90deg, rgba(88, 166, 255, 0.15), transparent); background-color: var(--bg-dark); border-left: 4px solid var(--accent-blue); padding: 10px 12px; border-radius: 0 12px 12px 0; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .timer-card { background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        .split-layout { display: grid; grid-template-columns: 85px 1fr; gap: 10px; align-items: start; }
        .left-menu { display: flex; flex-direction: column; gap: 8px; }
        .right-menu { display: flex; flex-direction: column; gap: 8px; }

        .game-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; position: relative; transition: background-color 0.2s; backdrop-filter: blur(10px); }
        .game-card:active { background: rgba(33, 38, 45, 0.95); }
        .game-card-icon { font-size: 22px; width: 32px; text-align: center; }
        .game-card-text h4 { font-size: 13px; font-weight: 700; color: #fff; }
        .game-card-text p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .small-card { background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.08); padding: 10px 6px; border-radius: 10px; text-align: center; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: bold; }

        .dot-notify { position: absolute; top: -2px; right: -2px; background: var(--accent-red); width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid #0d1117; box-shadow: 0 0 6px var(--accent-red); }

        .mid-actions { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 6px; }
        .btn-action { padding: 10px; border-radius: 10px; border: none; font-weight: bold; font-size: 12px; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .btn-act-battle { background: linear-gradient(135deg, var(--accent-red), #901d1b); border: 1px solid rgba(255,255,255,0.1); }
        .btn-act-inv { background: linear-gradient(135deg, #bf7a1d, #734509); }
        .btn-act-equip { background: linear-gradient(135deg, #6f42c1, #4c298a); }
        .btn-act-quests { background: linear-gradient(135deg, #238636, #145220); }

        .chat-bar { background: rgba(0, 0, 0, 0.5); border-radius: 10px; padding: 8px 12px; font-size: 11px; border-left: 3px solid var(--accent-gold); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(5px); }

        .bottom-nav { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--bg-dark); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 6px 2px; backdrop-filter: blur(20px); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 10px; cursor: pointer; text-decoration: none; font-weight: 500; }
        .nav-item.active { color: var(--accent-gold); font-weight: bold; }
        .nav-icon { font-size: 16px; }

        .combat-panel { text-align: center; display: flex; flex-direction: column; gap: 12px; }
        .fighter-block { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .hp-container { width: 100%; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(0,0,0,0.5); }
        .hp-fill { height: 100%; background: var(--accent-green); transition: width 0.3s; }
        .hp-fill.enemy { background: var(--accent-red); }
        .zone-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
        .zone-btn { background: #21262d; border: 1px solid rgba(255,255,255,0.08); padding: 10px 2px; border-radius: 8px; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; }
        .zone-btn.selected { background: var(--accent-blue); border-color: #fff; box-shadow: 0 0 8px var(--accent-blue); }
        .zone-btn.def-selected { background: var(--accent-purple); border-color: #fff; box-shadow: 0 0 8px var(--accent-purple); }
        .btn-lock { background: var(--accent-green); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; box-shadow: 0 4px 12px rgba(35,134,54,0.4); }
        .combat-log { background: rgba(0,0,0,0.5); border-radius: 10px; padding: 10px; font-size: 12px; min-height: 60px; text-align: left; max-height: 110px; overflow-y: auto; color: #c9d1d9; border: 1px solid rgba(255,255,255,0.05); }

        .items-list { display: flex; flex-direction: column; gap: 6px; }
        .item-row { background: var(--bg-card); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .btn-action-small { background: var(--accent-blue); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="header-panel">
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="avatar-area">
                        <div class="avatar-circle">👑</div>
                        <div class="avatar-lvl" id="ui-avatar-lvl">3</div>
                    </div>
                    <div class="profile-info">
                        <h3 id="ui-name">Загрузка...</h3>
                        <p id="ui-title">Загрузка состояния...</p>
                        <div class="exp-container"><div id="ui-exp-bar" class="exp-bar"></div></div>
                    </div>
                </div>
                <div class="resources-grid">
                    <div class="res-badge">🪙 <span id="ui-coins">0</span></div>
