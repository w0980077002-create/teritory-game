<body>
<div id="app">
  <div id="scene">
    <div class="sky"></div><div class="mountains"></div>
    <div class="castle"><div class="body"></div><div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div><div class="flag"></div></div>
    <div class="water"></div><div class="dock"></div><div class="ship ship1"></div><div class="ship ship2"></div>
    <div class="hero"><div class="fur"></div><div class="torso"></div><div class="head"></div><div class="beard"></div><div class="axe"></div></div>
  </div>

  <header class="header">
    <div class="avatar">⚔️</div>
    <div class="profile">
      <div class="name" id="playerName">S$$</div>

  <div class="quick">

  <div class="task" onclick="openPanel('quest')">

  </div>

  <div class="bonus" onclick="claim('daily.claim')">
    <b>🎁 Ежедневный бонус</b>
    <strong>ЗАБРАТЬ</strong>
  </div>

  <div class="side">
    <button onclick="openPanel('bonus')">🎁<br>Бонусы<em>!</em></button>
    <button onclick="openPanel('events')">📜<br>События<em>!</em></button>
    <button onclick="openPanel('vip')">👑<br>VIP</button>
  </div>

  <div class="right">
    <button onclick="openPanel('forge')"><b>⚒ Кузница</b><span>Улучшение снаряжения</span></button>
    <button onclick="openPanel('tavern')"><b>🍺 Таверна</b><span>Найм героев</span></button>
    <button onclick="openPanel('shop')"><b>🛍 Магазин</b><span>Предметы и снаряжение</span></button>
  </div>

  <div class="actions">
    <button class="battleBtn" onclick="startBattle()">⚔️<br>Бой</button>
    <button class="invBtn" onclick="openPanel('inventory')">🎒<br>Инвентарь</button>
    <button class="gearBtn" onclick="openPanel('hero')">🛡️<br>Экипировка</button>
    <button class="questBtn" onclick="openPanel('missions')">📜<br>Задания</button>
  </div>

  <div class="chatbar" onclick="openPanel('chat')">
    <div>💬 <b>Чат игры</b><span>Общий чат и чат клана</span></div>
    <button>Открыть ›</button>
  </div>

  <nav class="nav">
    <button class="active" onclick="closePanel()"><i>🏠</i>Город</button>
    <button onclick="openPanel('districts')"><i>⚔️</i>Районы</button>
    <button onclick="openPanel('hero')"><i>🧔</i>Герой</button>
    <button onclick="openPanel('inventory')"><i>🎒</i>Инвентарь</button>
    <button onclick="openPanel('guild')"><i>👥</i>Гильдия</button>
    <button onclick="openPanel('more')"><i>☰</i>Ещё</button>
  </nav>

  <section id="panel" class="overlay">
    <div class="panel">
      <div class="panelHead"><h2 id="panelTitle">Territory</h2><button class="close" onclick="closePanel()">✕</button></div>
      <div id="panelBody"></div>
    </div>
  </section>

  <section id="battle" class="overlay">
    <div class="panel">
      <div class="panelHead"><h2>Тактический бой</h2><button class="close" onclick="closeBattle()">✕</button></div>

      <div id="defenseZones" class="grid"></div>
      <div id="roundResult" class="card">Выбери атаку и две защиты.</div>
      <button class="btn" onclick="submitTurn()">Подтвердить ход</button>
    </div>
  </section>

  <div id="toast" class="toast"></div>
</div>

<script>
const zones = ["Голова", "Грудь", "Пояс", "Ноги"];
let state = null;
let battle = null;
let selectedAttack = null;
let selectedDefs = new Set();
let socket = null;

function toast(message) {
  const element = document.getElementById("toast");
  element.textContent = message;
  element.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    element.style.display = "none";
  }, 2200);
}

async function callApi(route, data = {}) {
  try {
    const response = await fetch("/api/" + route, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (result.state) {
      state = result.state;
      renderHud();
    }

    if (!result.ok) {
      toast(errorText(result.error));
    }

    return result;
  } catch (error) {
    toast("Нет соединения с сервером");
    return { ok: false, error: "network_error" };
  }
}

function errorText(error) {
  const map = {
    no_energy: "Недостаточно энергии",
    not_enough_coins: "Недостаточно монет",
    not_enough_materials: "Не хватает материалов",
    level_required: "Нужен более высокий уровень",
    already_claimed: "Уже получено",
    invalid_move: "Неверный ход",
    no_active_battle: "Нет активного боя",
    battle_active: "Бой уже идёт",
    full_hp: "Здоровье уже полное",
    mission_locked: "Миссия ещё не выполнена",
    achievement_locked: "Достижение ещё не открыто",
    season_locked: "Сезонная награда пока недоступна",
    quest_not_complete: "Задание ещё не выполнено"
  };
  return map[error] || error || "Ошибка";
}

async function loadState() {
  const result = await callApi("state");
  if (result.ok) renderHud();
}

function renderHud() {
  if (!state) return;

  document.getElementById("playerName").textContent = state.playerName || "Игрок";
  document.getElementById("levelText").textContent = "Глава 5 · Уровень " + (state.level || 1);
  document.getElementById("coins").textContent = state.coins ?? 0;
  document.getElementById("gems").textContent = state.gems ?? 0;
  document.getElementById("energy").textContent = state.energy ?? 0;
  document.getElementById("xpText").textContent = `${state.exp || 0}/${state.maxExp || 100}`;

  const percent = Math.max(0, Math.min(100, ((state.exp || 0) / Math.max(1, state.maxExp || 100)) * 100));
  document.getElementById("xpBar").style.width = percent + "%";
}

function closePanel() {
  document.getElementById("panel").classList.remove("open");
}

function openPanel(type) {
  const panel = document.getElementById("panel");
  const title = document.getElementById("panelTitle");
  const body = document.getElementById("panelBody");

  const views = {
    hero: [
      "Персонаж",
      `<div class="card"><b>${esc(state?.playerName || "Игрок")}</b><div class="muted">Уровень ${state?.level || 1} · XP ${state?.exp || 0}/${state?.maxExp || 100}</div><div class="muted">HP ${state?.hp || 0}/${state?.maxHp || 0} · Сила ${state?.strength || 0} · Ловкость ${state?.agility || 0}</div><div class="muted">Свободные очки: ${state?.freePoints || 0}</div><div class="grid"><button class="btn" onclick="addStat('strength')">Сила +</button><button class="btn" onclick="addStat('agility')">Ловкость +</button></div></div>`
    ],
    inventory: ["Инвентарь", `<div id="items"></div>`],
    shop: ["Магазин", `<div id="shop"></div>`],
    forge: ["Кузница", `<div class="card"><b>⚒ Крафт оружия</b><div class="muted">2 железа + 2 дерева + 1 кожа.</div><button class="btn" onclick="claim('craft')">Ковать</button></div><div class="card"><b>Уровень кузницы: ${state?.forgeLevel || 0}</b></div>`],
    tavern: ["Таверна", `<div class="card"><b>🍺 Нанять героя</b><div class="muted">Стоимость: 300 монет</div><button class="btn" onclick="claim('tavern.recruit')">Нанять</button></div>`],
    bonus: ["Бонусы", `<div class="card"><b>🎁 Ежедневный бонус</b><div class="muted">250 монет + 10 энергии + 20 XP</div><button class="btn" onclick="claim('bonus.claim')">Забрать</button></div>`],
    events: ["События", `<div class="card"><b>⚔️ Событие Sdolars</b><div class="muted">Стоимость: 3 энергии</div><button class="btn" onclick="claim('event.fight')">Участвовать</button></div>`],
    vip: ["VIP", `<div class="card"><b>👑 VIP Territory</b><div class="muted">Раздел готов для серверных привилегий.</div></div>`],
    guild: ["Гильдия", `<div class="card"><b>${esc(state?.guildName || "Sdolars")}</b><div class="muted">Участники: ${state?.guildMembers || 1} · Вклад: ${state?.guildContrib || 0} · Рейтинг: ${state?.rating || 1000}</div><button class="btn" onclick="guildContribute()">Внести 100 монет</button></div>`],
    missions: ["Миссии", `<div class="card"><b>🏆 Большая миссия</b><div class="muted">Победи 3 противников.</div><button class="btn" onclick="claim('mission.claim')">Получить награду</button></div>`],
    quest: ["Задания", `<div class="card"><b>Поговори с кузнецом</b><div class="muted">Нажми, чтобы начать, затем выполни действие в кузнице.</div><button class="btn" onclick="questStart('forge')">Начать</button><button class="btn" onclick="questProgress('forge')">Отметить выполнение</button><button class="btn" onclick="questClaim('forge')">Забрать награду</button></div><div class="card"><b>Разведка района</b><div class="muted">Проведи разведку за 2 энергии.</div><button class="btn" onclick="questStart('scout')">Начать</button><button class="btn" onclick="scout()">Разведать</button><button class="btn" onclick="questClaim('scout')">Забрать награду</button></div>`],
    districts: ["Районы", `<div id="districts"></div>`],
    achievements: ["Достижения", `<div class="card"><b>🏆 Первая победа</b><div class="muted">Победи хотя бы одного противника.</div><button class="btn" onclick="claim('achievement.claim')">Получить</button></div>`],
    settings: ["Настройки", `<div class="card"><b>Язык</b><div class="grid"><button class="btn" onclick="toast('Русский активен')">RU</button><button class="btn" onclick="toast('English UI — следующий этап')">EN</button></div></div>`],
    chat: ["Чат", `<div id="chatlog" class="log"></div><div class="row"><input id="chatinput" class="input" maxlength="500" placeholder="Сообщение"><button class="btn" style="width:auto" onclick="sendChat()">➤</button></div>`],
    more: ["Ещё", `<div class="grid"><button class="btn" onclick="claim('resource.gather')">🌲 Ресурсы</button><button class="btn" onclick="claim('rest')">❤️ Отдых</button><button class="btn" onclick="claim('season.claim')">🏅 Сезон</button><button class="btn" onclick="openPanel('districts')">🗺️ Районы</button></div><div class="card"><b>Материалы</b><div class="muted">Железо ${state?.materials?.iron || 0} · Дерево ${state?.materials?.wood || 0} · Кожа ${state?.materials?.leather || 0} · Травы ${state?.materials?.herbs || 0}</div></div>`]
  };

  const view = views[type] || views.more;
  title.textContent = view[0];
  body.innerHTML = view[1];
  panel.classList.add("open");

  if (type === "inventory") renderItems();
  if (type === "shop") renderShop();
  if (type === "districts") renderDistricts();
  if (type === "chat") connectChat();
}

function renderItems() {
  const element = document.getElementById("items");
  if (!element) return;

  const items = state?.items || [];
  element.innerHTML = items.length
    ? items.map((item) => `
      <div class="card item">
        <div style="font-size:26px">${esc(item.icon)}</div>
        <div class="grow"><b>${esc(item.name)}</b><div class="muted">${esc(item.type)} · ${item.equipped ? "Экипировано" : "В инвентаре"} · x${item.qty}</div></div>
        <button class="btn" style="width:auto" onclick="itemAction('${escAttr(item.id)}','${item.equipped ? "unequip" : "equip"}')">${item.equipped ? "Снять" : "Надеть"}</button>
      </div>`).join("")
    : `<div class="card">Инвентарь пуст.</div>`;
}

function renderShop() {
  const element = document.getElementById("shop");
  if (!element) return;

  const catalog = [
    ["knife", "🔪", "Нож", 220],
    ["heavyaxe", "🪓", "Тяжёлый топор", 700],
    ["steel", "🛡️", "Стальная броня", 650],
    ["bandage", "🩹", "Аптечка", 80]
  ];

  element.innerHTML = catalog.map((item) => `
    <div class="card">
      <b>${item[1]} ${item[2]}</b>
      <div class="muted">${item[3]} монет</div>
      <button class="btn" onclick="buyItem('${item[0]}')">Купить</button>
    </div>`).join("");
}

function renderDistricts() {
  const element = document.getElementById("districts");
  if (!element) return;

  element.innerHTML = (state?.districts || []).map((district) => `
    <div class="card item">
      <div style="font-size:25px">${district.icon}</div>
      <div class="grow"><b>${esc(district.name)}</b><div class="muted">Ур. ${district.level} · ${district.cost} ⚡</div></div>
      <button class="btn" style="width:auto" onclick="travel('${escAttr(district.id)}')">${district.unlocked ? "Войти" : "Закрыто"}</button>
    </div>`).join("");
}

async function claim(action) {
  const result = await callApi("action", { type: action });
  if (result.ok) toast("Готово");
}

async function addStat(stat) {
  const result = await callApi("action", { type: "stat.add", stat });
  if (result.ok) openPanel("hero");
}

async function buyItem(item) {
  const result = await callApi("action", { type: "item.buy", item });
  if (result.ok) {
    toast("Куплено");
    renderShop();
  }
}

async function itemAction(id, action) {
  const result = await callApi("action", { type: "item." + action, id });
  if (result.ok) {
    toast("Готово");
    renderItems();
  }
}

async function travel(district) {
  const result = await callApi("action", { type: "district.travel", district });
  if (result.ok) {
    toast("Переход выполнен");
    renderDistricts();
  }
}

async function guildContribute() {
  const result = await callApi("action", { type: "guild.contribute", amount: 100 });
  if (result.ok) openPanel("guild");
}

async function questStart(quest) {
  const result = await callApi("action", { type: "quest.start", quest });
  if (result.ok) toast("Задание начато");
}

async function questProgress(quest) {
  const result = await callApi("action", { type: "quest.progress", quest });
  if (result.ok) toast("Прогресс сохранён");
}

async function questClaim(quest) {
  const result = await callApi("action", { type: "quest.claim", quest });
  if (result.ok) {
    toast("Награда получена");
    openPanel("quest");
  }
}

async function scout() {
  const result = await callApi("action", { type: "scout" });
  if (result.ok) toast(`Разведка: +${result.reward?.coins || 0} монет`);
}

function startBattle() {
  closePanel();
  document.getElementById("battle").classList.add("open");
  selectedAttack = null;
  selectedDefs = new Set();

  callApi("action", { type: "battle.start" }).then((result) => {
    if (!result.ok) {
      closeBattle();
      return;
    }

    battle = result.battle;
    renderBattle();
  });
}

function renderBattle() {
  if (!battle) return;

  const enemy = document.getElementById("enemyBox");
  enemy.innerHTML = `
    <b>${esc(battle.enemy.name)}</b>
    <div class="hp"><i style="width:${Math.max(0, battle.enemyHp / battle.enemy.hp * 100)}%"></i></div>
    <div>${battle.enemyHp} / ${battle.enemy.hp} HP</div>`;

  document.getElementById("attackZones").innerHTML = zones.map((zone, index) => `
    <button class="zone ${selectedAttack === index ? "sel" : ""}" onclick="selectAttack(${index})">${zone}</button>
  `).join("");

  document.getElementById("defenseZones").innerHTML = zones.map((zone, index) => `
    <button class="zone ${selectedDefs.has(index) ? "sel" : ""}" onclick="toggleDefense(${index})">${zone}</button>
  `).join("");
}

function selectAttack(index) {
  selectedAttack = index;
  renderBattle();
}

function toggleDefense(index) {
  if (selectedDefs.has(index)) {
    selectedDefs.delete(index);
  } else if (selectedDefs.size < 2) {
    selectedDefs.add(index);
  }
  renderBattle();
}

async function submitTurn() {
  if (selectedAttack === null) {
    toast("Выбери зону атаки");
    return;
  }

  if (selectedDefs.size !== 2) {
    toast("Нужно выбрать ровно 2 разные защиты");
    return;
  }

  // Exactly one numeric attack and exactly two unique numeric defense zones.
  const attack = Number(selectedAttack);
  const defs = [...selectedDefs].map(Number);

  const result = await callApi("action", {
    type: "battle.turn",
    attack,
    defs
  });

  if (!result.ok || !result.round) return;

  const round = result.round;

  document.getElementById("roundResult").innerHTML = `
    <b>Раунд ${round.turn}</b><br>
    Атака: ${zones[round.attack]}<br>
    Защита: ${round.defs.map((index) => zones[index]).join(", ")}<br>
    Враг атаковал: ${zones[round.enemyAttack]}<br>
    ${round.hit ? "Попадание" : "Атака заблокирована"} ·
    ${round.crit ? "КРИТ!" : ""}<br>
    ${round.blocked ? "Блок" : ""} ${round.dodge ? "Уклонение" : ""}<br>
    Урон игрока: ${round.playerDamage} · Урон врага: ${round.enemyDamage}
  `;

  selectedAttack = null;
  selectedDefs = new Set();

  if (result.result === "win") {
    const reward = await callApi("action", { type: "battle.reward" });
    toast(reward.ok ? "Победа!" : "Ошибка награды");
    setTimeout(closeBattle, 800);
    return;
  }

  if (result.result === "loss") {
    await callApi("action", { type: "battle.loss" });
    toast("Поражение");
    setTimeout(closeBattle, 800);
    return;
  }

  battle.enemyHp = round.enemyHp;
  renderBattle();
}

function closeBattle() {
  document.getElementById("battle").classList.remove("open");
  battle = null;
}

function connectChat() {
  if (socket && socket.readyState === WebSocket.OPEN) return;

  const protocol = location.protocol === "https:" ? "wss" : "ws";
  socket = new WebSocket(`${protocol}://${location.host}/ws`);

  socket.onmessage = (event) => {
    try {
      const message = JSON.parse(event.data);
      const log = document.getElementById("chatlog");
      if (!log) return;

      const row = document.createElement("div");
      row.className = "msg";

      const name = document.createElement("b");
      name.textContent = message.name || "Игрок";

      row.appendChild(name);
      row.appendChild(document.createTextNode(" " + (message.text || "")));
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    } catch {
      // Ignore malformed chat packets.
    }
  };

  socket.onclose = () => {
    socket = null;
  };
}

function sendChat() {
  const input = document.getElementById("chatinput");

  if (!input || !input.value.trim()) return;
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    toast("Чат подключается");
    return;
  }

  socket.send(JSON.stringify({
    type: "chat",
    name: state?.playerName || "Игрок",
    text: input.value.trim()
  }));

  input.value = "";
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function escAttr(value) {
  return String(value ?? "").replace(/[^a-zA-Z0-9_:@.-]/g, "");
}

window.addEventListener("visibilitychange", () => {
  if (!document.hidden && state) {
    loadState();
  }
});

loadState();
</script>
</body>
</html>
