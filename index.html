<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Territory Game — Reference Build</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <img id="scene" src="assets/gameplay-reference.jpg" alt="Оригинальный игровой экран">
  <button class="hz hz-roadmap" data-action="roadmap" aria-label="Дорожная карта"></button>
  <button class="hz hz-hero" data-action="hero" aria-label="Герой"></button>
  <button class="hz hz-companion" data-action="companion" aria-label="Последователь"></button>
  <button class="hz hz-port" data-action="port" aria-label="Порт"></button>
  <button class="hz hz-skills" data-action="skills" aria-label="Навыки"></button>
  <button class="hz hz-adventure" data-action="adventure" aria-label="Приключения"></button>
  <button class="hz hz-shop" data-action="shop" aria-label="Магазин"></button>
  <button class="hz hz-mainquest" data-action="quest" aria-label="Основная глава"></button>
</main>
<div id="panel" class="panel" aria-hidden="true">
  <div class="panel-card">
    <button id="close" class="close">×</button>
    <h2 id="panel-title"></h2>
    <p id="panel-text"></p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
