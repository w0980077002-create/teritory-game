<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Sdolars</title><style>
:root{--bg:#0a0e14;--card:rgba(22,27,34,.9);--gold:#e3b341;--blue:#58a6ff;--red:#f85149;--green:#238636;--purp:#bc8cff}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body,html{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f0f6fc}.game-container{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;background:url('assets/home-screen.png') center/cover;display:flex;flex-direction:column;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)) 12px}.screen{display:none;flex-direction:column;gap:10px;flex:1;overflow-y:auto;margin:10px 0}.screen.active{display:flex}.box{background:rgba(10,14,20,.9);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;backdrop-filter:blur(15px)}.top-bar{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.avatar{position:relative;width:44px;height:44px;background:linear-gradient(135deg,#e3b341,#8a6d25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #fff}.lvl{position:absolute;bottom:-4px;left:-4px;background:#0d1117;border:1px solid var(--gold);color:var(--gold);font-size:9px;font-weight:bold;padding:1px 4px;border-radius:6px}.res-grid{display:flex;gap:6px;justify-content:flex-end}.badge{background:rgba(0,0,0,.4);padding:5px 8px;border-radius:8px;font-size:11px;font-weight:bold;border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:4px}.sys-row{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.btn-sys{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer}.q-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}.q-card{background:linear-gradient(90deg,rgba(88,166,255,.15),transparent);background-color:rgba(10,14,20,.9);border-left:4px solid var(--blue);padding:10px;border-radius:0 12px 12px 0;cursor:pointer}.t-card{background:rgba(10,14,20,.9);border:1px solid rgba(255,255,255,.08);padding:10px;border-radius:12px;text-align:center}.split{display:grid;grid-template-columns:80px 1fr;gap:10px}.l-menu,.r-menu{display:flex;flex-direction:column;gap:8px}.g-card{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;position:relative}.s-card{background:rgba(10,14,20,.9);border:1px solid rgba(255,255,255,.08);padding:10px 4px;border-radius:10px;text-align:center;cursor:pointer;position:relative;font-size:11px;font-weight:bold}.dot{position:absolute;top:-2px;right:-2px;background:var(--red);width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #0d1117}.m-acts{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px}.b-act{padding:10px;border-radius:10px;border:none;font-weight:bold;font-size:12px;color:#fff;cursor:pointer}.b-bat{background:linear-gradient(135deg,var(--red),#901d1b)}.b-inv{background:linear-gradient(135deg,#bf7a1d,#734509)}.b-eq{background:linear-gradient(135deg,#6f42c1,#4c298a)}.b-qst{background:linear-gradient(135deg,#238636,#145220)}.chat{background:rgba(0,0,0,.5);border-radius:10px;padding:8px 12px;font-size:11px;border-left:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center}.nav{display:grid;grid-template-columns:repeat(6,1fr);background:rgba(10,14,20,.9);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:6px 2px}.n-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b949e;font-size:10px;cursor:pointer;text-decoration:none}.n-item.active{color:var(--gold);font-weight:bold}.hp-box{width:100%;height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin-top:4px}.hp-f{height:100%;background:var(--green);transition:width .3s}.hp-f.e{background:var(--red)}.z-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}.z-btn{background:#21262d;border:1px solid rgba(255,255,255,.08);padding:10px 2px;border-radius:8px;color:#fff;font-size:11px;font-weight:bold;cursor:pointer}.z-btn.selected{background:var(--blue);border-color:#fff}.z-btn.def-selected{background:var(--purp);border-color:#fff}.b-lock{background:var(--green);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%;cursor:pointer;font-size:14px}.c-log{background:rgba(0,0,0,.5);border-radius:10px;padding:10px;font-size:12px;min-height:60px;text-align:left;max-height:110px;overflow-y:auto;color:#c9d1d9}.i-row{background:var(--card);padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,.05)}.b-sm{background:var(--blue);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer}
