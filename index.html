<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061321"><title>Territory — Sdolars</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070d;color:#fff;font-family:Arial,system-ui,sans-serif}button{font:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#061321}
#scene{position:absolute;inset:0;background:#061321 center/cover no-repeat url("./assets/home-screen.png?v=s89final")}
#hit{position:absolute;inset:0;z-index:4}.hot{position:absolute;background:transparent;border:0;padding:0}
.hot:active{background:#ffd43b12}
.q{left:0;top:9%;width:48%;height:10%}.bonus{right:0;top:9%;width:42%;height:10%}.left1{left:0;top:20%;width:17%;height:7%}.left2{left:0;top:27%;width:17%;height:7%}.left3{left:0;top:34%;width:17%;height:7%}.forge{right:0;top:37%;width:41%;height:7%}.tavern{right:0;top:44%;width:41%;height:7%}.shop{right:0;top:51%;width:41%;height:7%}.battle{left:1%;bottom:15%;width:24%;height:9%}.inv{left:25%;bottom:15%;width:25%;height:9%}.gear{left:50%;bottom:15%;width:25%;height:9%}.quests{right:0;bottom:15%;width:25%;height:9%}.chat{left:0;right:0;bottom:8%;height:7%}.nav1{left:0;bottom:0;width:16.7%;height:8%}.nav2{left:16.7%;bottom:0;width:16.7%;height:8%}.nav3{left:33.4%;bottom:0;width:16.7%;height:8%}.nav4{left:50.1%;bottom:0;width:16.7%;height:8%}.nav5{left:66.8%;bottom:0;width:16.6%;height:8%}.nav6{right:0;bottom:0;width:16.6%;height:8%}
.overlay{display:none;position:absolute;inset:0;z-index:10;background:#02070df2;backdrop-filter:blur(7px);padding:12px;overflow:auto}.overlay.open{display:block}.box{max-width:720px;margin:auto}.head{display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#061321f5;padding-bottom:9px;z-index:2}.head h2{flex:1;margin:0}.close{background:#102c40;border:1px solid #43b8e9;color:white;border-radius:9px;padding:9px 12px}.card{background:linear-gradient(145deg,#0b293c,#07131e);border:1px solid #3d8daf;border-radius:12px;padding:11px;margin:8px 0}.muted{color:#9fc0d2;font-size:13px}.btn{display:block;width:100%;padding:11px;border-radius:10px;background:#0877aa;border:1px solid #43caff;color:#fff;font-weight:900;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.zone{padding:14px 8px;background:#0b2335;color:#fff;border:1px solid #347d9e;border-radius:10px;font-weight:900}.zone.sel{border-color:#ffd43b;background:#4a3a09}.enemy{background:#241118;border:1px solid #a54b59;border-radius:12px;padding:12px}.hp{height:11px;background:#12070a;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#ef4558}.label{margin:12px 0 6px;color:#8edcff;font-size:12px;font-weight:900}.log{height:50dvh;overflow:auto;background:#030c14;border:1px solid #22566f;border-radius:10px;padding:8px}.msg{padding:7px 0;border-bottom:1px solid #123044}.msg b{color:#7bd4ff}.row{display:flex;gap:7px;margin-top:7px}.row input{flex:1}.input{background:#06131e;border:1px solid #2c6d8a;border-radius:9px;color:white;padding:11px}.toast{position:fixed;z-index:50;left:50%;bottom:20px;transform:translateX(-50%);background:#071c2c;border:1px solid #43b8e9;border-radius:10px;padding:10px 14px;display:none}
</style></head><body><div id="app"><div id="scene"></div>
<div id="hit">
<button class="hot q" onclick="openPanel('quest')"></button><button class="hot bonus" onclick="claim('daily.claim')"></button>
<button class="hot left1" onclick="openPanel('bonus')"></button><button class="hot left2" onclick="openPanel('events')"></button><button class="hot left3" onclick="openPanel('vip')"></button>
<button class="hot forge" onclick="openPanel('forge')"></button><button class="hot tavern" onclick="openPanel('tavern')"></button><button class="hot shop" onclick="openPanel('shop')"></button>
<button class="hot battle" onclick="startBattle()"></button><button class="hot inv" onclick="openPanel('inventory')"></button><button class="hot gear" onclick="openPanel('hero')"></button><button class="hot quests" onclick="openPanel('quest')"></button><button class="hot chat" onclick="openPanel('chat')"></button>
<button class="hot nav1" onclick="closePanel()"></button><button class="hot nav2" onclick="openPanel('hero')"></button><button class="hot nav3" onclick="openPanel('inventory')"></button><button class="hot nav4" onclick="openPanel('quest')"></button><button class="hot nav5" onclick="openPanel('guild')"></button><button class="hot nav6" onclick="openPanel('more')"></button>
</div>
<section id="panel" class="overlay"><div class="box"><div class="head"><h2 id="pt">Territory</h2><button class="close" onclick="closePanel()">✕</button></div><div id="pb"></div></div></section>
<section id="battle" class="overlay"><div class="box"><button class="close" onclick="closeBattle()">← Назад</button><div id="enemy" class="enemy" style="margin-top:8px"></div><div class="label">АТАКА — 1 ЗОНА</div><div id="att" class="grid"></div><div class="label">ЗАЩИТА — РОВНО 2 РАЗНЫЕ ЗОНЫ</div><div id="defs" class="grid"></div><div id="round" class="card">Выбери атаку и две защиты.</div><button class="btn" onclick="turn()">Подтвердить ход</button></div></section>
<div id="toast" class="toast"></div></div>
<script>
const zones=['Голова','Грудь','Пояс','Ноги'];let state=null,battle=null,attack=null,defenses=new Set(),ws=null;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}
async function callApi(action,data={}){try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:action,...data})});const d=await r.json();if(d.state)state=d.state;if(!d.ok)toast(d.error||'Ошибка');return d}catch(e){toast('Нет соединения');return{ok:false}}}
async function load(){try{const r=await fetch('/api/state',{method:'POST'});const d=await r.json();state=d.state||d.player}catch(e){}}
function closePanel(){document.getElementById('panel').classList.remove('open')}
function openPanel(type){const p=document.getElementById('panel'),t=document.getElementById('pt'),b=document.getElementById('pb');p.classList.add('open');
 const views={
 quest:['Задания',`<div class="card"><b>Поговори с кузнецом</b><div class="muted">Награда: 150 монет + 80 XP</div><button class="btn" onclick="claim('quest.complete')">Выполнить</button></div>`],
 bonus:['Бонусы',`<div class="card"><b>🎁 Ежедневная награда</b><div class="muted">250 монет + 10 энергии + 20 XP</div><button class="btn" onclick="claim('daily.claim')">Забрать</button></div>`],
 events:['События',`<div class="card"><b>⚔️ Событие Sdolars</b><div class="muted">Стоимость: 3 энергии</div><button class="btn" onclick="claim('event.fight')">Участвовать</button></div>`],
 vip:['VIP',`<div class="card"><b>👑 VIP Territory</b><div class="muted">Раздел зарезервирован под серверные привилегии.</div></div>`],
 forge:['Кузница',`<div class="card"><b>🔨 Крафт оружия</b><div class="muted">Нужно: 2 железа, 2 дерева, 1 кожи.</div><button class="btn" onclick="claim('craft')">Ковать</button></div><div class="card"><b>Уровень кузницы: ${state?.forgeLevel||0}</b></div>`],
 tavern:['Таверна',`<div class="card"><b>🍺 Нанять героя</b><div class="muted">Стоимость: 300 монет</div><button class="btn" onclick="claim('tavern.recruit')">Нанять</button></div>`],
 shop:['Магазин',`<div id="shop"></div>`],
 inventory:['Инвентарь',`<div id="items"></div>`],
 hero:['Персонаж',`<div class="card"><b>${state?.playerName||'Игрок'}</b><div class="muted">Уровень ${state?.level||1} · XP ${state?.exp||0}/${state?.maxExp||100}</div><div class="muted">HP ${state?.hp||0}/${state?.maxHp||0} · Сила ${state?.strength||0} · Ловкость ${state?.agility||0}</div><div class="muted">Свободные очки: ${state?.freePoints||0}</div><div class="grid"><button class="btn" onclick="stat('strength')">Сила +</button><button class="btn" onclick="stat('agility')">Ловкость +</button></div></div>`],
 guild:['Гильдия',`<div class="card"><b>${state?.guildName||'Sdolars'}</b><div class="muted">Участники: ${state?.guildMembers||1} · Вклад: ${state?.guildContrib||0} · Рейтинг: ${state?.rating||1000}</div><button class="btn" onclick="guild()">Внести 100 монет</button></div>`],
 chat:['Чат игры',`<div id="chatlog" class="log"></div><div class="row"><input id="chatinput" class="input" maxlength="500" placeholder="Сообщение"><button class="btn" style="width:auto" onclick="sendChat()">➤</button></div>`],
 more:['Ещё',`<div class="grid"><button class="btn" onclick="claim('resource.gather')">🌲 Ресурсы</button><button class="btn" onclick="claim('rest')">❤️ Отдых</button><button class="btn" onclick="claim('achievement.claim')">🏆 Достижение</button><button class="btn" onclick="claim('season.claim')">🏅 Сезон</button></div><div class="card"><b>Материалы</b><div class="muted">Железо ${state?.materials?.iron||0} · Дерево ${state?.materials?.wood||0} · Кожа ${state?.materials?.leather||0} · Травы ${state?.materials?.herbs||0}</div></div>`]
 };
 const v=views[type]||views.more;t.textContent=v[0];b.innerHTML=v[1];
 if(type==='shop')renderShop();if(type==='inventory')renderItems();if(type==='chat')connectChat();
}
function renderShop(){const e=document.getElementById('shop');if(!e)return;e.innerHTML=[['knife','🔪','Нож',220],['heavyaxe','🪓','Тяжёлый топор',700],['steel','🛡️','Стальная броня',650],['bandage','🩹','Аптечка',80]].map(x=>`<div class="card"><b>${x[1]} ${x[2]}</b><div class="muted">${x[3]} монет</div><button class="btn" onclick="buy('${x[0]}')">Купить</button></div>`).join('')}
function renderItems(){const e=document.getElementById('items');if(!e)return;e.innerHTML=(state?.items||[]).map(i=>`<div class="card"><b>${i.icon} ${i.name}</b><div class="muted">${i.type} · ${i.equipped?'Экипировано':'В инвентаре'} · x${i.qty}</div><button class="btn" onclick="item('${i.id}','${i.equipped?'unequip':'equip'}')">${i.equipped?'Снять':'Надеть'}</button>${i.type==='Расходник'?`<button class="btn" onclick="item('${i.id}','use')">Использовать</button>`:''}</div>`).join('')||'<div class="card">Инвентарь пуст.</div>'}
async function claim(a,d={}){const x=await callApi(a,d);if(x.ok){toast('Готово');if(document.getElementById('panel').classList.contains('open'))openPanel(document.getElementById('pt').textContent==='Магазин'?'shop':'more')}}
async function buy(id){const x=await callApi('item.buy',{item:id});if(x.ok){toast('Куплено');renderShop()}}
async function item(id,a){const x=await callApi('item.'+a,{id});if(x.ok){renderItems();toast('Готово')}}
async function stat(s){const x=await callApi('stat.add',{stat:s});if(x.ok)openPanel('hero')}
async function guild(){const x=await callApi('guild.contribute',{amount:100});if(x.ok)openPanel('guild')}
function startBattle(){closePanel();document.getElementById('battle').classList.add('open');attack=null;defenses=new Set();callApi('battle.start').then(x=>{if(!x.ok){closeBattle();return}battle=x.battle;renderBattle()})}
function renderBattle(){const e=document.getElementById('enemy'),a=document.getElementById('att'),d=document.getElementById('defs');e.innerHTML=`<b>${battle.enemy.name}</b><div class="hp"><i style="width:${battle.enemyHp/battle.enemy.hp*100}%"></i></div><div>${battle.enemyHp} / ${battle.enemy.hp}</div>`;
a.innerHTML=zones.map((z,i)=>`<button class="zone ${attack===i?'sel':''}" onclick="pickA(${i})">${z}</button>`).join('');
d.innerHTML=zones.map((z,i)=>`<button class="zone ${defenses.has(i)?'sel':''}" onclick="pickD(${i})">${z}</button>`).join('')}
function pickA(i){attack=i;renderBattle()}function pickD(i){if(defenses.has(i))defenses.delete(i);else if(defenses.size<2)defenses.add(i);renderBattle()}
async function turn(){if(attack===null)return toast('Выбери атаку');if(defenses.size!==2)return toast('Нужно выбрать 2 разные защиты');const x=await callApi('battle.turn',{attack,defs:[...defenses]});if(!x.ok)return;const r=x.round;document.getElementById('round').innerHTML=`Атака: ${zones[r.attack]} · Защита: ${r.defs.map(i=>zones[i]).join(', ')}<br>Враг атаковал: ${zones[r.enemyAttack]} · ${r.blocked?'БЛОК':''}${r.dodge?' УКЛОНЕНИЕ':''}<br>Урон: ${r.playerDamage} · Ответный урон: ${r.enemyDamage}`;
if(x.result==='win'){const q=await callApi('battle.reward');toast(q.ok?'Победа!':'Ошибка награды');setTimeout(closeBattle,700)}else if(x.result==='loss'){await callApi('battle.loss');toast('Поражение');setTimeout(closeBattle,700)}else{battle.enemyHp=r.enemyHp;renderBattle()}attack=null;defenses=new Set()}
function closeBattle(){document.getElementById('battle').classList.remove('open')}
function connectChat(){if(ws&&ws.readyState===1)return;const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws`);ws.onmessage=e=>{try{const m=JSON.parse(e.data),log=document.getElementById('chatlog');if(!log)return;const row=document.createElement('div');row.className='msg';const b=document.createElement('b');b.textContent=m.name||'Игрок';row.append(b,document.createTextNode(' '+(m.text||'')));log.appendChild(row);log.scrollTop=log.scrollHeight}catch{}}}
function sendChat(){const i=document.getElementById('chatinput');if(!i||!i.value.trim()||!ws||ws.readyState!==1)return toast('Чат подключается');ws.send(JSON.stringify({type:'chat',name:state?.playerName||'Игрок',text:i.value.trim()}));i.value=''}
load();
</script></body></html>
