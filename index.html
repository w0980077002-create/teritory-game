<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111b">
<meta name="telegram-bot" content="@TeritoryGameBot">
<title>Teritory Game</title>
<style>
html,body,#app{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#07111b;color:#fff;font-family:Arial,sans-serif}
*{box-sizing:border-box}button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.screen{position:absolute!important;inset:0!important;display:none!important;overflow:hidden}.screen.active{display:block!important}
#home{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#07111b!important}
.home-reference-host{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#07111b!important}
.home-reference-image{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;object-fit:fill!important;object-position:center!important;margin:0!important;padding:0!important;border:0!important;z-index:1!important}
.home-hitzones,.home-bottom-zones{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:80!important;pointer-events:none!important}
.hz{position:absolute!important;display:block!important;padding:0!important;margin:0!important;border:0!important;background:transparent!important;box-shadow:none!important;outline:none!important;opacity:0!important;pointer-events:auto!important;touch-action:manipulation!important;appearance:none!important}
#homeRealHud{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;z-index:70!important;pointer-events:none!important}
#homeRealHud .hud-clean{position:absolute!important;display:flex!important;align-items:center!important;justify-content:center!important;background:transparent!important;border:0!important;overflow:hidden!important;white-space:nowrap!important;color:#fff!important;font-weight:900!important;line-height:1!important;text-shadow:0 1px 2px #000,0 0 4px #000!important;pointer-events:none!important}
</style>
<link rel="stylesheet" href="./style.css?v=9300">
<link rel="stylesheet" href="./home-rebuild.css?v=9300">
<link rel="stylesheet" href="./arena.css?v=9300">
<link rel="stylesheet" href="./follower-arena.css?v=9300">
<link rel="stylesheet" href="./forge-v2.css?v=9300">
<link rel="stylesheet" href="./hero.css?v=9300">
<link rel="stylesheet" href="./reference-ui.css?v=9300">
</head>
<body>
<main id="app">
<section id="home" class="screen active" aria-label="Главный экран"></section>
<section id="inventory" class="screen panel-screen"><header class="screen-head"><button data-screen="home" class="back" type="button">‹</button><div><small>ГЕРОЙ</small><h2>ИНВЕНТАРЬ</h2></div></header><div class="profile-card"><div class="profile-avatar" data-profile-photo>⚔️</div><div><b data-profile-name>Игрок</b><span>Уровень <strong data-level>1</strong></span><small data-username>@</small></div></div><div class="panel-title">ПРЕДМЕТЫ</div><div id="inventoryGrid" class="inventory-grid"></div></section>
<section id="hero" class="screen panel-screen" aria-label="Персонаж"></section>
<section id="districts" class="screen panel-screen"><header class="screen-head"><button data-screen="home" class="back" type="button">‹</button><div><small>ГОРОД</small><h2>РАЙОНЫ</h2></div></header><div class="district-grid"><button class="district-card" type="button"><b>🏰 Центральный квартал</b><span>События и городские награды</span></button><button class="district-card" type="button"><b>⚓ Порт</b><span>Морские задания и торговля</span></button><button class="district-card" type="button"><b>🛡️ Северные стены</b><span>Испытания и сражения</span></button></div></section>
<section id="market" class="screen panel-screen"><header class="screen-head"><button data-screen="home" class="back" type="button">‹</button><div><small>ТОРГОВЛЯ</small><h2>ЛАВКА</h2></div><div class="wallet">🪙 <b data-coins>0</b></div></header><div class="merchant"><div>🧔‍♂️</div><b>ТОРГОВЕЦ<small>Эликсиры и оружие</small></b></div><div class="panel-title">ТОВАРЫ ЛАВКИ</div><div id="shopGrid" class="shop-grid"></div><div id="merchantLog" class="log">Торговец ждёт сделки.</div></section>
<section id="casino" class="screen panel-screen"><header class="screen-head"><button data-screen="home" class="back" type="button">‹</button><div><small>СОБЫТИЕ</small><h2>ИГРЫ</h2></div><div class="wallet">🎲 <b data-dice>0</b></div></header><div class="casino-card"><div class="casino-title">МОНОПОЛИЯ</div><div id="casinoBoard" class="casino-board"></div><div data-roll-result class="roll-result">Готов к броску</div><button data-roll class="primary" type="button">БРОСИТЬ КУБИК</button></div></section>
<div id="arenaModal" class="arena-modal" aria-hidden="true"><div class="arena-sheet"><div class="arena-modal-head"><h2>⚔️ АРЕНА</h2><button id="arenaClose" class="arena-close" type="button">Закрыть</button></div><div id="arenaModalBody"></div></div></div>
</main>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>

<script src="./follower-arena.js?v=9300"></script>
<script src="./hero.js?v=9300"></script>
<script src="./home-rebuild.js?v=9300"></script>
<script src="./reference-ui.js?v=9300"></script>
</body>
</html>
