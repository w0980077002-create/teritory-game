#hud{position:absolute;z-index:10;top:0;left:0;right:0;height:112px;padding:8px 14px;background:rgba(3,20,32,.82);border-bottom:2px solid #1596d4;display:flex;gap:9px}
.avatar{width:70px;height:70px;border:3px solid #58caff;border-radius:15px;background:#3a261e;display:grid;place-items:center;font-size:40px;position:relative;flex:none}
.avatar b{position:absolute;left:-4px;bottom:-6px;border:2px solid #58caff;background:#08263c;border-radius:9px;padding:2px 7px;font-size:14px}
.hudmain{flex:1;min-width:0}
.name{font-size:22px;font-weight:900;line-height:1}
.level{color:#64caff;font-size:14px;margin-top:4px}
.xp{height:9px;border:2px solid #176da3;border-radius:9px;overflow:hidden;margin:8px 0 7px}
.xp i{display:block;height:100%;width:64%;background:#18bce9}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res div{height:32px;border:2px solid #176da3;border-radius:10px;background:rgba(5,37,57,.62);display:grid;place-items:center;font-weight:900;font-size:14px}

#quest{position:absolute;z-index:9;left:18px;top:120px;width:170px;height:70px;padding:7px 10px;border:2px solid rgba(24,141,204,.9);border-radius:14px;background:rgba(4,25,40,.48);text-shadow:0 2px 3px #000;overflow:hidden}

#quest small{display:block;color:#c4d2da;font-size:9px;margin-top:4px;white-space:nowrap}

.bottomBtn:first-child{color:#ffd83d}

#toast{position:absolute;z-index:30;left:50%;bottom:205px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:rgba(2,17,28,.92);border:1px solid #36b8ed;border-radius:10px;padding:9px 14px;font-weight:800;transition:.2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:absolute;z-index:50;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{width:100%;max-height:75%;overflow:auto;background:#061a2a;border:2px solid #1596d4;border-bottom:0;border-radius:20px 20px 0 0;padding:14px}
.sheet h2{margin:0 0 10px;color:#ffd83d}
.close{float:right;background:#16415b;border-radius:9px;padding:7px 11px}
.item{border:1px solid #176da3;border-radius:11px;padding:10px;margin:7px 0;background:#092b42}

@media(max-width:430px){
 #hud{height:112px;padding:7px 10px}
 .avatar{width:66px;height:66px}
 .name{font-size:20px}
 #quest{left:18px;top:120px;width:170px;height:70px}
 #places{right:10px;top:245px;width:136px;gap:5px}
 .place{height:42px;font-size:12px;padding:4px 7px}
 #arena{bottom:145px;width:115px;height:58px}
 #chat{left:15px;right:15px;bottom:80px;height:50px}
 #bottom{height:80px}
}
@media(max-width:360px){
 #places{width:128px}
 #quest{width:160px}
 .bottomBtn{font-size:9px}
 .bottomBtn span{font-size:21px}
}
</style>
</head>
<body>
<div id="game">
  <div id="bg"></div><div id="shade"></div>

  <header id="hud">
    <div class="avatar">🧔<b>3</b></div>
    <div class="hudmain">
      <div class="name">Воин</div>
      <div class="level">Уровень 3</div>
      <div class="xp"><i></i></div>
      <div class="res"><div>🟡 79</div><div>◆ 1330</div><div>⚡ 200</div></div>
    </div>
  </header>

  <section id="quest">
    <strong>Патруль Sdolars</strong>
    <div>Победи 3 противников</div>
    <small>Награда: 180 🟡 + 45 XP</small>
  </section>

  <div id="places">
    <button class="place" onclick="show('Замок Sdolars')"><span>🏰</span>Замок</button>
    <button class="place" onclick="show('Районы Sdolars')"><span>🗺️</span>Районы</button>
    <button class="place" onclick="show('Таверна')"><span>🍺</span>Таверна</button>
    <button class="place" onclick="openSheet('Рынок')"><span>⚖️</span>Рынок</button>
    <button class="place" onclick="openSheet('Game')"><span>🎲</span>Game</button>
  </div>

  <button id="arena" onclick="openBattle()"><span>⚔️</span><b>Арена</b></button>

  <div id="chat"><div>💬 Городской чат <small>12 онлайн</small></div><button onclick="show('Чат открыт')">Открыть</button></div>

  <nav id="bottom">
    <button class="bottomBtn" onclick="show('Город')"><span>🏠</span>Город</button>
    <button class="bottomBtn" onclick="openSheet('Профиль')"><span>👤</span>Профиль</button>
    <button class="bottomBtn" onclick="openSheet('Инвентарь')"><span>🧰</span>Инвентарь</button>
    <button class="bottomBtn" onclick="openSheet('Квесты')"><span>📜</span>Квесты</button>
    <button class="bottomBtn" onclick="openSheet('Гильдия')"><span>🛡️</span>Гильдия</button>
    <button class="bottomBtn" onclick="openSheet('Настройки')"><span>⚙️</span>Настройки</button>
  </nav>

  <div id="toast"></div>
  <div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeSheet()">Закрыть</button><h2 id="sheetTitle"></h2><div id="sheetBody"></div></div></div>
</div>

<script>
const toast=document.getElementById('toast');
function show(t){
 toast.textContent=t;toast.classList.add('show');
 clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),1400);
}
function openSheet(title){
 document.getElementById('sheetTitle').textContent=title;
 document.getElementById('sheetBody').innerHTML='<div class="item">Раздел «'+title+'» готов к развитию.</div><div class="item">Здесь будет полноценная игровая механика.</div>';
 document.getElementById('modal').classList.add('show');
}
function closeSheet(){document.getElementById('modal').classList.remove('show')}
function openBattle(){
 document.getElementById('sheetTitle').textContent='Арена';
 document.getElementById('sheetBody').innerHTML='<div class="item"><b>Тактический бой</b><br>Выбери зону атаки и две зоны защиты.</div><div class="item">Голова · Грудь · Живот · Пояс · Ноги</div>';
 document.getElementById('modal').classList.add('show');
}
</script>
</body>
</html>
