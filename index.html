<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Territory — Sdolars</title>
<style>
:root{--b:#19b7f0;--bg:rgba(3,20,31,.58);--gold:#ffd52f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06131e;color:#fff;font-family:Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none}
#game{position:fixed;inset:0;overflow:hidden;background:#06131e}
#bg{position:absolute;inset:0;background:url("https://raw.githubusercontent.com/w0980077002-create/teritory-game/main/sdolars_city_sharp.jpg") center/cover no-repeat}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,10,18,.55),rgba(2,10,18,.08) 42%,rgba(2,10,18,.28) 75%,rgba(2,10,18,.72))}
#hud{position:absolute;z-index:4;top:0;left:0;right:0;height:174px;padding:10px 16px;background:rgba(2,12,22,.66);border-bottom:2px solid #117ba5}
.hero{display:flex;gap:12px;align-items:center}
.avatar{width:98px;height:98px;flex:none;border:3px solid #38bdf4;border-radius:20px;background:#43291f;display:grid;place-items:center;font-size:54px;position:relative}
.lvl{position:absolute;left:-3px;bottom:-10px;width:46px;height:38px;border:3px solid #38bdf4;border-radius:15px;background:#082232;display:grid;place-items:center;font-size:21px;font-weight:800}
.heroInfo{flex:1;min-width:0}.name{font-size:29px;font-weight:900}.level{font-size:18px;color:#55c7ff;margin-top:2px}
.xp{height:11px;border:2px solid #1688b7;border-radius:9px;overflow:hidden;margin-top:7px;background:rgba(0,0,0,.35)}.xp i{display:block;width:67%;height:100%;background:#20bce9}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.res b{height:45px;border:2px solid #137eaa;border-radius:14px;background:rgba(4,29,44,.64);display:flex;align-items:center;justify-content:center;gap:6px;font-size:18px}
.gold{color:#ffd52f}.energy{color:#ffd83e}
#quest{position:absolute;z-index:3;left:34px;top:190px;width:265px;padding:10px 14px;border:2px solid #1598cf;border-radius:18px;background:rgba(3,23,35,.57)}
.qtitle{color:var(--gold);font-weight:900;font-size:18px}.qtext{font-size:16px;margin-top:4px}.qreward{font-size:13px;color:#b8cbd4;margin-top:4px}
#menu{position:absolute;z-index:3;right:20px;top:53%;transform:translateY(-50%);width:194px;display:grid;gap:7px}
.city{height:54px;border:2px solid #19aee7;border-radius:17px;background:rgba(3,23,35,.48);display:flex;align-items:center;gap:9px;padding:0 11px;font-size:18px;font-weight:800}.city span{font-size:25px}
#arena{position:absolute;z-index:3;left:50%;bottom:153px;transform:translateX(-50%);width:205px;height:84px;border:3px solid #19b3ef;border-radius:28px;background:rgba(3,23,35,.62);display:flex;align-items:center;justify-content:center;gap:12px;font-size:23px;font-weight:900}#arena span{font-size:39px}
#chat{position:absolute;z-index:3;left:30px;right:30px;bottom:92px;height:67px;border:2px solid #167ca7;background:rgba(3,18,29,.66);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 18px;font-size:19px}.open{height:46px;background:#f1f1f1;color:#26323a;padding:0 21px}
#bottom{position:absolute;z-index:4;bottom:0;left:0;right:0;height:92px;background:rgba(2,13,23,.83);border-top:2px solid #126d91;display:grid;grid-template-columns:repeat(6,1fr)}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#adbdc6;font-size:12px;font-weight:800}.nav i{font-style:normal;font-size:27px}.nav.active{color:#ffd52f}
#modal{position:absolute;z-index:20;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:14px}
.card{width:min(650px,94vw);max-height:94vh;overflow:auto;border:3px solid #18a9e8;border-radius:28px;background:rgba(3,24,36,.97);padding:15px;box-shadow:0 15px 50px rgba(0,0,0,.65)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.title{font-size:29px;color:var(--gold);font-weight:900}.close{background:#174964;border-radius:13px;padding:11px 18px;font-size:18px}
.fighters{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fighter{border:2px solid #147da8;border-radius:17px;padding:8px;text-align:center;background:rgba(2,17,27,.7)}.fighter b{font-size:17px}.art{height:120px;display:grid;place-items:center;font-size:65px}.hp{height:15px;border:2px solid #147da8;border-radius:9px;overflow:hidden;background:#111}.hp i{display:block;height:100%;background:#ef4d46}.turn{text-align:center;color:#aac4d1;margin:9px 0;font-size:17px}.st{color:var(--gold);font-size:20px;font-weight:900;margin:9px 0 6px}.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.zone{min-height:53px;border:2px solid #176e94;border-radius:13px;background:#082333;font-size:13px;font-weight:800}.zone.a{background:#087fb7;border-color:#34c6ff}.zone.d{background:#8b2925;border-color:#ff5a50}.hit{width:100%;height:58px;margin-top:12px;border:3px solid #ff665c;border-radius:17px;background:linear-gradient(#e8453d,#a52320);font-size:22px;font-weight:900}.hit:disabled{filter:grayscale(1);opacity:.5}.hint{margin-top:9px;border:2px solid #176e94;border-radius:13px;padding:11px;color:#b8cbd5;font-size:14px}
#panel{position:absolute;z-index:15;inset:0;display:none;background:rgba(3,16,25,.94);padding:22px;overflow:auto}.back{padding:9px 17px;border:2px solid var(--b);border-radius:12px;background:#09283a}.panelTitle{color:var(--gold)}.box{border:2px solid #147da8;border-radius:15px;padding:14px;background:rgba(4,25,38,.7);margin-top:9px}
@media(max-width:520px){#quest{left:20px;transform:scale(.82);transform-origin:top left}#menu{right:18px;width:190px}.city{height:52px;font-size:17px}#arena{width:200px;height:82px}.card{padding:13px}.title{font-size:27px}.art{height:110px;font-size:60px}.zone{min-height:51px;font-size:12px}#chat{left:20px;right:20px;font-size:17px}}
</style>
</head>
<body>
<div id="game">
<div id="bg"></div><div id="shade"></div>
<header id="hud"><div class="hero"><div class="avatar">🧔<div class="lvl">3</div></div><div class="heroInfo"><div class="name">Воин</div><div class="level">Уровень 3</div><div class="xp"><i></i></div><div class="res"><b class="gold">🟡 79</b><b>◆ 1330</b><b class="energy">⚡ 200</b></div></div></div></header>
<section id="quest"><div class="qtitle">Патруль Sdolars</div><div class="qtext">Победи 3 противников</div><div class="qreward">Награда: 180 🟡 + 45 XP</div></section>
<nav id="menu"><button class="city">🏰 Замок</button><button class="city">🗺️ Районы</button><button class="city">🍺 Таверна</button><button class="city">⚖️ Рынок</button><button class="city">🎲 Game</button></nav>
<button id="arena"><span>⚔️</span>Арена</button>
<div id="chat"><span>💬 Городской чат <small style="color:#83b5ca">12 онлайн</small></span><button class="open">Открыть</button></div>
<nav id="bottom"><button class="nav active">🏠<i>Город</i></button><button class="nav">👤<i>Профиль</i></button><button class="nav">🧰<i>Инвентарь</i></button><button class="nav">📜<i>Квесты</i></button><button class="nav">🛡️<i>Гильдия</i></button><button class="nav">⚙️<i>Настройки</i></button></nav>

<div id="modal"><div class="card"><div class="top"><div class="title">⚔️ Арена · бой</div><button class="close" id="close">Закрыть</button></div>
<div class="fighters"><div class="fighter"><b>🧔 Воин · ур. 3</b><div class="art">🧔‍♂️🪓</div><div class="hp"><i id="ph" style="width:100%"></i></div><small id="pt">120 / 120</small></div><div class="fighter"><b>💀 Наёмник Sdolars</b><div class="art">💀🛡️</div><div class="hp"><i id="eh" style="width:100%"></i></div><small id="et">90 / 90</small></div></div>
<div class="turn" id="turn">Ход воина</div><div class="st">1. Куда атаковать?</div><div class="zones" id="att"></div><div class="st">2. Какие две зоны защищать?</div><div class="zones" id="def"></div><button class="hit" id="hit" disabled>⚔️ Нанести удар</button><div class="hint" id="hint">Выберите одну зону атаки и две зоны защиты.</div></div></div>
<div id="panel"><button class="back" id="back">← Назад</button><h2 class="panelTitle" id="ptitle"></h2><div id="pcontent"></div></div>
</div>
<script>
const zones=['Голова','Грудь','Живот','Пояс','Ноги'];let attack=null,defense=[],ph=120,eh=90;
const $=s=>document.querySelector(s);
function zonesRender(){ $('#att').innerHTML=zones.map((x,i)=>`<button class="zone ${attack===i?'a':''}" data-a="${i}">${x}</button>`).join('');$('#def').innerHTML=zones.map((x,i)=>`<button class="zone ${defense.includes(i)?'d':''}" data-d="${i}">${x}</button>`).join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{attack=+b.dataset.a;zonesRender();ready()});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let i=+b.dataset.d;if(defense.includes(i))defense=defense.filter(x=>x!==i);else if(defense.length<2)defense.push(i);zonesRender();ready()})}
function ready(){$('#hit').disabled=attack===null||defense.length!==2}
function hp(){ $('#ph').style.width=ph/120*100+'%';$('#eh').style.width=eh/90*100+'%';$('#pt').textContent=ph+' / 120';$('#et').textContent=eh+' / 90'}
$('#arena').onclick=()=>{$('#modal').style.display='flex';attack=null;defense=[];ph=120;eh=90;hp();zonesRender();ready();$('#turn').textContent='Ход воина';$('#hint').textContent='Выберите одну зону атаки и две зоны защиты.'};
$('#close').onclick=()=>$('#modal').style.display='none';
$('#hit').onclick=()=>{let block=Math.floor(Math.random()*5),dmg=block===attack?6:22;eh=Math.max(0,eh-dmg);if(eh===0){$('#turn').textContent='Победа!';$('#hint').textContent='Противник повержен. Патруль продолжается.';$('#hit').disabled=true}else{let ea=Math.floor(Math.random()*5),taken=defense.includes(ea)?4:13;ph=Math.max(0,ph-taken);$('#hint').textContent=`Твой удар: -${dmg}. Ответ противника: -${taken}.`;if(ph===0){$('#turn').textContent='Поражение';$('#hit').disabled=true}}hp()};
function panel(t,c){$('#panel').style.display='block';$('#ptitle').textContent=t;$('#pcontent').innerHTML=c}
document.querySelectorAll('#bottom .nav').forEach((b,i)=>b.onclick=()=>{if(i===0){$('#panel').style.display='none';return}let x=[['👤 Профиль','Воин · уровень 3<br>Сила: 5 · Ловкость: 5'],['🧰 Инвентарь','🪓 Кулаки<br>🛡️ Броня отсутствует'],['📜 Квесты','Патруль Sdolars — 0 / 3 побед'],['🛡️ Гильдия','Гильдия Sdolars'],['⚙️ Настройки','RU / EN · Звук · Вибрация']][i-1];panel(x[0],`<div class="box">${x[1]}</div>`)});
$('#back').onclick=()=>$('#panel').style.display='none';zonesRender();hp();
</script>
</body></html>
