<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Territory — Sdolars</title>
<meta name="territory-build" content="s6-github-only">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#020a12;color:#fff;font-family:Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit;border:0}
#app{height:100dvh;max-width:760px;margin:auto;background:#061522;display:flex;flex-direction:column}
header{height:112px;flex:0 0 112px;padding:7px;border-bottom:2px solid #168fd0;background:linear-gradient(#061d30,#04111d);display:flex;gap:8px}
.avatar{width:70px;height:70px;border:2px solid #68cfff;border-radius:14px;background:radial-gradient(circle at 50% 35%,#506b7c,#162a38 48%,#071019 50%);display:grid;place-items:center;font-size:44px;position:relative}
.avatar b{position:absolute;bottom:-3px;left:-3px;background:#092844;border:2px solid #68cfff;border-radius:8px;padding:1px 6px;font-size:12px}
.hud{flex:1;min-width:0}.name{font-size:18px;font-weight:900}.level{color:#67cbff;font-size:12px}
.xp{height:8px;background:#071827;border:1px solid #1c75a9;border-radius:8px;overflow:hidden;margin:5px 0}.xp i{display:block;height:100%;background:#14bde8;width:40%}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.res div{height:30px;background:#09253a;border:2px solid #176da3;border-radius:8px;text-align:center;padding-top:5px;font-size:12px;font-weight:900}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px}.tools button{height:29px;border:2px solid #176da3;border-radius:8px;background:#09253a}
#scene{position:relative;flex:1;min-height:0;overflow:hidden;background:#071826}
#three{position:absolute;inset:0;background:linear-gradient(#17628f,#29495b 48%,#07131e)}#cityCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;pointer-events:none}
.card{pointer-events:auto;background:rgba(5,27,43,.92);border:2px solid #1689ca;border-radius:16px;box-shadow:0 8px 25px #0009}
.quest{position:absolute;left:10px;top:10px;width:250px;padding:10px}.quest strong{color:#ffd43d}.quest small{display:block;color:#9db7c7;margin-top:4px}
.quick{position:absolute;right:10px;top:10px;display:grid;gap:6px}.quick button{pointer-events:auto;width:130px;height:48px;border:2px solid #1689ca;border-radius:12px;background:#092c46;font-weight:900}
.nav{position:absolute;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{pointer-events:auto;height:64px;border:2px solid #1689ca;border-radius:14px;background:#092f4b;font-weight:900}.nav span{display:block;font-size:22px}
.chat{position:absolute;left:10px;right:10px;bottom:80px;height:42px;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;background:#061725aa;border-top:1px solid #19506d}.chat small{color:#9eb9c9}
footer{height:58px;flex:0 0 58px;background:#061827;border-top:1px solid #16435c;display:grid;grid-template-columns:repeat(6,1fr)}
footer button{background:#071d2d;color:#91acbb;font-size:11px;font-weight:900} footer button.active{color:#ffd93d;border-bottom:4px solid #ffd93d} footer span{display:block;font-size:18px;margin-bottom:2px}
.modal{position:fixed;z-index:20;inset:0;background:#000b;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92dvh;overflow:auto;background:#061827;border:2px solid #1689ca;border-bottom:0;border-radius:22px 22px 0 0;padding:14px}.sheet h2{margin:0 0 10px;color:#ffd83b}.close{float:right;background:#173a50;border-radius:9px;padding:7px 11px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{background:#092940;border:2px solid #176da3;border-radius:14px;padding:10px}.item h3{margin:0 0 5px}.item p{margin:4px 0;color:#a6bdca;font-size:12px}.item button,.primary{width:100%;margin-top:7px;padding:10px;border-radius:10px;background:#117fc2;font-weight:900}.danger{background:#8d2940!important}
.enemy{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:10px;border:2px solid #b63751;border-radius:15px;background:#0a2639}.enemy .art{font-size:52px;text-align:center}.hp{height:12px;background:#1b2730;border-radius:8px;overflow:hidden;border:1px solid #697a83}.hp i{display:block;height:100%;background:#ed3554;width:100%;transition:.3s}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.zone{padding:9px 2px;background:#09283f;border:2px solid #176da3;border-radius:9px;font-size:11px;font-weight:900}.zone.selected{background:#146fa9;border-color:#6fd8ff}.zone.def.selected{background:#7c263d;border-color:#ff7795}
.log{min-height:65px;max-height:120px;overflow:auto;background:#03101a;border-radius:10px;padding:8px;font-size:12px;color:#c8dbe4;margin-top:8px}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid #16435c;padding:8px 0}.toast{position:fixed;z-index:50;left:50%;bottom:70px;transform:translate(-50%,20px);opacity:0;background:#092c45;border:2px solid #2bb8ff;border-radius:12px;padding:10px 15px;font-weight:900;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes hit{50%{transform:scale(1.15);filter:brightness(2)}}
.shake{animation:hit .3s}
@media(max-width:430px){header{height:104px;flex-basis:104px}.avatar{width:62px;height:62px;font-size:38px}.quest{width:205px}.quick button{width:108px}.nav button{height:59px;font-size:11px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="avatar">🧔<b id="lvl">3</b></div>
  <div class="hud">
    <div class="name" id="name">Воин</div><div class="level" data-i18n="level">Уровень 3</div>
    <div class="xp"><i id="xpbar"></i></div>
    <div class="res"><div>🟡 <span id="coins">1779</span></div><div>◆ <span id="gems">1330</span></div><div>ϟ <span id="energy">191</span></div></div>
    <div class="tools"><button onclick="openModal('profile')">👤</button><button onclick="openModal('inventory')">🎒</button><button onclick="openModal('quests')">📜</button><button onclick="toggleLang()">RU/EN</button></div>
  </div>
</header>
<main id="scene">
  <div id="three"></div>
  <div class="overlay">
    <div class="card quest"><strong id="questTitle">Патруль Sdolars</strong><div id="questText">Победи 3 противников</div><small>Награда: 180 🟡 + 45 XP</small></div>
    <div class="quick"><button onclick="startBattle()">⚔️ Арена</button><button onclick="openModal('districts')">🏙️ Районы</button></div>
    <div class="chat"><div>💬 <span data-i18n="chat">Городской чат</span><small> 12 онлайн</small></div><button onclick="toast('Чат готовится к подключению')">Открыть</button></div>
    <div class="nav">
      <button onclick="startBattle()"><span>⚔️</span>Арена</button>
      <button onclick="openModal('market')"><span>🛒</span>Рынок</button>
      <button onclick="openModal('districts')"><span>🏙️</span>Районы</button>
      <button onclick="openModal('casino')"><span>🎰</span>Казино</button>
    </div>
  </div>
</main>
<footer>
  <button class="active" onclick="toast('Главная')"><span>🏠</span>Город</button>
  <button onclick="openModal('profile')"><span>👤</span>Профиль</button>
  <button onclick="openModal('inventory')"><span>🎒</span>Инвентарь</button>
  <button onclick="openModal('quests')"><span>📜</span>Квесты</button>
  <button onclick="openModal('guild')"><span>🛡️</span>Гильдия</button>
  <button onclick="openModal('settings')"><span>⚙️</span>Настройки</button>
</footer>
</div>

<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const Z=['Голова','Грудь','Живот','Пояс','Ноги'];
const state=JSON.parse(localStorage.getItem('territory_save_v2')||'null')||{
 name:tg?.initDataUnsafe?.user?.first_name||'Воин',level:3,exp:120,maxExp:150,coins:1779,gems:1330,energy:191,
 hp:120,maxHp:120,strength:12,agility:9,wins:0,losses:0,freePoints:0,lang:'RU',
 items:[{id:'fists',name:'Кулаки',icon:'👊',damage:5,equipped:true},{id:'blade',name:'Стальной клинок',icon:'⚔️',damage:16,equipped:false},{id:'armor',name:'Бронежилет',icon:'🥋',defense:8,equipped:true}],
 district:'square',completedQuests:0
};
function save(){localStorage.setItem('territory_save_v2',JSON.stringify(state));renderHud()}
function renderHud(){name.textContent=state.name;lvl.textContent=state.level;coins.textContent=Math.floor(state.coins);gems.textContent=Math.floor(state.gems);energy.textContent=Math.floor(state.energy);document.querySelector('.level').textContent=(state.lang==='EN'?'Level ':'Уровень ')+state.level;const lv=document.getElementById('level');if(lv)lv.textContent=state.level;const xt=document.getElementById('xpText');if(xt)xt.textContent=Math.floor(state.exp)+'/'+Math.floor(state.maxExp);xpbar.style.width=Math.min(100,state.exp/state.maxExp*100)+'%'}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('show'),1800)}
function openModal(type){const c=document.getElementById('modalContent');let h='';
if(type==='profile')h=`<h2>👤 ${state.lang==='EN'?'Character':'Персонаж'}</h2><div class=stat><b>Уровень</b><b>${state.level}</b></div><div class=stat><b>Сила</b><b>${state.strength}</b></div><div class=stat><b>Ловкость</b><b>${state.agility}</b></div><div class=stat><b>Победы</b><b>${state.wins}</b></div><div class=stat><b>Поражения</b><b>${state.losses}</b></div><button class=primary onclick="addStat('strength')">+ Сила</button><button class=primary onclick="addStat('agility')">+ Ловкость</button>`;
if(type==='inventory')h=`<h2>🎒 Инвентарь</h2><div class=grid>${state.items.map((x,i)=>`<div class=item><h3>${x.icon} ${x.name}</h3><p>${x.damage?'Урон: '+x.damage:''} ${x.defense?'Защита: '+x.defense:''}</p><p>${x.equipped?'🟢 Экипировано':'Не экипировано'}</p><button onclick="equip(${i})">${x.equipped?'Снять':'Экипировать'}</button>${x.id!=='fists'?`<button class=danger onclick="dropItem(${i})">Выбросить</button>`:''}</div>`).join('')}</div>`;
if(type==='market')h=`<h2>🛒 Рынок снаряжения</h2><div class=grid><div class=item><h3>⚔️ Тяжёлый клинок</h3><p>Урон +25</p><b>600 🟡</b><button onclick="buy('heavy',600,25)">Купить</button></div><div class=item><h3>🛡️ Тактическая броня</h3><p>Защита +15</p><b>750 🟡</b><button onclick="buy('armor2',750,15)">Купить</button></div><div class=item><h3>⚡ Энергетик</h3><p>+30 энергии</p><b>100 🟡</b><button onclick="energyBuy()">Купить</button></div></div>`;
if(type==='districts')h=`<h2>🏙️ Sdolars</h2><div class=grid>${[['square','Центральная площадь',1],['forest','Северный лес',3],['harbor','Порт',8],['industrial','Промзона',12],['fortress','Старая крепость',18]].map(x=>`<div class=item><h3>${x[0]==='square'?'🏰':x[0]==='forest'?'🌲':x[0]==='harbor'?'⚓':x[0]==='industrial'?'🏭':'🏛️'} ${x[1]}</h3><p>Требуется уровень ${x[2]}</p><button onclick="travel('${x[0]}',${x[2]})">Перейти</button></div>`).join('')}</div>`;
if(type==='quests')h=`<h2>📜 Квесты</h2><div class=item><h3>Патруль Sdolars</h3><p>Победы: ${state.completedQuests}/3</p><p>Награда: 180 🟡 + 45 XP</p><button onclick="startBattle()">Выполнить</button></div><div class=item><h3>Ежедневная серия</h3><p>Получай награды за ежедневный вход.</p><button onclick="daily()">Забрать награду</button></div>`;
if(type==='casino')h=`<h2>🎰 Казино Sdolars</h2><p>Ставка 100 🟡. Три одинаковых символа дают x5.</p><div style="font-size:55px;text-align:center;margin:20px" id=slots>❔ ❔ ❔</div><button class=primary onclick="spin()">Крутить — 100 🟡</button>`;
if(type==='guild')h=`<h2>🛡️ Гильдия</h2><div class=item><h3>Вольные бойцы Sdolars</h3><p>Участники: 7</p><p>Рейтинг: 1240</p><button onclick="toast('Заявка отправлена')">Вступить</button></div>`;
if(type==='settings')h=`<h2>⚙️ Настройки</h2><button class=primary onclick="toggleLang()">Русский / English</button><button class=primary onclick="resetLocal()">Сбросить локальное сохранение</button>`;
c.innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addStat(k){if(!state.freePoints){toast('Нет свободных очков');return}state[k]++;state.freePoints--;save();openModal('profile')}
function equip(i){const it=state.items[i];state.items.forEach(x=>{if(x.id===it.id)x.equipped=!x.equipped});save();openModal('inventory')}
function dropItem(i){state.items.splice(i,1);save();openModal('inventory')}
function buy(id,cost,damage){if(state.coins<cost){toast('Недостаточно монет');return}state.coins-=cost;state.items.push({id,name:id==='heavy'?'Тяжёлый клинок':'Тактическая броня',icon:id==='heavy'?'🗡️':'🛡️',damage:id==='heavy'?damage:0,defense:id==='armor2'?damage:0,equipped:false});save();toast('Предмет куплен');openModal('inventory')}
function energyBuy(){if(state.coins<100){toast('Недостаточно монет');return}state.coins-=100;state.energy=Math.min(200,state.energy+30);save();toast('+30 энергии')}
function travel(id,need){if(state.level<need){toast('Уровень ещё не достаточен');return}state.district=id;save();closeModal();toast('Район: '+id)}
function daily(){state.coins+=100;state.energy=Math.min(200,state.energy+10);save();toast('+100 🟡 и +10 энергии')}
function spin(){if(state.coins<100){toast('Недостаточно монет');return}state.coins-=100;const s=['🍒','💎','7️⃣','⚔️'];const a=[s[Math.random()*4|0],s[Math.random()*4|0],s[Math.random()*4|0]];document.getElementById('slots').textContent=a.join(' ');if(a[0]===a[1]&&a[1]===a[2]){state.coins+=500;toast('Джекпот +500 🟡')}else toast('Повезёт в следующий раз');save()}
function resetLocal(){localStorage.removeItem('territory_save_v2');location.reload()}
function toggleLang(){state.lang=state.lang==='RU'?'EN':'RU';save();toast(state.lang==='EN'?'English':'Русский');closeModal()}
let enemy=null,attack=0,defs=[];
function startBattle(){enemy={name:['Уличный боец','Наёмник','Ледяной тролль','Чемпион арены'][Math.random()*4|0],hp:90+((Math.random()*4)|0)*35,maxHp:0,damage:8+((Math.random()*4)|0)*3,def:3};enemy.maxHp=enemy.hp;attack=0;defs=[];renderBattle()}
function renderBattle(){const c=document.getElementById('modalContent');c.innerHTML=`<h2>⚔️ Арена</h2><div class=enemy id=enemybox><div class=art>🥷</div><div><b>${enemy.name}</b><div class=hp><i id=ehp></i></div><small>${enemy.hp}/${enemy.maxHp} HP</small></div></div><div class=stat><b>Твой HP</b><b>${state.hp}/${state.maxHp}</b></div><h3>Атака — выбери 1 зону</h3><div class=zones>${Z.map((x,i)=>`<button class="zone ${attack===i?'selected':''}" onclick="pickAttack(${i})">${x}</button>`).join('')}</div><h3>Защита — заблокируй 2 зоны</h3><div class=zones>${Z.map((x,i)=>`<button class="zone def ${defs.includes(i)?'selected':''}" onclick="pickDef(${i})">${x}</button>`).join('')}</div><button class=primary onclick="turn()">⚔️ Провести ход</button><div id=battlelog class=log>Выбери атаку и две зоны защиты.</div>`;document.getElementById('modal').classList.add('show');updateEnemy()}
function pickAttack(i){attack=i;renderBattle()}
function pickDef(i){if(defs.includes(i))defs=defs.filter(x=>x!==i);else if(defs.length<2)defs.push(i);renderBattle()}
function turn(){if(defs.length!==2){toast('Нужно выбрать 2 зоны защиты');return}let log='';const crit=Math.random()<(state.strength/100);let dmg=Math.max(2,6+state.strength/3+(state.items.find(x=>x.equipped&&x.damage)?.damage||0)-enemy.def);if(crit)dmg*=2;if(Math.random()<.1){log='Ты промахнулся.'}else{enemy.hp-=Math.floor(dmg);log=`Ты ударил в ${Z[attack]} на ${Math.floor(dmg)} урона${crit?' — КРИТ!':''}.`}if(enemy.hp<=0){state.wins++;state.completedQuests++;state.coins+=100;gainXp(35);save();toast('Победа! +100 🟡');return renderBattle()}const edmg=enemy.damage;if(defs.includes(Math.random()*5|0)){log+=' Вражеская атака заблокирована.'}else{state.hp-=edmg;log+=` ${enemy.name} нанёс ${edmg} урона.`}if(state.hp<=0){state.hp=state.maxHp;state.losses++;state.coins=Math.max(0,state.coins-50);save();toast('Поражение: -50 🟡')}save();renderBattle();setTimeout(()=>{const l=document.getElementById('battlelog');if(l)l.textContent=log},10)}
function gainXp(n){state.exp+=n;while(state.exp>=state.maxExp){state.exp-=state.maxExp;state.level++;state.maxExp=Math.floor(state.maxExp*1.25);state.freePoints+=3;state.maxHp+=10;state.hp=state.maxHp}}
function updateEnemy(){const e=document.getElementById('ehp');if(e)e.style.width=Math.max(0,enemy.hp/enemy.maxHp*100)+'%'}
renderHud();setInterval(()=>{if(state.energy<200){state.energy=Math.min(200,state.energy+.25);save()}},60000);

// Territory s10 — cinematic self-contained city scene, GitHub only.
const host=document.getElementById('three');
host.innerHTML='<canvas id="cityCanvas"></canvas>';
const canvas=document.getElementById('cityCanvas'),ctx=canvas.getContext('2d');
let cw=1,ch=1,st=0;
function resizeScene(){const r=host.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cw=Math.max(1,r.width);ch=Math.max(1,r.height);canvas.width=cw*d;canvas.height=ch*d;canvas.style.width=cw+'px';canvas.style.height=ch+'px';ctx.setTransform(d,0,0,d,0,0)}
function poly(p,f,s,l=1){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=l;ctx.stroke()}}
function circle(x,y,r,f){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=f;ctx.fill()}
function rr(x,y,w,h,r,f,s,l=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=l;ctx.stroke()}}
function tower(x,base,w,h){ctx.fillStyle='#263d49';ctx.fillRect(x,base-h,w,h);ctx.fillStyle='#385765';ctx.fillRect(x+w*.12,base-h-28,w*.76,28);poly([[x-5,base-h-28],[x+w/2,base-h-70],[x+w+5,base-h-28]],'#516b76');for(let y=base-h+18;y<base-12;y+=19){ctx.fillStyle='#d9b84d';ctx.fillRect(x+w*.27,y,6,8);ctx.fillRect(x+w*.66,y,6,8)}}
function pine(x,y,s){ctx.fillStyle='#102f2d';ctx.fillRect(x-3*s,y,6*s,35*s);poly([[x,y-42*s],[x-30*s,y+8*s],[x+30*s,y+8*s]],'#104238');poly([[x,y-23*s],[x-36*s,y+28*s],[x+36*s,y+28*s]],'#155044')}
function lamp(x,y){ctx.fillStyle='#533522';ctx.fillRect(x-3,y,6,34);circle(x,y,5,'#fff0a0');const g=ctx.createRadialGradient(x,y,0,x,y,28);g.addColorStop(0,'#ffd36a');g.addColorStop(.25,'#ff8a2e');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.fill()}
function hero(x,y){
 ctx.save();ctx.translate(x,y+Math.sin(st*2)*2);
 // shadow
 ctx.fillStyle='#02070a99';ctx.beginPath();ctx.ellipse(0,118,70,18,0,0,Math.PI*2);ctx.fill();
 // boots/legs
 rr(-31,66,25,53,5,'#10191f','#5c7078',2);rr(6,66,25,53,5,'#10191f','#5c7078',2);
 // cloak
 poly([[-55,80],[-44,15],[-25,-5],[25,-5],[44,15],[55,80],[31,105],[-31,105]],'#182b35','#8398a0',2);
 // fur mantle
 circle(-34,13,23,'#4b4039');circle(34,13,23,'#4b4039');circle(-19,23,18,'#5d4d43');circle(19,23,18,'#5d4d43');
 // torso armor
 rr(-30,31,60,51,9,'#30444d','#a4b1b5',2);rr(-18,45,36,8,3,'#b98d43');
 // neck
