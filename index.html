<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://telegram.org"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Territory — Sdolars</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#020914;color:#fff;font-family:Arial,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{height:100dvh;width:100%;max-width:832px;margin:auto;display:flex;flex-direction:column;background:#031426;overflow:hidden}
.top{height:112px;flex:none;background:linear-gradient(#03182b,#031222);border-bottom:3px solid #0b8dd9;display:flex;padding:5px 8px;gap:5px}
.heroHead{width:42%;display:flex;align-items:center;gap:5px;min-width:0}
.avatar{width:64px;height:64px;border:2px solid #78d1ff;border-radius:12px;overflow:hidden;position:relative;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center}
.lvl{position:absolute;left:-2px;bottom:-2px;background:#082744;border:2px solid #72ccff;border-radius:8px;padding:1px 6px;font-size:14px;font-weight:900}
.title{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.chapter{font-size:12px;color:#76cbff;font-weight:900;margin-top:1px}
.xp{height:10px;max-width:155px;border:1px solid #237bb5;border-radius:8px;margin-top:3px;overflow:hidden;background:#071c2d}
.xp i{display:block;width:40%;height:100%;background:#10c8f1}
.xpt{font-size:10px;margin-top:1px}
.hud{flex:1;min-width:0}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.res{height:34px;background:#061c31;border:2px solid #1b72ad;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;white-space:nowrap}
.res b{font-size:14px;margin-right:2px}.coin b{color:#ffd52d}.dia b{color:#4eeaff}.ene b{color:#ffd52d}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:3px}
.tool{height:34px;background:#082540;border:2px solid #1b71ad;border-radius:8px;position:relative;font-size:15px;display:grid;place-items:center}
.world{position:relative;flex:1;min-height:0;background:#071b2b url('assets/home-screen.png') center/cover no-repeat;overflow:hidden}
.world:after{content:"";position:absolute;inset:0;background:rgba(0,8,15,.15);pointer-events:none}
.world>*{z-index:2}
.quest,.daily,.left,.right,.actions{position:absolute}
.quest{left:2%;top:2%;width:42%;height:74px;padding:6px 8px;text-align:left;border:2px solid #178bd8;border-radius:11px;background:rgba(6,29,52,0.85)}
.quest small{color:#ffd42b;font-size:11px;font-weight:900}
.quest strong{display:block;font-size:13px;margin-top:4px}.quest span{display:block;color:#a5cce7;font-size:9px;margin-top:4px}
.daily{right:2%;top:3%;width:35%;height:72px;border:2px solid #ffd129;border-radius:11px;background:rgba(33,16,68,0.85);text-align:center;padding:5px}
.daily b{display:block;color:#ffd42b;font-size:11px;margin-top:10px}.daily time{display:block;font-size:13px;font-weight:900;margin-top:5px}
.left{left:2%;top:27%;display:flex;flex-direction:column;gap:5px}
.smallBtn{width:50px;height:50px;border:1.5px solid #1688d5;border-radius:10px;background:rgba(8,43,72,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:900}
.right{right:2%;top:29%;width:41%;display:flex;flex-direction:column;gap:5px}
.location{height:50px;border:1.5px solid #1688d5;border-radius:10px;background:rgba(8,43,72,0.8);display:flex;align-items:center;gap:5px;padding:3px 5px;text-align:left}
.location strong{font-size:11px}.location small{display:block;color:#a5cce7;font-size:8px;margin-top:1px}
.actions{left:2%;right:2%;bottom:4%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.action{height:58px;border-radius:10px;border:2px solid #148fe4;background:linear-gradient(#0a4d89,#071e3d);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:11px}
.bottom{height:62px;flex:none;background:#03182b;border-top:2px solid #124b71;display:grid;grid-template-columns:repeat(6,1fr)}
.bottom button{background:#03192d;border:0;color:#a0c1da;font-size:8px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bottom .active{color:#ffd52a!important}
.modal{position:fixed;inset:0;background:#000b;z-index:30;display:none;align-items:flex-end}.modal.open{display:flex}
.panel{width:100%;max-height:90dvh;overflow:auto;background:#061d34;border:2px solid #1888d5;border-radius:18px 18px 0 0;padding:14px}
.close{float:right;background:#123653;border:1px solid #3183bd;border-radius:8px;padding:4px 8px}
.card{background:#09213a;border:1px solid #246e9f;border-radius:11px;padding:10px;margin:6px 0}
.goldBtn{width:100%;padding:10px;background:linear-gradient(#ffd652,#bd7200);border:2px solid #ffe17c;border-radius:9px;color:#180d00;font-weight:900}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.zones button{background:#0c2e4b;border:1px solid #3186bd;border-radius:7px;padding:12px 2px;font-size:11px;font-weight:900}
.zones .sel{background:#147bb4;border-color:#ffd54a}
.toast{position:fixed;z-index:50;left:50%;bottom:82px;transform:translateX(-50%);background:#07233c;border:2px solid #35b9ff;border-radius:9px;padding:8px 12px;font-weight:900;display:none}.toast.show{display:block}
body.battle-open .bottom,body.battle-open .actions{display:none!important}
</style>
</head>
<body>
<div id="app">
<header class="top">
<div class="heroHead"><div class="avatar"><img src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='50' height='50'><circle cx='25' cy='25' r='20' fill='%23178bd8'/></svg>"><div class="lvl" id="lvlBox">3</div></div><div><div class="title" id="pName">Игрок</div><div class="chapter" id="pDistrict">Центральная площадь</div><div class="xp"><i id="xpBar" style="width:40%"></i></div><div class="xpt" id="xpText">120/150 XP</div></div></div>
<div class="hud"><div class="resources"><div class="res"><b>🪙</b><span id="resCoins">0</span></div><div class="res"><b>◆</b><span id="resGems">0</span></div><div class="res"><b>ϟ</b><span id="resEnergy">0</span></div></div>
<div class="tools"><button class="tool" onclick="openP('messages')">💬</button><button class="tool" onclick="openP('achievements')">🏆</button><button class="tool" onclick="openP('settings')">⚙</button><button class="tool" onclick="toggleLang()">RU</button></div></div>
</header>
<main class="world">
<button class="quest" onclick="openP('quests')"><small>Текущее задание</small><strong>Поговори с кузнецом ›</strong><span>⌖ Кузница</span></button>
<div class="daily"><b>Бонус доступен</b><time id="timer">00:00:00</time></div>
<div class="left"><button class="smallBtn" onclick="openP('bonus')">🎁<br>Бонус</button><button class="smallBtn" onclick="openP('events')">▦<br>Ивенты</button></div>
<div class="right"><button class="location" onclick="openP('forge')">⚒️<div><strong>Кузница</strong><small>Улучшение оружия</small></div></button><button class="location" onclick="openP('shop')">🎒<div><strong>Магазин</strong><small>Снаряжение</small></div></button></div>
<div class="actions"><button class="action" onclick="startBattle()">⚔️<br>Бой</button><button class="action" onclick="openP('inventory')">🎒<br>Инвентарь</button><button class="action" onclick="openP('map')">🗺️<br>Районы</button><button class="action" onclick="openP('guild')">👥<br>Гильдия</button></div>
</main>
<nav class="bottom"><button class="active" onclick="closeP()">🏠<br>Город</button><button onclick="openP('hero')">👤<br>Герой</button><button onclick="openP('inventory')">🎒<br>Инвентарь</button><button onclick="openP('quests')">📜<br>Задания</button><button onclick="openP('guild')">👥<br>Гильдия</button><button onclick="openP('more')">☰<br>Ещё</button></nav>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeP()"><section class="panel"><button class="close" onclick="closeP()">✕</button><h2 id="pt"></h2><div id="pb"></div></section></div><div class="toast" id="toast"></div>
<script>
const ZONES=['Голова','Грудь','Пояс','Ноги'];
let state={};let currentBattle=null;let moveAttack=null;let moveDefs=[];let ws=null;
function toast(m){const e=document.getElementById('toast');if(e){e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}}
async function callApi(p,b={}){
  const init=window.Telegram?.WebApp?.initData||"";
  try{
    const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':init},body:JSON.stringify(b)});
    const d=await r.json();if(d.ok){if(d.player){state=d.player;updateHud()}return d;}else{toast(d.error||'Ошибка');}
  }catch{toast('Ошибка сети');}return null;
}
function updateHud(){
  if(!state.playerName)return;
  document.getElementById('pName').textContent=state.playerName;
  document.getElementById('lvlBox').textContent=state.level;
  document.getElementById('xpText').textContent=`${state.exp}/${state.maxExp} XP`;
  document.getElementById('xpBar').style.width=(state.exp/state.maxExp*100)+'%';
  document.getElementById('resCoins').textContent=state.coins;
  document.getElementById('resGems').textContent=state.gems;
  document.getElementById('resEnergy').textContent=Math.floor(state.energy);
  const curD=state.district==='square'?'Центральная площадь':state.district==='forest'?'Северный лес':state.district==='harbor'?'Порт Sdolars':state.district==='industrial'?'Промзона':'Старая крепость';
  document.getElementById('pDistrict').textContent=curD;
}
async function startBattle(){
  const d=await callApi('action',{type:'battle.start'});
  if(d&&d.battle){currentBattle=d.battle;renderBattle(d.battle)}
}
function renderBattle(b){
  document.body.classList.add('battle-open');moveAttack=null;moveDefs=[];
