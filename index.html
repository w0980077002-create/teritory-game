<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090a0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Territory — Sdolars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#08090a;--panel:#121313;--line:#3b3225;--gold:#c99a4a;--text:#eee8dc;--muted:#8e897f}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100dvh;overscroll-behavior:none}
    button{font:inherit}
    #game{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(circle at 50% 22%,rgba(128,91,43,.22),transparent 34%),
      radial-gradient(circle at 15% 75%,rgba(71,51,29,.14),transparent 28%),
      linear-gradient(180deg,#111214 0%,#0a0b0c 48%,#070809 100%)}
    #scene{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px calc(74px + env(safe-area-inset-bottom));}
    .hud{height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:5}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}
    .crest{width:38px;height:38px;border:1px solid #6c512c;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#2a2116,#111);box-shadow:0 6px 20px #0008;font-size:20px}
    .brand strong{display:block;font-family:Georgia,serif;letter-spacing:1.2px;font-size:18px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px;letter-spacing:.7px;text-transform:uppercase}
    .hudstats{display:flex;gap:5px}.pill{border:1px solid #332d25;background:#121211cc;border-radius:11px;padding:7px 9px;font-size:11px;white-space:nowrap}.pill b{color:#e6c98f}
    .stage{position:relative;flex:1;min-height:0;border:1px solid #302a23;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(28,27,25,.52),rgba(6,7,8,.72));box-shadow:inset 0 1px #ffffff08,0 18px 50px #0008}
    .sky{position:absolute;inset:0;background:linear-gradient(180deg,rgba(77,61,43,.16),transparent 35%,rgba(0,0,0,.45));}
    .moon{position:absolute;width:100px;height:100px;border-radius:50%;right:10%;top:12%;background:radial-gradient(circle at 35% 35%,#eee2c6,#a99678 62%,#635a4d 100%);opacity:.18;filter:blur(.2px)}
    .cityline{position:absolute;left:-5%;right:-5%;bottom:23%;height:28%;opacity:.72;background:linear-gradient(180deg,transparent,#080909 12%),polygon(0 100%,0 58%,7% 58%,7% 40%,13% 40%,13% 67%,20% 67%,20% 28%,26% 28%,26% 56%,33% 56%,33% 46%,38% 46%,38% 66%,45% 66%,45% 20%,52% 20%,52% 58%,60% 58%,60% 34%,66% 34%,66% 61%,73% 61%,73% 42%,80% 42%,80% 55%,87% 55%,87% 30%,93% 30%,93% 60%,100% 60%,100% 100%);clip-path:polygon(0 100%,0 58%,7% 58%,7% 40%,13% 40%,13% 67%,20% 67%,20% 28%,26% 28%,26% 56%,33% 56%,33% 46%,38% 46%,38% 66%,45% 66%,45% 20%,52% 20%,52% 58%,60% 58%,60% 34%,66% 34%,66% 61%,73% 61%,73% 42%,80% 42%,80% 55%,87% 55%,87% 30%,93% 30%,93% 60%,100% 60%,100% 100%)}
    .road{position:absolute;left:18%;right:18%;bottom:-6%;height:43%;background:linear-gradient(100deg,transparent 0 43%,#181715 43% 57%,transparent 57%);opacity:.75;transform:perspective(400px) rotateX(50deg)}
    .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 18px 110px}
    .location{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#a18b68;margin-bottom:8px}.title{font:700 clamp(32px,10vw,54px)/.95 Georgia,serif;letter-spacing:1px;text-shadow:0 8px 30px #000}.subtitle{max-width:300px;color:#aaa49a;font-size:12px;line-height:1.45;margin-top:10px}
    .status{margin-top:16px;display:inline-flex;align-items:center;gap:7px;border:1px solid #403628;background:#0e0f0fcc;border-radius:999px;padding:8px 12px;color:#c5bdaf;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:#8e713d;box-shadow:0 0 12px #8e713d}
    .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#746e65;font-size:9px;white-space:nowrap}
    .splash{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:#08090a;transition:opacity .25s ease}.splash.hide{opacity:0;pointer-events:none}.splashbox{text-align:center}.splashbox .crest{margin:0 auto 12px;width:54px;height:54px;font-size:26px}.splashbox strong{font:700 28px Georgia,serif;letter-spacing:2px}.splashbox small{display:block;margin-top:6px;color:#777168;font-size:10px;letter-spacing:2px;text-transform:uppercase}
    @media(max-width:370px){.hudstats .pill:nth-child(2){display:none}.brand strong{font-size:16px}}
  </style>
</head>
<body>
  <main id="game">
    <section id="scene">
      <header class="hud">
        <div class="brand"><div class="crest">⚔️</div><div><strong>Territory</strong><span>Sdolars · Web App</span></div></div>
        <div class="hudstats"><div class="pill">🪙 <b id="coins">—</b></div><div class="pill">LV <b id="level">—</b></div></div>
      </header>
      <section class="stage" aria-label="Игровая сцена">
        <div class="sky"></div><div class="moon"></div><div class="cityline"></div><div class="road"></div>
        <div class="center">
          <div class="location">Sdolars</div>
          <div class="title">Territory</div>
          <div class="subtitle">Город, где каждый район имеет цену, а каждый бой меняет твоё положение.</div>
          <div class="status"><i class="dot"></i><span id="connection">Подготовка игры…</span></div>
        </div>
        <div class="hint">Открой разделы снизу: персонаж · рюкзак · рынок · квесты · Сдоларс · арена</div>
      </section>
    </section>
  </main>
  <div class="splash" id="splash"><div class="splashbox"><div class="crest">⚔️</div><strong>Territory</strong><small>Sdolars</small></div></div>

  <!-- Главный клиент игры. Сервер S102 также умеет автоматически внедрять его, поэтому повторно не добавляет второй экземпляр. -->
  <script src="/s102-client.js?v=104"></script>
  <script>
    (function(){
      const tg=window.Telegram&&Telegram.WebApp;
      try{tg&&tg.ready&&tg.ready();tg&&tg.expand&&tg.expand();}catch(e){}
      setTimeout(()=>document.getElementById('splash')?.classList.add('hide'),450);
      const c=document.getElementById('connection');
      fetch('/api/character?id='+encodeURIComponent((tg?.initDataUnsafe?.user?.id)||localStorage.getItem('territory_player_id')||''))
        .then(r=>r.ok?r.json():Promise.reject())
        .then(d=>{if(d?.stats){document.getElementById('coins').textContent=d.stats.coins;document.getElementById('level').textContent=d.stats.level;c.textContent='Система Territory подключена'}})
        .catch(()=>{c.textContent='Игровой интерфейс готов';});
    })();
  </script>
</body>
</html>
