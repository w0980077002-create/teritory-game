<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#06111f">
  <title>Territory — Sdolars</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div class="world" aria-label="Город Sdolars"></div>
    <div class="vignette"></div>
    <div class="city-hero-wrap" aria-hidden="true">
      <div class="city-hero-ground"></div>
      <img src="scene_smallhero.jpg" class="city-hero" alt="">
      <button class="hero-vip" data-action="vip"><span>♛</span><b>VIP</b></button>
    </div>

    <header class="top-hud">
      <button class="profile card-btn" data-action="profile">
        <img src="scene_smallhero.jpg" class="avatar-crop" alt="">
        <span class="level">5</span>
        <span class="profile-copy">
          <b>Territory</b>
          <small>Глава 5 · Уровень 3</small>
          <span class="xp"><i></i><em>120/300</em></span>
        </span>
      </button>

      <div class="resources">
        <button class="resource crystal" data-resource="crystals"><span class="res-icon">◆</span><strong id="crystals">1330</strong><b>+</b></button>
        <button class="resource gold" data-resource="gold"><span class="res-icon">★</span><strong id="gold">1779</strong><b>+</b></button>
        <button class="resource energy" data-resource="energy"><span class="res-icon">ϟ</span><strong id="energy">191/200</strong><b>+</b></button>
      </div>
    </header>

    <nav class="top-actions">
      <button class="mini-btn" data-action="messages"><span>✉</span><i>2</i><small>Сообщения</small></button>
      <button class="mini-btn" data-action="achievements"><span>🏆</span><small>Достижения</small></button>
      <button class="mini-btn" data-action="settings"><span>⚙</span><small>Настройки</small></button>
      <button class="mini-btn lang" data-action="language"><span>🇬🇧</span><small>EN</small></button>
    </nav>

    <section class="quest card-panel" data-action="quest">
      <span class="scroll">📜</span>
      <div><b>Текущее задание</b><strong>Поговори с кузнецом</strong><small>📍 Кузница</small></div>
      <span class="arrow">›</span>
    </section>

    <button class="daily card-panel" data-action="daily">
      <span class="chest">🎁</span>
      <span><b>Ежедневный бонус</b><strong id="dailyTimer">23:45:12</strong></span>
    </button>

    <aside class="side left">
      <button class="side-btn gift" data-action="bonuses"><span>🎁</span><b>Бонусы</b><i>!</i></button>
      <button class="side-btn event" data-action="events"><span>▦</span><b>События</b><i>!</i></button>
      <button class="side-btn game" data-action="game"><span>🎮</span><b>Game</b></button>
    </aside>

    <aside class="side right">
      <button class="side-btn forge" data-action="forge"><span>⚒</span><b>Кузница</b><i>!</i></button>
      <button class="side-btn tavern" data-action="tavern"><span>🍺</span><b>Таверна</b><i>!</i></button>
      <button class="side-btn shop" data-action="shop"><span>🛍</span><b>Магазин</b><i>!</i></button>
    </aside>

    <section class="bottom-nav">
      <button class="nav-btn blue" data-action="fight"><span>⚔️</span><b>Бой</b></button>
      <button class="nav-btn red" data-action="arena"><span>🏳️</span><b>Арена</b></button>
      <button class="nav-btn orange" data-action="inventory"><span>🎒</span><b>Инвентарь</b></button>
      <button class="nav-btn purple" data-action="equipment"><span>🛡️</span><b>Экипировка</b></button>
      <button class="nav-btn green" data-action="tasks"><span>📜</span><b>Задания</b></button>
      <button class="nav-btn cyan" data-action="map"><span>🗺️</span><b>Карта</b></button>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="close" data-close>×</button>
      <h2 id="modalTitle">Territory</h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
