server {
    listen 10000;
    listen [::]:10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Telegram WebApp / SPA entry: never keep stale HTML.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;

        # Force a fresh cache key for the approved HOME foundation assets.
        # This avoids Telegram/mobile WebView serving the old HOME renderer.
        sub_filter_types text/html;
        sub_filter 'home-rebuild.css?v=401' 'home-rebuild.css?v=9002';
        sub_filter 'home-rebuild.js?v=403' 'home-rebuild.js?v=9002';
        sub_filter_once on;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }
}
