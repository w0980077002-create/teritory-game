server {
    listen 10000;
    listen [::]:10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Telegram WebApp / SPA entry: always revalidate the HTML.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # HTML routes should never be served from a stale browser cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    }

    # JS/CSS must revalidate after every Render deploy. The existing ?v=403
    # query strings remain valid; ETag/Last-Modified will detect the build.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Images can be cached; their filenames are stable repository assets.
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }
}
