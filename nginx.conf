server {
    listen 10000;
    listen [::]:10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;

        sub_filter_types text/html;
        sub_filter 'reference-ui.css?v=9001' 'reference-ui.css?v=9001';
        sub_filter 'reference-ui.js?v=9001' 'reference-ui.js?v=9001';
        sub_filter_once off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
    }

    location ~* \.js$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location ~* \.css$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }
}
