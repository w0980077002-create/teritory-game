services:
  - type: web
    name: teritory-game
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: teritory-db
          property: connectionString

databases:
  - name: teritory-db
    databaseName: teritory
    user: teritory
    plan: free
